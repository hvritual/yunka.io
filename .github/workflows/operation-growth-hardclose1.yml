name: operation-growth-hardclose1

on:
  push:
    branches:
      - control/operation-growth-boundary-gate-20260917
    paths:
      - .github/workflows/operation-growth-hardclose1.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: control/operation-growth-boundary-gate-20260917
          path: controller
          fetch-depth: 0
      - name: Checkout exact product candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/161-operation-growth-boundary-gate
          path: product
          fetch-depth: 0
      - name: Verify exact candidate and unchanged main
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "5a4df7060cb7c4a5e78b8076053d3569fd299a30"
          test "$(git rev-parse HEAD^{tree})" = "c90754252143f4b1ed905e6f550c3db4828a1bd5"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
      - name: Load locked toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source product/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: |
            product/app/go.sum
            product/framework/go.sum
            product/gateway/go.sum
            product/infras/go.sum
            product/pkg/go.sum
      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Prime locked RPC generator tools
        shell: bash
        run: |
          set -euo pipefail
          cd product
          make rpc-generate
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Apply hard closure 1
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../controller/tools/operation_growth_hardclose1.py
          python3 ../controller/tools/operation_growth_hardclose1_fix.py
          gofmt -w \
            app/cmd/add/boundary_gate.go \
            app/cmd/add/plan_validation.go \
            app/cmd/add/main_test.go \
            app/cmd/add/boundary_gate_test.go \
            app/cmd/change/changeset.go \
            app/cmd/change/changeset_test.go \
            app/cmd/change/pressure_qualification_test.go
          git diff --check
      - name: Create unpushed hardclose candidate
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "Yunka Delivery"
          git config user.email "quality-delivery@example.invalid"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(boundary): bind operation plans to exact Git base"
          test "$(git rev-parse HEAD^)" = "5a4df7060cb7c4a5e78b8076053d3569fd299a30"
          test -z "$(git status --porcelain)"
          echo "candidate=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
      - name: Focused hardclose qualification
        shell: bash
        run: |
          set -euo pipefail
          cd product
          make toolchain-check
          (cd pkg && go test -count=1 ./contract)
          (cd app && go test -count=1 ./cmd/boundarycore ./cmd/add ./cmd/projectflow ./cmd/change ./cmd/audit ./cmd/auditcore)
          make tidy
          git diff --exit-code -- go.work go.work.sum pkg/go.mod pkg/go.sum framework/go.mod framework/go.sum gateway/go.mod gateway/go.sum infras/go.mod infras/go.sum app/go.mod app/go.sum
          make contract
          git diff --exit-code -- contracts/generated
          make contract-check
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Publish hardclose1 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD^)" = "5a4df7060cb7c4a5e78b8076053d3569fd299a30"
          test "$(git rev-parse origin/fix/161-operation-growth-boundary-gate)" = "5a4df7060cb7c4a5e78b8076053d3569fd299a30"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test -z "$(git status --porcelain)"
          git push origin HEAD:fix/161-operation-growth-boundary-gate
          echo "published=$(git rev-parse HEAD)"
