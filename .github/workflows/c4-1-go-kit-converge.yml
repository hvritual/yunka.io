name: c4-1-go-kit-converge

on:
  push:
    branches:
      - fix/c4-1-module-publication-convergence
    paths:
      - .github/workflows/c4-1-go-kit-converge.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: fix/c4-1-module-publication-convergence
      RC_VERSION: v0.1.0-c41rc2
      GONOPROXY: github.com/hvritual/yunka.io/*
      GONOSUMDB: github.com/hvritual/yunka.io/*
    steps:
      - name: Checkout C4.1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/c4-1-module-publication-convergence
          fetch-depth: 0

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.13
          cache: false

      - name: Converge historical go-kit graph
        shell: bash
        run: |
          set -euo pipefail

          # RC1 proved module/tag identity but exposed an unreachable transitive
          # dependency in go-kit/kit v0.10.0. RC2 keeps the same module contract
          # and raises the compatible go-kit floor only.
          for file in framework/go.mod gateway/go.mod app/go.mod tools/module-release.env docs/waves/C4.1-module-publication-convergence.md; do
            if [[ -f "$file" ]]; then
              sed -i 's/v0\.1\.0-c41rc1/v0.1.0-c41rc2/g' "$file"
            fi
          done

          (cd pkg && GOWORK=off go mod edit -require=github.com/go-kit/kit@v0.13.0)
          (cd framework && GOWORK=off go mod edit -require=github.com/go-kit/kit@v0.13.0)
          (cd gateway && GOWORK=off go mod edit -require=github.com/go-kit/kit@v0.13.0)

          # Tidy each module independently. Local sibling replacements exist only
          # during this runner step and are removed before the candidate commit.
          (cd pkg && GOWORK=off go mod tidy)
          (cd framework && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg)
          (cd gateway && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/framework=../framework && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/framework)
          (cd app && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg)

          rm -f go.work.sum

          if grep -n '^replace ' pkg/go.mod framework/go.mod gateway/go.mod; then
            echo 'publishable module go.mod contains replace directive' >&2
            exit 1
          fi
          if grep -R -n 'github.com/go-kit/kit v0.10.0' pkg/go.mod framework/go.mod gateway/go.mod app/go.mod; then
            echo 'historical go-kit v0.10.0 remains in module contract' >&2
            exit 1
          fi
          if grep -R -n 'v0.1.0-c41rc1' framework/go.mod gateway/go.mod app/go.mod tools/module-release.env; then
            echo 'RC1 sibling reference remains in RC2 contract' >&2
            exit 1
          fi

          cat >> docs/waves/C4.1-module-publication-convergence.md <<'EOF'

          ## RC2 dependency convergence

          RC1 validated the GitHub multi-module identity and tag layout, but removing the
          repository-local go-kit compatibility module exposed the historical
          `github.com/go-kit/kit v0.10.0` dependency graph. That graph reaches the removed
          `github.com/lyft/protoc-gen-validate v0.0.13` repository through old Zipkin/gRPC
          dependencies. RC2 raises `github.com/go-kit/kit` to `v0.13.0`, which preserves
          the legacy `kit/log` and `kit/log/level` compatibility packages used by the
          Aliyun SLS SDK while using the maintained dependency graph. No local `replace`
          is added to any publishable module.
          EOF

      - name: Commit exact RC2 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/c4-1-rc-qualify.yml
          git rm -f .github/workflows/c4-1-go-kit-converge.yml
          git add -A
          git commit -m 'build: converge C4.1 publishable dependency graph'
          git push origin "HEAD:${BRANCH}"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish RC2 tags and qualify exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            git push origin \
              :refs/tags/pkg/${RC_VERSION} \
              :refs/tags/framework/${RC_VERSION} \
              :refs/tags/gateway/${RC_VERSION} || true
          }
          trap cleanup ERR

          for prefix in pkg framework gateway; do
            if git ls-remote --exit-code --tags origin "refs/tags/${prefix}/${RC_VERSION}" >/dev/null 2>&1; then
              echo "RC2 tag already exists: ${prefix}/${RC_VERSION}" >&2
              exit 1
            fi
            git tag "${prefix}/${RC_VERSION}" "$CANDIDATE_SHA"
          done
          git push origin \
            "refs/tags/pkg/${RC_VERSION}" \
            "refs/tags/framework/${RC_VERSION}" \
            "refs/tags/gateway/${RC_VERSION}"

          for prefix in pkg framework gateway; do
            resolved="$(git ls-remote --tags origin "refs/tags/${prefix}/${RC_VERSION}" | awk '{print $1}')"
            test "$resolved" = "$CANDIDATE_SHA"
          done

          echo '==> source workspace qualification'
          for module in pkg framework gateway app; do
            echo "==> workspace ${module}"
            (cd "$module" && go test ./... && go vet ./... && go build ./...)
          done

          echo '==> standalone module qualification'
          for module in pkg framework gateway app; do
            echo "==> GOWORK=off ${module}"
            (cd "$module" && \
              GOWORK=off go list -m all >/dev/null && \
              GOWORK=off go test ./... && \
              GOWORK=off go vet ./... && \
              GOWORK=off go build ./...)
          done

          echo '==> clean external consumer qualification'
          tmp="$(mktemp -d)"
          cd "$tmp"
          GOWORK=off go mod init yunka-c41-rc2-external-probe >/dev/null
          GOWORK=off go get "github.com/hvritual/yunka.io/pkg@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/framework@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/gateway@${RC_VERSION}"
          GOWORK=off go list -m all >/dev/null
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/pkg)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/framework)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/gateway)" = "$RC_VERSION"
          cd - >/dev/null
          rm -rf "$tmp"

          trap - ERR
          echo "C4.1 RC2 qualified at ${CANDIDATE_SHA}"
