name: qualify-c9-rest-old-status

on:
  push:
    branches: [codex/control-c9-rest-error-reproduction]
    paths:
      - .github/workflows/qualify-c9-rest-old-status.yml

permissions:
  contents: read

jobs:
  reproduce-old-status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hvritual/yunka.io
          ref: 517449d43db4d7b9da854f46d184ec599446a7e8
          path: old
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hvritual/yunka.io
          ref: dfebf2527d2a79d7e02e5fa0ff4e6a3a43cdd519
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache: false
      - name: Install project-locked protoc and generators
        shell: bash
        run: |
          set -euo pipefail
          source candidate/tools/toolchain.env
          archive="$RUNNER_TEMP/protoc.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_LINUX_X86_64_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$archive" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C candidate rpc-tools
          make -C candidate rpc-toolchain-check
      - name: Reproduce HTTP 400 from original generated C9 REST using identical new behavior probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = 517449d43db4d7b9da854f46d184ec599446a7e8
          test "$(git -C candidate rev-parse HEAD)" = dfebf2527d2a79d7e02e5fa0ff4e6a3a43cdd519
          test -z "$(git -C old status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"
          # Copy *only* the reusable behavior probe into an ephemeral old
          # checkout. Old production generator and Gateway remain untouched.
          cp candidate/pkg/contract/http_binding_runtime_test.go old/pkg/contract/http_binding_runtime_test.go
          test "$(git -C old diff --name-only)" = pkg/contract/http_binding_runtime_test.go
          mkdir -p "$RUNNER_TEMP/c9-rest-negative"
          (
            cd old/pkg
            set +e
            YUNKA_REQUIRE_C9_RUNTIME=1 \
              PROTOC="$(command -v protoc)" \
              PROTOC_GEN_GO="$GITHUB_WORKSPACE/candidate/.yunka/bin/protoc-gen-go" \
              PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/candidate/.yunka/bin/protoc-gen-go-grpc" \
              go test -count=1 -timeout=8m -run '^TestGeneratedHTTPBindingTransportParity$' ./contract -v \
              > "$RUNNER_TEMP/c9-rest-negative/old-runtime.txt" 2>&1
            rc=$?
            set -e
            test "$rc" -ne 0
          )
          grep -F 'TestGeneratedRESTStatusMatchesApplicationGRPCStatusWithoutLeakingDetails/missing' \
            "$RUNNER_TEMP/c9-rest-negative/old-runtime.txt"
          grep -F 'REST status=400 want=404' "$RUNNER_TEMP/c9-rest-negative/old-runtime.txt"
          {
            printf 'old_main=%s\n' "$(git -C old rev-parse HEAD)"
            printf 'old_tree=%s\n' "$(git -C old rev-parse HEAD^{tree})"
            printf 'qualified_candidate=%s\n' "$(git -C candidate rev-parse HEAD)"
            printf 'behavior_probe_sha256='
            sha256sum candidate/pkg/contract/http_binding_runtime_test.go | awk '{print $1}'
            printf 'old_generation_verdict=HTTP_400_REPRODUCED\n'
          } > "$RUNNER_TEMP/c9-rest-negative/identities.txt"
          test -z "$(git -C candidate status --porcelain)"
          test "$(git -C old diff --name-only)" = pkg/contract/http_binding_runtime_test.go
          cat "$RUNNER_TEMP/c9-rest-negative/identities.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: old-c9-rest-status-negative-control
          path: ${{ runner.temp }}/c9-rest-negative
          retention-days: 30
          if-no-files-found: warn
