name: c8-5-split-fix005

on:
  push:
    branches:
      - agent/c8-5-biz-builder
    paths:
      - .github/workflows/c8-5-split-fix005.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Split canonical patch part 005
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/c8-5-biz-result.part-005)" = "312df2142dd4edca97c4c491c794636654cc1103"
          rm -f tools/c8-5-fix005.part-*
          split -b 500 -d -a 2 tools/c8-5-biz-result.part-005 tools/c8-5-fix005.part-
          test "$(find tools -maxdepth 1 -name 'c8-5-fix005.part-*' | wc -l | tr -d ' ')" = "8"
          cat tools/c8-5-fix005.part-* | cmp -s - tools/c8-5-biz-result.part-005
          git config user.name "yunka-c8-5-biz-builder"
          git config user.email "yunka-c8-5-biz-builder@users.noreply.github.com"
          git add tools/c8-5-fix005.part-*
          git commit -m "ci: split canonical C8.5 patch part 005"
          git push origin HEAD:agent/c8-5-biz-builder
