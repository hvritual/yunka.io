name: http-binding-qualification
on:
  push:
    branches: [control/http-binding-semantics]
    paths: [.github/workflows/http-binding-qualification.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTROL_SHA: ${{ github.sha }}
      BASE_SHA: d7902c98cc124d0b55fb7081df015633c550a0a0
      OUTPUT_BRANCH: fix/http-binding-semantics
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d7902c98cc124d0b55fb7081df015633c550a0a0
          fetch-depth: 0
      - name: Check scoped payload integrity before executing any tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/http-binding"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          git show "$CONTROL_SHA:.control/install_binding.py" > "$RUNNER_TEMP/install_binding.py"
          python3 "$RUNNER_TEMP/install_binding.py" runtime
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            pkg/go.sum
            framework/go.sum
            gateway/go.sum
      - name: Install locked protoc and generators
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          curl --fail --silent --show-error --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "$PROTOC_LINUX_X86_64_SHA256  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          export PATH="$RUNNER_TEMP/protoc/bin:$PATH"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make toolchain-check rpc-tools rpc-toolchain-check
      - name: Require actual parameter loss on unchanged production source
        shell: bash
        run: |
          set -euo pipefail
          export PROTOC="$(command -v protoc)" PROTOC_GEN_GO="$PWD/.yunka/bin/protoc-gen-go" PROTOC_GEN_GO_GRPC="$PWD/.yunka/bin/protoc-gen-go-grpc" YUNKA_REQUIRE_C9_RUNTIME=1
          set +e
          (cd pkg && go test -count=1 -v ./contract -run '^TestGeneratedHTTPBindingTransportParity$') > "$RUNNER_TEMP/http-binding/runtime-red.log" 2>&1
          code=$?
          set -e
          tail -n 100 "$RUNNER_TEMP/http-binding/runtime-red.log"
          test "$code" -ne 0
          grep -q 'HTTP_BINDING_PARAMETER_LOSS' "$RUNNER_TEMP/http-binding/runtime-red.log"
          git diff --exit-code
          sha256sum pkg/contract/http_binding_runtime_test.go > "$RUNNER_TEMP/http-binding/test-source.sha256"
      - name: Apply the bounded shared binding implementation and run parity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/install_binding.py" implementation
          git diff --check
          export PROTOC="$(command -v protoc)" PROTOC_GEN_GO="$PWD/.yunka/bin/protoc-gen-go" PROTOC_GEN_GO_GRPC="$PWD/.yunka/bin/protoc-gen-go-grpc" YUNKA_REQUIRE_C9_RUNTIME=1
          (cd pkg && go test -count=1 -v ./contract -run '^(TestHTTPBinding|TestGeneratedHTTPBindingTransportParity)') > "$RUNNER_TEMP/http-binding/runtime-green.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/http-binding/runtime-green.log"; exit 1; }
          tail -n 120 "$RUNNER_TEMP/http-binding/runtime-green.log"
          sha256sum -c "$RUNNER_TEMP/http-binding/test-source.sha256"
          (cd pkg && YUNKA_REQUIRE_C9_RUNTIME=0 go test -count=1 ./contract) > "$RUNNER_TEMP/http-binding/contract-regression.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/http-binding/contract-regression.log"; exit 1; }
          make contract contract-check > "$RUNNER_TEMP/http-binding/artifact-reproducibility.log" 2>&1
          git diff --exit-code -- contracts/generated
      - name: Commit only the reviewed product delta with Runner-local Git
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {'Makefile','docs/STATUS.md','docs/architecture/HTTP-BINDING-SEMANTICS.md','pkg/contract/source_provenance.go','pkg/contract/model.go','pkg/contract/compiler.go','pkg/contract/c9_application_codegen.go','pkg/contract/application_codegen.go','pkg/contract/lint.go','pkg/contract/openapi.go','pkg/contract/typescript.go','pkg/contract/http_binding_plan.go','pkg/contract/http_binding_codegen.go','pkg/contract/http_binding_openapi.go','pkg/contract/http_binding_plan_test.go','pkg/contract/http_binding_runtime_test.go'}
          actual = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) | set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert actual == expected, (actual-expected,expected-actual)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          PY
          git diff --cached --check
          git config user.name 'Yunka Delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -z "$(git ls-remote --heads origin "$OUTPUT_BRANCH")"
          git switch -c "$OUTPUT_BRANCH"
          git commit -m 'fix(contract): preserve HTTP query semantics across generated transports'
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/http-binding/candidate.txt"
          python3 -B tools/qualify_branch_baseline.py --mode pr --base-ref main --base-sha "$BASE_SHA" --checked-sha "$(git rev-parse HEAD)" > "$RUNNER_TEMP/http-binding/baseline.json"
          git diff "$BASE_SHA" HEAD > "$RUNNER_TEMP/http-binding/product.patch"
          git archive --format=tar HEAD > "$RUNNER_TEMP/http-binding/candidate-source.tar"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
      - name: Preserve diagnostic and source evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/http-binding"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/http-binding/status.txt"
          git diff > "$RUNNER_TEMP/http-binding/uncommitted.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: http-binding-qualification
          path: ${{ runner.temp }}/http-binding
          if-no-files-found: error
          retention-days: 30
