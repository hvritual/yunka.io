name: operation-growth-workspace-tidy-qualification

on:
  push:
    branches:
      - control/operation-growth-boundary-gate-20260917
    paths:
      - .github/workflows/operation-growth-workspace-tidy-qualification.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: control/operation-growth-boundary-gate-20260917
          path: controller
          fetch-depth: 0

      - name: Checkout exact product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/161-operation-growth-boundary-gate
          path: product
          fetch-depth: 0

      - name: Verify exact product and unchanged main
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "b2a48442a77559a375c782e5fb4940a33666b58d"
          test "$(git rev-parse HEAD^{tree})" = "9f72fc0ce783bf0f94d220c9c2ed7483c90ae600"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"

      - name: Load locked Go
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source product/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: |
            product/app/go.sum
            product/framework/go.sum
            product/gateway/go.sum
            product/infras/go.sum
            product/pkg/go.sum

      - name: Reconcile workspace dependency checksums
        shell: bash
        run: |
          set -euo pipefail
          cd product
          make tidy
          git diff --check
          changed="$(git status --porcelain | awk '{print $2}')"
          test "$changed" = "go.work.sum" || {
            echo "make tidy changed unexpected files:" >&2
            printf '%s\n' "$changed" >&2
            git diff --stat >&2
            exit 1
          }

      - name: Commit qualified workspace checksum
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "Yunka Delivery"
          git config user.email "quality-delivery@example.invalid"
          git add go.work.sum
          git diff --cached --check
          git commit -m "chore(deps): reconcile workspace sums after excelx migration"
          test "$(git rev-parse HEAD^)" = "b2a48442a77559a375c782e5fb4940a33666b58d"
          test -z "$(git status --porcelain)"
          echo "candidate=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"

      - name: Publish qualified workspace checksum
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git fetch origin main fix/161-operation-growth-boundary-gate
          test "$(git rev-parse origin/fix/161-operation-growth-boundary-gate)" = "b2a48442a77559a375c782e5fb4940a33666b58d"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test -z "$(git status --porcelain)"
          git push origin HEAD:fix/161-operation-growth-boundary-gate
          echo "published=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
