name: engineering-quality-status-closure-control

on:
  push:
    branches:
      - control/engineering-quality-status-closure-20260917

permissions:
  contents: write

jobs:
  publish-status-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false

      - name: Checkout exact accepted product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fe63375b84be89c068ad57b81cc7def578cf30fc
          path: product
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable accepted source
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fe63375b84be89c068ad57b81cc7def578cf30fc"
          test "$(git rev-parse HEAD^{tree})" = "ca1b922106e15175b31c74c538fef348dfd0bcec"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "fe63375b84be89c068ad57b81cc7def578cf30fc"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Reconcile current status
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          python3 ../control/.github/control/engineering_quality_status_closure.py
          git diff --check
          test "$(git diff --name-only)" = "docs/STATUS.md"

      - name: Commit and publish docs-only candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yunka Delivery"
          git config user.email "quality-delivery@example.invalid"
          git switch -c docs/engineering-quality-global-acceptance-final
          git add docs/STATUS.md
          git commit -m "docs: reconcile engineering-quality global acceptance"
          test "$(git diff HEAD^ --name-only)" = "docs/STATUS.md"
          git push origin HEAD:refs/heads/docs/engineering-quality-global-acceptance-final
          printf 'candidate=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
