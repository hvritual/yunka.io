name: biz-candidate-validate

on:
  push:
    branches:
      - agent/biz-candidate-validate

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.13
          cache: false
      - name: Validate internal candidate
        shell: bash
        run: |
          set -euo pipefail
          cd tools/biz-domain-export
          GOWORK=off go mod tidy
          GOWORK=off go test ./...
          GOWORK=off go vet ./...
