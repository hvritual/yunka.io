name: issue-151-isolated-delivery

on:
  push:
    branches: [control/151-default-control-state]

# One-shot user-authorized implementation workflow on a control branch only.
# Normal CI remains read-only. This workflow never updates main.
permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      BASE_SHA: 44e93eaa9a256859f5b182f800a4a786016e9878
      FIX_BRANCH: fix/151-default-control-state
    steps:
      - name: Checkout task controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact implementation base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 44e93eaa9a256859f5b182f800a4a786016e9878
          path: source
          fetch-depth: 0
      - name: Verify bootstrap and task boundary
        run: |
          set -euo pipefail
          cat AGENTS.md PROJECT_MEMORY.md docs/STATUS.md >/dev/null
          git status --short --branch
          git branch --show-current
          git remote -v
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/$FIX_BRANCH)"
          git switch -c "$FIX_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Load locked toolchain
        id: toolchain
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: |
            source/app/go.sum
            source/framework/go.sum
            source/gateway/go.sum
            source/infras/go.sum
            source/pkg/go.sum
      - name: Install locked protobuf toolchain
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/issue151-protoc.zip"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" --output "$archive"
          echo "$PROTOC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/issue151-protoc" "$RUNNER_TEMP/issue151-bin"
          unzip -q "$archive" -d "$RUNNER_TEMP/issue151-protoc"
          echo "$RUNNER_TEMP/issue151-protoc/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/issue151-bin" >> "$GITHUB_PATH"
          source tools/toolchain.env
          GOBIN="$RUNNER_TEMP/issue151-bin" go install "google.golang.org/protobuf/cmd/protoc-gen-go@$PROTOC_GEN_GO_VERSION"
          GOBIN="$RUNNER_TEMP/issue151-bin" go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@$PROTOC_GEN_GO_GRPC_VERSION"
      - name: Preserve regression-only RED commit
        run: |
          set -euo pipefail
          cp ../tools/tasks/issue151_regression.go.txt app/cmd/change/default_control_state_test.go
          gofmt -w app/cmd/change/default_control_state_test.go
          git add -- app/cmd/change/default_control_state_test.go
          git commit -m 'test: reproduce default change contract scope self-rejection'
          echo "ISSUE151_RED_SHA=$(git rev-parse HEAD)"
          set +e
          (cd app && go test ./cmd/change -run '^TestIssue151DefaultProtocolWithoutIgnore$' -count=1 -v) > "$RUNNER_TEMP/issue151-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/issue151-red.log"
          test "$status" -ne 0
          grep -q 'ISSUE151_DEFAULT_ROUNDTRIP' "$RUNNER_TEMP/issue151-red.log"
          echo 'ISSUE151_EXPECTED_RED=PASS'
      - name: Apply minimal storage-only fix
        run: |
          set -euo pipefail
          python3 ../tools/tasks/issue151_apply.py
          git diff --stat
          git diff --check
      - name: Run complete Change protocol regression
        run: |
          set -euo pipefail
          (cd app && go test ./cmd/change -count=1 -v) 2>&1 | tee "$RUNNER_TEMP/issue151-green.log"
          echo 'ISSUE151_CHANGE_PACKAGE_GREEN=PASS'
      - name: Commit and push isolated candidate using local Git
        run: |
          set -euo pipefail
          git add -- app/cmd/change/contract.go app/cmd/change/verify.go app/cmd/change/ax7_test.go app/cmd/change/default_control_state_test.go README.md docs/STATUS.md
          git diff --cached --check
          git commit -m 'fix: keep default change protocol evidence in Git-private storage'
          test -z "$(git status --porcelain)"
          test -z "$(git ls-remote origin refs/heads/$FIX_BRANCH)"
          git push origin "HEAD:refs/heads/$FIX_BRANCH"
          candidate="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/$FIX_BRANCH | cut -f1)" = "$candidate"
          echo "ISSUE151_CANDIDATE_SHA=$candidate"
          echo "ISSUE151_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo 'ISSUE151_LOCAL_GIT_PUSH_READBACK=PASS'
