name: c4-1-rc7-staged-release

on:
  push:
    branches:
      - fix/c4-1-module-publication-convergence
    paths:
      - .github/workflows/c4-1-rc6-staged-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BRANCH: fix/c4-1-module-publication-convergence
      RC_VERSION: v0.1.0-c41rc7
      GONOPROXY: github.com/hvritual/yunka.io/*
      GONOSUMDB: github.com/hvritual/yunka.io/*
    steps:
      - name: Checkout C4.1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/c4-1-module-publication-convergence
          fetch-depth: 0

      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Preflight staged release
        shell: bash
        run: |
          set -euo pipefail
          make toolchain-check
          make rpc-tools
          make rpc-toolchain-check
          for prefix in pkg framework gateway; do
            if git ls-remote --exit-code --tags origin "refs/tags/${prefix}/${RC_VERSION}" >/dev/null 2>&1; then
              echo "RC7 tag already exists: ${prefix}/${RC_VERSION}" >&2
              exit 1
            fi
          done
          if grep -n '^replace ' pkg/go.mod framework/go.mod gateway/go.mod; then
            echo 'publishable module go.mod contains replace directive' >&2
            exit 1
          fi
          grep -q 'github.com/go-kit/kit v0.13.0' pkg/go.mod
          grep -q 'google.golang.org/genproto v0.0.0-20260810153831-ec0a7760b754' pkg/go.mod
          test -f pkg/internal/dependencyanchor/genproto.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Publish pkg RC7
        shell: bash
        run: |
          set -euo pipefail
          pkg_sha="$(git rev-parse HEAD)"
          git tag "pkg/${RC_VERSION}" "$pkg_sha"
          git push origin "refs/tags/pkg/${RC_VERSION}"
          test "$(git ls-remote --tags origin "refs/tags/pkg/${RC_VERSION}" | awk '{print $1}')" = "$pkg_sha"
          echo "PKG_SHA=$pkg_sha" >> "$GITHUB_ENV"
          (cd pkg && \
            GOWORK=off go mod tidy -diff && \
            GOWORK=off go list -m all >/dev/null && \
            GOWORK=off go test ./... && \
            GOWORK=off go vet ./... && \
            GOWORK=off go build ./...)

      - name: Pin and publish framework RC7
        shell: bash
        run: |
          set -euo pipefail
          (cd framework && GOWORK=off go mod edit -require=github.com/hvritual/yunka.io/pkg@${RC_VERSION})
          (cd framework && GOWORK=off go mod tidy)
          if grep -q '^replace ' framework/go.mod; then
            echo 'framework go.mod contains replace after RC7 tidy' >&2
            exit 1
          fi
          grep -q "github.com/hvritual/yunka.io/pkg ${RC_VERSION}" framework/go.mod
          (cd framework && \
            GOWORK=off go mod tidy -diff && \
            GOWORK=off go list -m all >/dev/null && \
            GOWORK=off go test ./... && \
            GOWORK=off go vet ./... && \
            GOWORK=off go build ./...)
          git add framework/go.mod framework/go.sum
          git commit -m 'build: pin framework to pkg RC7'
          git push origin "HEAD:${BRANCH}"
          framework_sha="$(git rev-parse HEAD)"
          git tag "framework/${RC_VERSION}" "$framework_sha"
          git push origin "refs/tags/framework/${RC_VERSION}"
          test "$(git ls-remote --tags origin "refs/tags/framework/${RC_VERSION}" | awk '{print $1}')" = "$framework_sha"
          echo "FRAMEWORK_SHA=$framework_sha" >> "$GITHUB_ENV"

      - name: Pin and publish gateway RC7
        shell: bash
        run: |
          set -euo pipefail
          (cd gateway && GOWORK=off go mod edit -require=github.com/hvritual/yunka.io/pkg@${RC_VERSION})
          (cd gateway && GOWORK=off go mod edit -require=github.com/hvritual/yunka.io/framework@${RC_VERSION})
          (cd gateway && GOWORK=off go mod tidy)
          if grep -q '^replace ' gateway/go.mod; then
            echo 'gateway go.mod contains replace after RC7 tidy' >&2
            exit 1
          fi
          grep -q "github.com/hvritual/yunka.io/pkg ${RC_VERSION}" gateway/go.mod
          grep -q "github.com/hvritual/yunka.io/framework ${RC_VERSION}" gateway/go.mod
          (cd gateway && \
            GOWORK=off go mod tidy -diff && \
            GOWORK=off go list -m all >/dev/null && \
            GOWORK=off go test ./... && \
            GOWORK=off go vet ./... && \
            GOWORK=off go build ./...)
          git add gateway/go.mod gateway/go.sum
          git commit -m 'build: pin gateway to framework and pkg RC7'
          git push origin "HEAD:${BRANCH}"
          gateway_sha="$(git rev-parse HEAD)"
          git tag "gateway/${RC_VERSION}" "$gateway_sha"
          git push origin "refs/tags/gateway/${RC_VERSION}"
          test "$(git ls-remote --tags origin "refs/tags/gateway/${RC_VERSION}" | awk '{print $1}')" = "$gateway_sha"
          echo "GATEWAY_SHA=$gateway_sha" >> "$GITHUB_ENV"

      - name: Converge and commit app workspace RC7
        shell: bash
        run: |
          set -euo pipefail
          (cd app && GOWORK=off go mod edit -require=github.com/hvritual/yunka.io/pkg@${RC_VERSION})
          (cd app && GOWORK=off go mod tidy)
          sed -E -i "s/^YUNKA_MODULE_RELEASE=.*/YUNKA_MODULE_RELEASE=${RC_VERSION}/" tools/module-release.env
          grep -q "github.com/hvritual/yunka.io/pkg ${RC_VERSION}" app/go.mod
          grep -q "YUNKA_MODULE_RELEASE=${RC_VERSION}" tools/module-release.env

          rm -f go.work.sum
          go list -m all >/dev/null
          for module in pkg framework gateway; do
            (cd "$module" && go list -deps -test ./... >/dev/null && go vet ./... && go build ./...)
          done
          (cd app && go list -deps -test ./... >/dev/null && go vet ./... && go build ./...)

          make rpc-check
          make contract
          make contract-check
          git diff --exit-code -- contracts/generated

          cat >> docs/waves/C4.1-module-publication-convergence.md <<'EOF'

          ## RC7 clean repository qualification

          RC6 proved the dependency-ordered module publication itself: pkg,
          framework-on-pkg, and gateway-on-framework/pkg all passed independent
          GOWORK=off tidy/test/vet/build. RC6 then failed only because app/root
          bookkeeping changes were left uncommitted while the C11.4 fast-feedback
          qualification correctly required a clean tracked worktree.

          RC7 keeps the same staged publication model and makes repository-owned app
          convergence explicit bookkeeping. After all three module tags exist, app is
          pinned to the real pkg release, root go.work.sum is rebuilt from the tagged
          graph, generated/contract outputs are checked, and those repository changes
          are committed before any app VCS-identity qualification runs. This preserves
          `vcs.modified=false` as an actual invariant instead of weakening the test.
          EOF

          git add app/go.mod app/go.sum tools/module-release.env go.work.sum docs/waves/C4.1-module-publication-convergence.md
          git commit -m 'build: converge C4.1 RC7 repository workspace'
          git push origin "HEAD:${BRANCH}"
          workspace_sha="$(git rev-parse HEAD)"
          echo "WORKSPACE_SHA=$workspace_sha" >> "$GITHUB_ENV"

      - name: Qualify clean RC7 workspace and artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PKG_SHA:-}"
          test -n "${FRAMEWORK_SHA:-}"
          test -n "${GATEWAY_SHA:-}"
          test -n "${WORKSPACE_SHA:-}"
          test "$(git rev-parse HEAD)" = "$WORKSPACE_SHA"
          test -z "$(git status --porcelain)" || {
            echo 'RC7 repository workspace is not clean before qualification' >&2
            git status --porcelain >&2
            exit 1
          }

          (cd app && go test ./cmd -run TestC116CExpertCommandCompatibilitySnapshots -count=1)
          (cd app && go test ./cmd/projectflow -run TestC114QualificationRealBinaryFastFeedback -count=1)
          test -z "$(git status --porcelain)" || {
            echo 'targeted app qualification dirtied RC7 workspace' >&2
            git status --porcelain >&2
            exit 1
          }

          test "$(git ls-remote --tags origin "refs/tags/pkg/${RC_VERSION}" | awk '{print $1}')" = "$PKG_SHA"
          test "$(git ls-remote --tags origin "refs/tags/framework/${RC_VERSION}" | awk '{print $1}')" = "$FRAMEWORK_SHA"
          test "$(git ls-remote --tags origin "refs/tags/gateway/${RC_VERSION}" | awk '{print $1}')" = "$GATEWAY_SHA"

          go list -m all >/dev/null
          git diff --exit-code -- go.work.sum
          make rpc-check
          make contract
          make contract-check
          git diff --exit-code -- contracts/generated go.work.sum
          for module in pkg framework gateway app; do
            echo "==> workspace ${module}"
            (cd "$module" && go test ./... && go vet ./... && go build ./...)
          done
          test -z "$(git status --porcelain)" || {
            echo 'source-workspace qualification dirtied RC7 bookkeeping commit' >&2
            git status --porcelain >&2
            exit 1
          }

          for module in pkg framework gateway; do
            echo "==> GOWORK=off ${module}"
            (cd "$module" && \
              GOWORK=off go mod tidy -diff && \
              GOWORK=off go list -m all >/dev/null && \
              GOWORK=off go test ./... && \
              GOWORK=off go vet ./... && \
              GOWORK=off go build ./...)
          done

          tmp="$(mktemp -d)"
          cd "$tmp"
          GOWORK=off go mod init yunka-c41-rc7-external-probe >/dev/null
          GOWORK=off go get "github.com/hvritual/yunka.io/pkg@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/framework@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/gateway@${RC_VERSION}"
          GOWORK=off go list -m all >/dev/null
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/pkg)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/framework)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/gateway)" = "$RC_VERSION"
          cd - >/dev/null
          rm -rf "$tmp"
          echo "C4.1 RC7 qualified: pkg=$PKG_SHA framework=$FRAMEWORK_SHA gateway=$GATEWAY_SHA workspace=$WORKSPACE_SHA"

      - name: Finalize successful RC7 executor
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/c4-1-rc6-staged-release.yml
          git commit -m 'ci: retire successful C4.1 RC7 executor'
          git push origin "HEAD:${BRANCH}"

      - name: Cleanup failed RC7 tags
        if: failure()
        shell: bash
        run: |
          git push origin \
            :refs/tags/pkg/${RC_VERSION} \
            :refs/tags/framework/${RC_VERSION} \
            :refs/tags/gateway/${RC_VERSION} || true
