name: operation-growth-native-control

on:
  push:
    branches:
      - control/operation-growth-boundary-gate-20260917
    paths:
      - .github/workflows/operation-growth-native-control.yml
      - tools/operation_growth_native.py

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/operation-growth-boundary-gate-20260917
          path: controller
          fetch-depth: 0

      - name: Checkout exact product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/161-operation-growth-boundary-gate
          path: product
          fetch-depth: 0

      - name: Verify exact current-main base
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test "$(git rev-parse HEAD^{tree})" = "9fc4a864b2aa6c038e0c737c555df340321d8017"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"

      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source product/tools/toolchain.env
          : "${GO_VERSION:?}"
          : "${PROTOC_RELEASE:?}"
          : "${PROTOC_LINUX_X86_64_SHA256:?}"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: |
            product/app/go.sum
            product/framework/go.sum
            product/gateway/go.sum
            product/infras/go.sum
            product/pkg/go.sum

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Materialize current-main native implementation
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git fetch origin \
            23789633f2e0dbcd20230cacca42e814047d86bc \
            f8fdce6c3bd7bd63eef05ae23b3fc9ba83c3b0de
          set -o pipefail
          python3 ../controller/tools/operation_growth_native.py 2>&1 | tee ../controller/tools/operation_growth_native_last.log

      - name: Regenerate canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          cd product
          make rpc-generate
          gofmt -w \
            pkg/contract \
            app/cmd/boundarycore \
            app/cmd/add \
            app/cmd/audit \
            app/cmd/change
          git diff --check

      - name: Run focused qualification
        shell: bash
        run: |
          set -euo pipefail
          cd product
          set -o pipefail
          {
            make toolchain-check
            (cd pkg && go test -count=1 ./contract)
            (cd app && go test -count=1 \
              ./cmd/boundarycore \
              ./cmd/add \
              ./cmd/projectflow \
              ./cmd/change \
              ./cmd/audit \
              ./cmd/auditcore)
            make contract-check
            git diff --check
            git status --short
          } 2>&1 | tee ../controller/tools/operation_growth_native_qualification.log

      - name: Publish qualified current-main candidate
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          git config user.name "Yunka Delivery"
          git config user.email "quality-delivery@example.invalid"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(boundary): enforce operation growth on current main"
          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          git push origin HEAD:fix/161-operation-growth-boundary-gate
          echo "candidate=${candidate}"
          echo "tree=${tree}"

      - name: Persist native failure diagnostics on control branch
        if: failure()
        shell: bash
        run: |
          set -u
          cd controller
          {
            echo "run=${GITHUB_RUN_ID}"
            echo "product_expected=01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
            echo
            if [ -f tools/operation_growth_native_last.log ]; then
              echo "== native materialization =="
              tail -n 300 tools/operation_growth_native_last.log
            fi
            if [ -f tools/operation_growth_native_qualification.log ]; then
              echo
              echo "== focused qualification =="
              tail -n 500 tools/operation_growth_native_qualification.log
            fi
          } > tools/operation_growth_native_last_failure.log
          git config user.name "Yunka Control"
          git config user.email "control@example.invalid"
          git add tools/operation_growth_native_last_failure.log
          if ! git diff --cached --quiet; then
            git commit -m "control: record operation growth native failure ${GITHUB_RUN_ID}"
            git push origin HEAD:control/operation-growth-boundary-gate-20260917
          fi
