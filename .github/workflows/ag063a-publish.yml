          old='''\twiring := fmt.Sprintf("package usecase\\nimport(\\n%s)\\n\\ntype service struct {\\n%s}\\n\\n// New exposes only the canonical interface; never return or unwrap service.\\nfunc New() %s.%s {return &service{}}\\n\\nvar _ %s.%s = (*service)(nil)\\n\\n%s", importLines(allImports), fields.String(), portAlias, port.name, portAlias, port.name, delegates.String())\n'''
          new='''\tvar wiring string\n\tif len(dependencies) == 0 {\n\t\twiring = fmt.Sprintf("package usecase\\nimport(\\n%s)\\n\\ntype service struct {\\n%s}\\n\\n// New exposes only the canonical interface; never return or unwrap service.\\nfunc New() %s.%s {return &service{}}\\n\\nvar _ %s.%s = (*service)(nil)\\n\\n%s", importLines(allImports), fields.String(), portAlias, port.name, portAlias, port.name, delegates.String())\n\t} else {\n\t\terrAlias := freshAlias("_startererrors", allImports)\n\t\tallImports[errAlias] = "errors"\n\t\tparams := make([]string, 0, len(dependencies))\n\t\tvar checks strings.Builder\n\t\tfor i, dependency := range dependencies {\n\t\t\tparams = append(params, fmt.Sprintf("dependency%d %s.%s", i, portAlias, dependency.ContractName))\n\t\t\tfmt.Fprintf(&checks, "if dependency%d == nil {return nil,%s.New(%q)}\\n", i, errAlias, key+": dependency "+dependency.Key+" is required")\n\t\t}\n\t\twiring = fmt.Sprintf("package usecase\\nimport(\\n%s)\\n\\ntype service struct {\\n%s}\\n\\n// New accepts only generated source-edge child capabilities and exposes only the canonical interface.\\nfunc New(%s) (%s.%s,error) {%sreturn &service{%s},nil}\\n\\nvar _ %s.%s = (*service)(nil)\\n\\n%s", importLines(allImports), fields.String(), strings.Join(params, ","), portAlias, port.name, checks.String(), initializers.String(), portAlias, port.name, delegates.String())\n\t}\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''\tpolicy := applicationboundary.Policy{SchemaVersion: applicationboundary.SchemaVersion, Factories: []applicationboundary.Factory{{Symbol: applicationboundary.Symbol{Package: owner, Name: "Build"}, AllowedCallers: []string{caller}, Results: []applicationboundary.Slot{{Index: 0, Contract: applicationboundary.Symbol{Package: contractImport, Name: port.name}}}}}}\n'''
