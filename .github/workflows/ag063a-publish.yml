          Path('app/cmd/implementation/dependencies.go').write_text(r'''package implementation

import (
    "fmt"
    "go/ast"
    "go/parser"
    "go/token"
    "path"
    "sort"
    "strings"

    "github.com/hvritual/yunka.io/pkg/contract"
)

type dependencyShape struct {
    Key            string
    ContractImport string
    ContractName   string
    Methods        []string
}

func (dependency dependencyShape) Uses(method string) bool {
    index := sort.SearchStrings(dependency.Methods, method)
    return index < len(dependency.Methods) && dependency.Methods[index] == method
}

func selectDependencies(files []contract.GeneratedApplicationFile, manifest contract.Manifest, service contract.Service, port portShape, contractImport string) ([]dependencyShape, error) {
    if service.Application == nil || len(service.Application.Requires) == 0 {
        return nil, nil
    }
    const suffix = "_application_port_gen.go"
    if !strings.HasSuffix(port.path, suffix) {
        return nil, fmt.Errorf("add implementation: canonical port path has no capability sibling")
    }
    capabilityPath := strings.TrimSuffix(port.path, suffix) + "_capability_ports_gen.go"
    var source []byte
    for _, file := range files {
        if file.Path == capabilityPath {
            if source != nil {
                return nil, fmt.Errorf("add implementation: duplicate canonical capability artifact %s", capabilityPath)
            }
            source = file.Content
        }
    }
    if source == nil {
        return nil, fmt.Errorf("add implementation: canonical capability artifact %s is missing", capabilityPath)
    }
    parsed, err := parser.ParseFile(token.NewFileSet(), capabilityPath, source, parser.SkipObjectResolution)
    if err != nil {
        return nil, err
    }
    interfaces := map[string]*ast.InterfaceType{}
    var providers []*ast.InterfaceType
    for _, decl := range parsed.Decls {
        gen, ok := decl.(*ast.GenDecl)
        if !ok {
            continue
        }
        for _, spec := range gen.Specs {
            typ, ok := spec.(*ast.TypeSpec)
            if !ok {
                continue
            }
            iface, ok := typ.Type.(*ast.InterfaceType)
            if !ok {
                continue
            }
            interfaces[typ.Name.Name] = iface
            if strings.HasSuffix(typ.Name.Name, "Capabilities") {
                providers = append(providers, iface)
            }
        }
    }
    if len(providers) != 1 {
        return nil, fmt.Errorf("add implementation: expected one canonical capability provider, found %d", len(providers))
    }
    requires := append([]string(nil), service.Application.Requires...)
    if len(providers[0].Methods.List) != len(requires) {
        return nil, fmt.Errorf("add implementation: canonical capability dependency count mismatch")
    }
    targets := map[string]contract.Service{}
    for _, candidate := range manifest.Services {
        if candidate.Application != nil {
            targets[candidate.Domain+"/"+candidate.Application.Name] = candidate
        }
    }
    result := make([]dependencyShape, 0, len(requires))
    for index, field := range providers[0].Methods.List {
        if len(field.Names) != 1 {
            return nil, fmt.Errorf("add implementation: malformed canonical capability provider method")
        }
        fn, ok := field.Type.(*ast.FuncType)
        if !ok || fn.Params == nil || len(fn.Params.List) != 0 || fn.Results == nil || len(fn.Results.List) != 1 {
            return nil, fmt.Errorf("add implementation: malformed canonical capability provider signature")
        }
        ident, ok := fn.Results.List[0].Type.(*ast.Ident)
        if !ok || !strings.HasSuffix(ident.Name, "ChildCapability") {
            return nil, fmt.Errorf("add implementation: canonical dependency is not a child capability")
        }
        child := interfaces[ident.Name]
        if child == nil || child.Methods == nil || len(child.Methods.List) == 0 {
            return nil, fmt.Errorf("add implementation: dependency %s exposes no required child Operation", requires[index])
        }
        target, ok := targets[requires[index]]
        if !ok || target.Application == nil {
            return nil, fmt.Errorf("add implementation: canonical dependency %s has no Application", requires[index])
        }
        operationIDs := map[string]bool{}
        for _, method := range target.Methods {
            if method.Operation != nil {
                operationIDs[method.Operation.ID] = true
            }
        }
        for _, operation := range target.Application.Operations {
            operationIDs[operation.ID] = true
        }
        used := map[string]bool{}
        for _, method := range service.Methods {
            if method.Operation == nil {
                continue
            }
            for _, operationID := range method.Operation.RequiresOperations {
                if operationIDs[operationID] {
                    used[method.Name] = true
                }
            }
        }
        for _, operation := range service.Application.Operations {
            for _, operationID := range operation.RequiresOperations {
                if operationIDs[operationID] {
                    used[operation.ApplicationMethod] = true
                }
            }
        }
        methods := make([]string, 0, len(used))
        for method := range used {
            methods = append(methods, method)
        }
        sort.Strings(methods)
        if len(methods) == 0 {
            return nil, fmt.Errorf("add implementation: dependency %s is not used by a typed source Operation", requires[index])
        }
        result = append(result, dependencyShape{Key: requires[index], ContractImport: contractImport, ContractName: ident.Name, Methods: methods})
    }
    _ = path.Clean(capabilityPath)
    return result, nil
}
''')

