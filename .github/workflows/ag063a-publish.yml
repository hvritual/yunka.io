            {Name: "StockApplication", FullName: "inventory.v1.StockApplication", Domain: "inventory", Application: &contract.ApplicationDeclaration{Name: "stock", Operations: []contract.OperationDeclaration{{ID: "inventory.stock.reserve", UseCase: "reserve_stock", Public: true, RequestType: "inventory.v1.ReserveRequest", ResponseType: "inventory.v1.ReserveResponse", ApplicationMethod: "ReserveStock", Execution: &contract.ExecutionPolicy{Transaction: "none", Idempotency: "none"}}}}},
        },
    }
    return project, manifest
