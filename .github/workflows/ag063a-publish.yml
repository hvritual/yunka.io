func thirdDomainDependencyFixture(root string) (projectflow.ProjectDescriptor, contract.Manifest) {
    project := projectflow.ProjectDescriptor{Root: root, GoModule: "example.com/dispatch", GeneratedGoRoot: "src/app", GeneratedGoImport: "example.com/dispatch/src/app"}
    manifest := contract.Manifest{SchemaVersion: contract.ManifestVersion,
        Files: []contract.File{
            {Name: "dispatch.proto", Package: "dispatch.v1", GoPackage: "example.com/dispatch/wire/dispatch;dispatchv1", Domain: &contract.DomainDeclaration{Name: "dispatch", Version: "v1"}},
            {Name: "inventory.proto", Package: "inventory.v1", GoPackage: "example.com/dispatch/wire/inventory;inventoryv1", Domain: &contract.DomainDeclaration{Name: "inventory", Version: "v1"}},
        },
        Messages: []contract.Message{
            {Name: "PlanRequest", FullName: "dispatch.v1.PlanRequest"}, {Name: "PlanResponse", FullName: "dispatch.v1.PlanResponse"},
            {Name: "ReserveRequest", FullName: "inventory.v1.ReserveRequest"}, {Name: "ReserveResponse", FullName: "inventory.v1.ReserveResponse"},
        },
        Services: []contract.Service{
