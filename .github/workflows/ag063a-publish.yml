name: ag063a-publish-v2
on:
  push:
    branches: [control/ag06-3a-publish-20260910]
    paths:
      - .github/workflows/ag063a-publish.yml
      - .github/ag063a/**
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ag06-3a-typed-dependencies
          fetch-depth: 0
      - name: Fetch control payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin control/ag06-3a-publish-20260910
          git show FETCH_HEAD:.github/ag063a/apply.py > "$RUNNER_TEMP/ag063_apply.py"
          git show FETCH_HEAD:.github/ag063a/dependencies.go > "$RUNNER_TEMP/dependencies.go"
          git show FETCH_HEAD:.github/ag063a/typed_dependency_test.go > "$RUNNER_TEMP/typed_dependency_test.go"
      - name: Read locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION:?}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache-dependency-path: |
            app/go.sum
            pkg/go.sum
      - name: Install locked protoc
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          curl --fail --silent --show-error --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "${PROTOC_LINUX_X86_64_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Apply and qualify AG-06.3a
        shell: bash
        run: |
          set -euo pipefail
          base=cc546c7d25ee316442eafacd3c93599f7691f22a
          test "$(git rev-parse HEAD)" = "$base"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 "$RUNNER_TEMP/ag063_apply.py"
          cp "$RUNNER_TEMP/dependencies.go" app/cmd/implementation/dependencies.go
          cp "$RUNNER_TEMP/typed_dependency_test.go" app/cmd/implementation/typed_dependency_test.go
          gofmt -w app/cmd/implementation/plan.go app/cmd/implementation/render.go app/cmd/implementation/dependencies.go app/cmd/implementation/typed_dependency_test.go
          git diff --check
          go -C app test -exec="/usr/bin/env -u GOROOT" -race -count=1 -timeout=8m ./cmd/implementation -run '^TestAG06(1|2|3)'
      - name: Commit task branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add app/cmd/implementation/plan.go app/cmd/implementation/render.go app/cmd/implementation/dependencies.go app/cmd/implementation/typed_dependency_test.go
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com -c commit.gpgsign=false commit -m 'feat(template): add typed requires starter'
          git push origin HEAD:refs/heads/feat/ag06-3a-typed-dependencies
          git rev-parse HEAD HEAD^{tree}
