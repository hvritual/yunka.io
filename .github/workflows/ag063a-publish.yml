func TestAG063TypedRequiresUseGeneratedEdgeCapability(t *testing.T) {
    project, manifest := thirdDomainDependencyFixture(t.TempDir())
    report, err := render(project, manifest, "dispatch/routes", project.GoModule+"/bootstrap")
    if err != nil {
        t.Fatal(err)
    }
    var build, wiring, handler, policyText string
    for _, file := range report.Files {
        switch {
        case strings.HasSuffix(file.Path, "/build.go"):
            build = file.Content
        case strings.HasSuffix(file.Path, "/internal/usecase/wiring.go"):
            wiring = file.Content
        case strings.HasSuffix(file.Path, "/internal/usecase/planroute_handler.go"):
            handler = file.Content
        case strings.HasSuffix(file.Path, "/architecture.types.json"):
            policyText = file.Content
        }
    }
    for _, pair := range []struct{ text, want string }{
        {build, "dependency0 _port.RoutesToInventoryStockChildCapability"},
        {build, "(_port.RouteApplication, error)"},
        {wiring, "dependency0 _starterport.RoutesToInventoryStockChildCapability"},
        {handler, "dependency0 _starterdependency.RoutesToInventoryStockChildCapability"},
    } {
        if !strings.Contains(pair.text, pair.want) {
            t.Fatalf("missing typed dependency %q:\n%s", pair.want, pair.text)
        }
    }
    policy, err := applicationboundary.ReadPolicy(strings.NewReader(policyText))
    if err != nil {
        t.Fatal(err)
    }
    if len(policy.Factories) != 1 || len(policy.Factories[0].Arguments) != 1 || policy.Factories[0].Arguments[0].Contract.Name != "RoutesToInventoryStockChildCapability" {
        t.Fatalf("dependency contract is not AG-04 bound: %+v", policy)
    }
}

func TestAG063ThirdDomainTypedDependencyCompilesAndRejectsWideAuthority(t *testing.T) {
    root := t.TempDir()
    project, manifest := thirdDomainDependencyFixture(root)
    report, err := render(project, manifest, "dispatch/routes", project.GoModule+"/bootstrap")
    if err != nil {
        t.Fatal(err)
    }
    repo, err := filepath.Abs("../../..")
    if err != nil {
        t.Fatal(err)
    }
    put(t, root, "go.mod", "module example.com/dispatch\n\ngo 1.25.0\n\nrequire (\n github.com/hvritual/yunka.io/framework v0.0.0\n github.com/hvritual/yunka.io/pkg v0.1.0\n)\nreplace github.com/hvritual/yunka.io/framework => "+filepath.ToSlash(filepath.Join(repo,"framework"))+"\nreplace github.com/hvritual/yunka.io/pkg => "+filepath.ToSlash(filepath.Join(repo,"pkg"))+"\n")
    put(t, root, "wire/dispatch/model.go", "package dispatchv1\ntype PlanRequest struct{}\ntype PlanResponse struct{}\n")
    put(t, root, "wire/inventory/model.go", "package inventoryv1\ntype ReserveRequest struct{}\ntype ReserveResponse struct{}\n")
    generated, err := contract.RenderC9ApplicationCode(manifest, contract.ApplicationCodeOptions{RootImport: project.GeneratedGoImport})
    if err != nil {
        t.Fatal(err)
    }
    for _, file := range generated {
        if strings.Contains(file.Path, "/application/") || strings.Contains(file.Path, "/policy/") {
            put(t, root, project.GeneratedGoRoot+"/"+file.Path, string(file.Content))
        }
    }
    for _, file := range report.Files {
        put(t, root, file.Path, file.Content)
    }
    bootstrap := `package bootstrap
import (
 "context"
 owner "example.com/dispatch/src/app/dispatch/application/routes"
 port "example.com/dispatch/src/app/dispatch/application"
 inventoryv1 "example.com/dispatch/wire/inventory"
)
type dependency struct{}
func (*dependency) ReserveStock(context.Context,*inventoryv1.ReserveRequest)(*inventoryv1.ReserveResponse,error){return nil,nil}
func BuildRoutes()(port.RouteApplication,error){return owner.Build(&dependency{})}
`
    put(t, root, "bootstrap/build.go", bootstrap)
    if out, err := childGo(t, root, "test", "-mod=mod", "-count=1", "./..."); err != nil {
        t.Fatalf("typed third-domain starter does not compile: %v\n%s", err, out)
    }
    policyData, err := os.ReadFile(filepath.Join(root, "src/app/dispatch/application/routes/architecture.types.json"))
    if err != nil {
        t.Fatal(err)
    }
    policy, err := applicationboundary.ReadPolicy(bytes.NewReader(policyData))
    if err != nil {
        t.Fatal(err)
    }
    before := snapshot(t, root)
    original := applicationboundary.Check(context.Background(), root, policy, applicationboundary.Options{})
    if original.Status != applicationboundary.Pass || original.CheckedReferences != 1 {
        t.Fatalf("legal typed dependency rejected: %+v", original)
    }
    put(t, root, "bootstrap/build.go", bootstrap+"\nfunc (*dependency) ExtraAuthority(){}\n")
    widened := applicationboundary.Check(context.Background(), root, policy, applicationboundary.Options{})
    if widened.Status != applicationboundary.Fail || !hasRule(widened, "AG-TYPE-003") {
        t.Fatalf("wide dependency escaped: %+v", widened)
    }
    put(t, root, "bootstrap/build.go", bootstrap)
    bad := "outsider/probe.go"
    put(t, root, bad, `package outsider
import hidden "example.com/dispatch/src/app/dispatch/application/routes/internal/usecase"
func Probe(){_,_ = hidden.New(nil)}
`)
    output, compileErr := childGo(t, root, "build", "-mod=readonly", "./outsider")
    if compileErr == nil || !strings.Contains(output, "use of internal package example.com/dispatch/src/app/dispatch/application/routes/internal/usecase not allowed") {
        t.Fatalf("wrong hidden import result: %v\n%s", compileErr, output)
    }
    if err := os.Remove(filepath.Join(root, bad)); err != nil { t.Fatal(err) }
    if err := os.Remove(filepath.Join(root, "outsider")); err != nil { t.Fatal(err) }
    restored := applicationboundary.Check(context.Background(), root, policy, applicationboundary.Options{})
    a,_ := original.Marshal(); b,_ := restored.Marshal()
    if !bytes.Equal(a,b) || !reflect.DeepEqual(before, snapshot(t, root)) {
        t.Fatal("third-domain source/evidence did not restore")
    }
}

func TestAG063RequiresWithoutTypedOperationEdgeFailsClosed(t *testing.T) {
    project, manifest := thirdDomainDependencyFixture(t.TempDir())
    manifest.Services[0].Application.Operations[0].RequiresOperations = nil
    if _, err := render(project, manifest, "dispatch/routes", project.GoModule+"/bootstrap"); err == nil || !strings.Contains(err.Error(), "exposes no required child Operation") {
        t.Fatalf("unused dependency did not fail closed: %v", err)
    }
}
''')

