name: c9-8-internal-operation-builder

on:
  push:
    branches:
      - agent/c9-8-cross-application-pressure
    paths:
      - tools/c9_8_internal_operation_builder.py
      - .github/workflows/c9-8-internal-operation-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c9-8-cross-application-pressure
          fetch-depth: 0

      - name: Load toolchain lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl -fsSL -o "$archive" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Apply FP-C9-001 fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/c9_8_internal_operation_builder.py
          changed_go="$(git diff --name-only -- '*.go')"
          if [ -n "$changed_go" ]; then gofmt -w $changed_go; fi
          git diff --check

      - name: Regenerate protobuf and canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          make PROTOC="$RUNNER_TEMP/protoc/bin/protoc" rpc-generate
          git diff --check

      - name: Targeted internal Operation tests
        shell: bash
        run: |
          set -euo pipefail
          (cd pkg && go test ./contract ./operationplan ./applicationgraph ./architecturepolicy)

      - name: Full verify
        shell: bash
        run: |
          set -euo pipefail
          make PROTOC="$RUNNER_TEMP/protoc/bin/protoc" verify

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add contracts/proto/yunka/dsl/v1/options.proto pkg/contractdsl/v1/options.pb.go pkg/contract pkg/operationplan pkg/applicationgraph pkg/architecturepolicy contracts/generated
          git diff --cached --check
          git commit -m 'feat: support canonical internal application operations'
          git push origin HEAD:agent/c9-8-cross-application-pressure
