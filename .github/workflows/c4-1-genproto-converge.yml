name: c4-1-genproto-converge

on:
  push:
    branches:
      - fix/c4-1-module-publication-convergence
    paths:
      - .github/workflows/c4-1-genproto-converge.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: fix/c4-1-module-publication-convergence
      RC_VERSION: v0.1.0-c41rc3
      GENPROTO_VERSION: v0.0.0-20260810153831-ec0a7760b754
      GONOPROXY: github.com/hvritual/yunka.io/*
      GONOSUMDB: github.com/hvritual/yunka.io/*
    steps:
      - name: Checkout C4.1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/c4-1-module-publication-convergence
          fetch-depth: 0

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.13
          cache: false

      - name: Converge split genproto graph
        shell: bash
        run: |
          set -euo pipefail

          for file in framework/go.mod gateway/go.mod app/go.mod tools/module-release.env docs/waves/C4.1-module-publication-convergence.md; do
            if [[ -f "$file" ]]; then
              sed -i 's/v0\.1\.0-c41rc2/v0.1.0-c41rc3/g' "$file"
            fi
          done

          # go-kit/kit v0.13.0 still references the pre-split root genproto module.
          # Raise the root module floor to the same modern repository generation
          # used by Yunka's split googleapis/api and googleapis/rpc modules.
          for module in pkg framework gateway; do
            (cd "$module" && GOWORK=off go mod edit -require=google.golang.org/genproto@${GENPROTO_VERSION})
          done

          (cd pkg && GOWORK=off go mod tidy)
          (cd framework && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg)
          (cd gateway && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/framework=../framework && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/framework)
          (cd app && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg)

          rm -f go.work.sum

          if grep -n '^replace ' pkg/go.mod framework/go.mod gateway/go.mod; then
            echo 'publishable module go.mod contains replace directive' >&2
            exit 1
          fi
          for module in pkg framework gateway; do
            grep -q "google.golang.org/genproto ${GENPROTO_VERSION}" "$module/go.mod" || {
              echo "$module did not retain modern root genproto floor" >&2
              exit 1
            }
            if grep -q 'github.com/go-kit/kit v0.10.0' "$module/go.mod"; then
              echo "$module regressed to go-kit v0.10.0" >&2
              exit 1
            fi
          done
          if grep -R -n 'v0.1.0-c41rc2' framework/go.mod gateway/go.mod app/go.mod tools/module-release.env; then
            echo 'RC2 sibling reference remains in RC3 contract' >&2
            exit 1
          fi

          cat >> docs/waves/C4.1-module-publication-convergence.md <<'EOF'

          ## RC3 genproto split convergence

          RC2 removed the unreachable Lyft dependency by raising Go kit to v0.13.0.
          Its maintained graph still selects a 2021 pre-split root
          `google.golang.org/genproto`, while Yunka already uses the modern split
          `google.golang.org/genproto/googleapis/api` and `/rpc` modules. That produces
          ambiguous imports for `googleapis/api/*` and `googleapis/rpc/*`. RC3 raises the
          root genproto module to `v0.0.0-20260810153831-ec0a7760b754`, whose root module
          metadata depends on the split API/RPC modules instead of duplicating their
          packages. This is a version-floor convergence only; publishable modules remain
          free of local `replace` directives.
          EOF

      - name: Commit exact RC3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/c4-1-genproto-converge.yml
          git add -A
          git commit -m 'build: converge C4.1 split genproto dependency graph'
          git push origin "HEAD:${BRANCH}"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish RC3 tags and qualify exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            git push origin \
              :refs/tags/pkg/${RC_VERSION} \
              :refs/tags/framework/${RC_VERSION} \
              :refs/tags/gateway/${RC_VERSION} || true
          }
          trap cleanup ERR

          for prefix in pkg framework gateway; do
            if git ls-remote --exit-code --tags origin "refs/tags/${prefix}/${RC_VERSION}" >/dev/null 2>&1; then
              echo "RC3 tag already exists: ${prefix}/${RC_VERSION}" >&2
              exit 1
            fi
            git tag "${prefix}/${RC_VERSION}" "$CANDIDATE_SHA"
          done
          git push origin \
            "refs/tags/pkg/${RC_VERSION}" \
            "refs/tags/framework/${RC_VERSION}" \
            "refs/tags/gateway/${RC_VERSION}"

          for prefix in pkg framework gateway; do
            resolved="$(git ls-remote --tags origin "refs/tags/${prefix}/${RC_VERSION}" | awk '{print $1}')"
            test "$resolved" = "$CANDIDATE_SHA"
          done

          echo '==> source workspace qualification'
          for module in pkg framework gateway app; do
            echo "==> workspace ${module}"
            (cd "$module" && go test ./... && go vet ./... && go build ./...)
          done

          echo '==> standalone module qualification'
          for module in pkg framework gateway app; do
            echo "==> GOWORK=off ${module}"
            (cd "$module" && \
              GOWORK=off go list -m all >/dev/null && \
              GOWORK=off go test ./... && \
              GOWORK=off go vet ./... && \
              GOWORK=off go build ./...)
          done

          echo '==> clean external consumer qualification'
          tmp="$(mktemp -d)"
          cd "$tmp"
          GOWORK=off go mod init yunka-c41-rc3-external-probe >/dev/null
          GOWORK=off go get "github.com/hvritual/yunka.io/pkg@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/framework@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/gateway@${RC_VERSION}"
          GOWORK=off go list -m all >/dev/null
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/pkg)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/framework)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/gateway)" = "$RC_VERSION"
          cd - >/dev/null
          rm -rf "$tmp"

          trap - ERR
          echo "C4.1 RC3 qualified at ${CANDIDATE_SHA}"
