name: c4-1-genproto-converge

on:
  push:
    branches:
      - fix/c4-1-module-publication-convergence
    paths:
      - .github/workflows/c4-1-genproto-converge.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: fix/c4-1-module-publication-convergence
      RC_VERSION: v0.1.0-c41rc3
      GENPROTO_VERSION: v0.0.0-20260810153831-ec0a7760b754
      GONOPROXY: github.com/hvritual/yunka.io/*
      GONOSUMDB: github.com/hvritual/yunka.io/*
    steps:
      - name: Checkout C4.1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/c4-1-module-publication-convergence
          fetch-depth: 0

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.13
          cache: false

      - name: Converge split genproto graph
        shell: bash
        run: |
          set -euo pipefail

          for file in framework/go.mod gateway/go.mod app/go.mod tools/module-release.env docs/waves/C4.1-module-publication-convergence.md; do
            if [[ -f "$file" ]]; then
              sed -i 's/v0\.1\.0-c41rc2/v0.1.0-c41rc3/g' "$file"
            fi
          done

          # Go kit v0.13.0 still carries a 2021 pre-split root genproto requirement.
          # A plain higher indirect require is removed by `go mod tidy`, so pkg owns a
          # build-tagged dependency anchor to make the compatibility floor explicit,
          # tidy-stable, and inherited by framework/gateway consumers through pkg/go.mod.
          mkdir -p pkg/internal/dependencyanchor
          cat > pkg/internal/dependencyanchor/genproto.go <<'EOF'
          //go:build yunka_dependency_anchor

          // Package dependencyanchor contains build-tagged imports that make
          // publish-time module graph compatibility constraints explicit. It is not
          // part of Yunka's runtime graph.
          package dependencyanchor

          import _ "google.golang.org/genproto/googleapis/type/date"
          EOF

          (cd pkg && GOWORK=off go mod edit -require=google.golang.org/genproto@${GENPROTO_VERSION})
          (cd pkg && GOWORK=off go mod tidy)

          # Sibling replacements below exist only in this runner while the RC3 tags do
          # not exist yet. They are removed before the candidate commit.
          (cd framework && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg)
          (cd gateway && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/framework=../framework && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/framework)
          (cd app && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg)

          rm -f go.work.sum

          if grep -n '^replace ' pkg/go.mod framework/go.mod gateway/go.mod; then
            echo 'publishable module go.mod contains replace directive' >&2
            exit 1
          fi
          grep -q "google.golang.org/genproto ${GENPROTO_VERSION}" pkg/go.mod || {
            echo 'pkg did not retain modern root genproto floor after tidy' >&2
            exit 1
          }
          selected="$(cd pkg && GOWORK=off go list -m -f '{{.Version}}' google.golang.org/genproto)"
          test "$selected" = "$GENPROTO_VERSION" || {
            echo "pkg selected root genproto $selected, expected $GENPROTO_VERSION" >&2
            exit 1
          }
          for module in pkg framework gateway; do
            if grep -q 'github.com/go-kit/kit v0.10.0' "$module/go.mod"; then
              echo "$module regressed to go-kit v0.10.0" >&2
              exit 1
            fi
          done
          if grep -R -n 'v0.1.0-c41rc2' framework/go.mod gateway/go.mod app/go.mod tools/module-release.env; then
            echo 'RC2 sibling reference remains in RC3 contract' >&2
            exit 1
          fi

          cat >> docs/waves/C4.1-module-publication-convergence.md <<'EOF'

          ## RC3 genproto split convergence

          RC2 removed the unreachable Lyft dependency by raising Go kit to v0.13.0.
          That version still references a 2021 pre-split root `google.golang.org/genproto`,
          while Yunka already uses the modern split `googleapis/api` and `googleapis/rpc`
          modules. The mixed graph produces ambiguous imports.

          A plain modern root-genproto `require` is not stable because `go mod tidy`
          removes version-only constraints that have no package dependency. RC3 therefore
          adds `pkg/internal/dependencyanchor`, enabled only by the
          `yunka_dependency_anchor` build tag, with a blank import of the root-module-only
          `google.golang.org/genproto/googleapis/type/date` package. This gives the modern
          root genproto floor a real package reason to remain in `pkg/go.mod`; Go's module
          tidy analysis considers build-tagged packages, while normal Yunka runtime builds
          do not compile the anchor. Framework and gateway inherit the floor transitively
          through their published dependency on pkg. No publishable module uses `replace`.
          EOF

      - name: Commit exact RC3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/c4-1-genproto-converge.yml
          git add -A
          git commit -m 'build: make C4.1 genproto floor tidy-stable'
          git push origin "HEAD:${BRANCH}"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish RC3 tags and qualify exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            git push origin \
              :refs/tags/pkg/${RC_VERSION} \
              :refs/tags/framework/${RC_VERSION} \
              :refs/tags/gateway/${RC_VERSION} || true
          }
          trap cleanup ERR

          for prefix in pkg framework gateway; do
            if git ls-remote --exit-code --tags origin "refs/tags/${prefix}/${RC_VERSION}" >/dev/null 2>&1; then
              echo "RC3 tag already exists: ${prefix}/${RC_VERSION}" >&2
              exit 1
            fi
            git tag "${prefix}/${RC_VERSION}" "$CANDIDATE_SHA"
          done
          git push origin \
            "refs/tags/pkg/${RC_VERSION}" \
            "refs/tags/framework/${RC_VERSION}" \
            "refs/tags/gateway/${RC_VERSION}"

          for prefix in pkg framework gateway; do
            resolved="$(git ls-remote --tags origin "refs/tags/${prefix}/${RC_VERSION}" | awk '{print $1}')"
            test "$resolved" = "$CANDIDATE_SHA"
          done

          echo '==> source workspace qualification'
          for module in pkg framework gateway app; do
            echo "==> workspace ${module}"
            (cd "$module" && go test ./... && go vet ./... && go build ./...)
          done

          echo '==> standalone module qualification'
          for module in pkg framework gateway app; do
            echo "==> GOWORK=off ${module}"
            (cd "$module" && \
              GOWORK=off go list -m all >/dev/null && \
              GOWORK=off go test ./... && \
              GOWORK=off go vet ./... && \
              GOWORK=off go build ./...)
          done

          echo '==> clean external consumer qualification'
          tmp="$(mktemp -d)"
          cd "$tmp"
          GOWORK=off go mod init yunka-c41-rc3-external-probe >/dev/null
          GOWORK=off go get "github.com/hvritual/yunka.io/pkg@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/framework@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/gateway@${RC_VERSION}"
          GOWORK=off go list -m all >/dev/null
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/pkg)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/framework)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/gateway)" = "$RC_VERSION"
          cd - >/dev/null
          rm -rf "$tmp"

          trap - ERR
          echo "C4.1 RC3 qualified at ${CANDIDATE_SHA}"
