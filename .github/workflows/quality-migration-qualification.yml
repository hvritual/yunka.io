name: quality-migration-qualification

on:
  pull_request:
    paths:
      - 'app/cmd/change/**'
      - 'app/cmd/audit/**'
      - 'app/cmd/auditcore/**'
      - 'app/cmd/sourceaudit/**'
      - 'docs/architecture/ENGINEERING_QUALITY_MIGRATION.md'
      - '.github/workflows/quality-migration-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hvritual/biz
          ref: 3519e7ee6e51e33984669871e4f32a55a3597d9f
          path: _consumer/biz
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hvritual/yunka.io
          ref: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
          path: _consumer/biz-runtime
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hvritual/iot-delivery-system
          ref: bcd20632b666405c3f7a8fe8d53f591c78450087
          path: _consumer/iot
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hvritual/yunka.io
          ref: 057ebcf88a87303eb633eb6e604d306f633dfac0
          path: _consumer/iot-runtime
          persist-credentials: false
      - name: Load locked Go version
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION:?}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: app/go.sum
      - name: Build and qualify migration contracts
        working-directory: app
        shell: bash
        env:
          YUNKA_MIGRATION_CONSUMER_BIZ: ${{ github.workspace }}/_consumer/biz
          YUNKA_MIGRATION_BIZ_RUNTIME: ${{ github.workspace }}/_consumer/biz-runtime
          YUNKA_MIGRATION_CONSUMER_IOT: ${{ github.workspace }}/_consumer/iot
          YUNKA_MIGRATION_IOT_RUNTIME: ${{ github.workspace }}/_consumer/iot-runtime
          YUNKA_MIGRATION_FRAMEWORK_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          go build -mod=readonly -o "$RUNNER_TEMP/yunka" ./cmd
          go test ./cmd/change -run '^TestQualityMigration' -count=1 -v
      - name: Prove qualification did not mutate framework or consumers
        shell: bash
        run: |
          set -euo pipefail
          framework_status="$(git status --porcelain --untracked-files=all -- . ':(exclude)_consumer/**')"
          test -z "$framework_status"
          biz_status="$(git -C _consumer/biz status --porcelain --untracked-files=all)"
          test -z "$biz_status"
          biz_runtime_status="$(git -C _consumer/biz-runtime status --porcelain --untracked-files=all)"
          test -z "$biz_runtime_status"
          iot_status="$(git -C _consumer/iot status --porcelain --untracked-files=all)"
          test -z "$iot_status"
          iot_runtime_status="$(git -C _consumer/iot-runtime status --porcelain --untracked-files=all)"
          test -z "$iot_runtime_status"
