name: c9-7-idempotency-hardening

on:
  push:
    branches:
      - agent/c9-7-execution-semantics
    paths:
      - tools/c9_7_idempotency_hardening.py
      - .github/workflows/c9-7-idempotency-hardening.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c9-7-execution-semantics
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.13
          cache: false
      - name: Apply durable idempotency hardening
        run: python3 tools/c9_7_idempotency_hardening.py
      - name: Validate core and MySQL adapter
        shell: bash
        env:
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
        run: |
          set -euo pipefail
          gofmt -w framework/execution/idempotency.go framework/execution/idempotency_test.go framework/execution/idempotencygorm/*.go framework/operation/executor.go framework/operation/idempotency_atomic_test.go pkg/operationplan/plan.go pkg/operationplan/plan_test.go
          (cd pkg && go test ./operationplan)
          (cd framework && go test ./execution/... ./operation)
          (cd framework && go test -count=1 -tags=integration ./execution/idempotencygorm)
          git diff --check
      - name: Commit hardening and self-remove builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/c9_7_idempotency_hardening.py .github/workflows/c9-7-idempotency-hardening.yml
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add -A
          git commit -m "feat: make C9.7 idempotency durable and atomic"
          git push origin HEAD:agent/c9-7-execution-semantics
