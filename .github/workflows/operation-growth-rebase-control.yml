name: operation-growth-rebase-control

on:
  push:
    branches:
      - control/operation-growth-boundary-gate-20260917
    paths:
      - .github/workflows/operation-growth-rebase-control.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/161-operation-growth-boundary-gate
          fetch-depth: 0

      - name: Verify exact current-main base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test "$(git rev-parse HEAD^{tree})" = "9fc4a864b2aa6c038e0c737c555df340321d8017"

      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: |
            app/go.sum
            framework/go.sum
            gateway/go.sum
            infras/go.sum
            pkg/go.sum

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Apply only still-relevant old capabilities onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            7d7fc663f7086df9735ee9089c75f65d2fd100e4 \
            23789633f2e0dbcd20230cacca42e814047d86bc \
            f8fdce6c3bd7bd63eef05ae23b3fc9ba83c3b0de \
            62fe8e194b60637d8fee1d0bec90d9a67ccd9490

          git diff --binary 7d7fc663f7086df9735ee9089c75f65d2fd100e4 23789633f2e0dbcd20230cacca42e814047d86bc -- \
            contracts/proto/yunka/dsl/v1/options.proto \
            pkg/contract pkg/contractdsl/v1/options.pb.go \
            app/cmd/boundarycore app/cmd/boundary app/cmd/main.go \
            | git apply --3way

          git diff --binary 23789633f2e0dbcd20230cacca42e814047d86bc f8fdce6c3bd7bd63eef05ae23b3fc9ba83c3b0de -- \
            app/cmd/boundarycore \
            | git apply --3way

          git diff --binary f8fdce6c3bd7bd63eef05ae23b3fc9ba83c3b0de 62fe8e194b60637d8fee1d0bec90d9a67ccd9490 -- \
            app/cmd/add app/cmd/projectflow \
            | git apply --3way

          if git ls-files -u | grep -q .; then
            echo "3-way transplant left conflicts:" >&2
            git status --short >&2
            exit 1
          fi
          git status --short

      - name: Regenerate canonical protobuf outputs
        shell: bash
        run: |
          set -euo pipefail
          make rpc-generate
          gofmt -w app/cmd/boundary app/cmd/boundarycore app/cmd/add app/cmd/projectflow pkg/contract

      - name: Targeted compatibility probe
        shell: bash
        run: |
          set -euo pipefail
          (cd pkg && go test -count=1 ./contract)
          (cd app && go test -count=1 ./cmd/boundarycore ./cmd/boundary ./cmd/add ./cmd/projectflow ./cmd/change ./cmd/audit)
          make contract-check
          git diff --check

      - name: Publish qualified transplant baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yunka Delivery"
          git config user.email "quality-delivery@example.invalid"
          git add -- \
            contracts/proto/yunka/dsl/v1/options.proto \
            pkg/contract pkg/contractdsl/v1/options.pb.go \
            app/cmd/boundarycore app/cmd/boundary app/cmd/main.go \
            app/cmd/add app/cmd/projectflow
          git diff --cached --check
          git commit -m "feat(boundary): rebase operation authoring gate on current main"
          git push origin HEAD:fix/161-operation-growth-boundary-gate
          echo "candidate=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
