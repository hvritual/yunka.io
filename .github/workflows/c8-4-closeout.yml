name: c8-4-closeout

on:
  push:
    branches: [agent/c8-4-pb-dsl-domain-convergence]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c8-4-pb-dsl-domain-convergence
          fetch-depth: 0
      - name: Record C8.4 completion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          wave = Path('docs/waves/C8.4-pb-dsl-domain-convergence.md')
          text = wave.read_text()
          old = '- State: **Planned**'
          if old not in text:
              raise SystemExit('C8.4 status marker not found')
          text = text.replace(old, '- State: **Complete**', 1)
          completion = '''\n## Completion evidence\n\nC8.4 was completed on 2026-08-27 on `agent/c8-4-pb-dsl-domain-convergence` and delivered through PR #26.\n\nFinal verified evidence:\n\n- standard PR CI #136 (`33038743408`) passed on `0e875b038138c22a09803983ef75038ab457faec`, including dependency drift, Contract reproducibility/compatibility, `make verify`, race, vet, vuln, build, and determinism recheck;\n- the C8.4 generated REST/gRPC runtime fixture compiled a real temporary typed-PB application and proved both transports reuse the same Application Port, static policy, Gateway Authorizer, trusted Principal, tenant and Permission semantics;\n- MySQL 8.4 production run `33038910058` passed `make verify-production` on `9225c68532d1e7dfe1feb39068adce3201447010`; the runner used MySQL 8.4.11;\n- the MySQL gate proved generated Repository tenant isolation and optimistic version conflicts, then passed transactional outbox and request-scope integration;\n- temporary C8.4 control/production workflows were removed before merge.\n\nFinal responsibility boundary:\n\n```text\nPB -> RPC / REST / DTO / Domain / Application / Operation / Permission\nPO -> persistence schema\nyunka domain -> Entity -> basic Repository CRUD interface -> GORM CRUD implementation -> STOP\nBusiness code -> handwritten Application behavior, invariants, mappings, complex queries and workflows\n```\n'''
          if '## Completion evidence' not in text:
              text = text.rstrip() + '\n' + completion
          wave.write_text(text)

          memory = Path('PROJECT_MEMORY.md')
          mem = memory.read_text()
          marker = '## 2026-08-27 — C8.4 implementation complete'
          if marker not in mem:
              mem = mem.rstrip() + '''\n\n## 2026-08-27 — C8.4 implementation complete\n\n- C8.4 PB DSL and Domain Compiler Responsibility Convergence is complete via PR #26.\n- PB is the canonical DSL for RPC, REST, DTO, Domain, Application, Operation and Permission declarations.\n- Domain Manifest V3 is persistence-only; `yunka domain` generates PO -> Entity -> basic Repository CRUD interface/implementation and stops before Application/transport behavior.\n- PB-driven codegen emits Application Port, static policy, RPC adapter and REST adapter but never a default business implementation.\n- Gateway Authorizer remains the sole RBAC decision boundary; REST and gRPC consume the same Operation/Permission policy.\n- Permanent `domain-check`, `dsl-check` and C8.4 architecture guards are part of `make verify`.\n- Standard CI #136 passed and MySQL 8.4 production run `33038910058` passed `make verify-production`, including generated Repository tenant/version behavior plus requestscope/outbox integration.\n'''
              memory.write_text(mem)
          PY
          rm .github/workflows/c8-4-closeout.yml
          git diff --check
          git diff --stat
      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add docs/waves/C8.4-pb-dsl-domain-convergence.md PROJECT_MEMORY.md .github/workflows/c8-4-closeout.yml
          git commit -m 'docs: close C8.4 implementation'
          git push origin HEAD:agent/c8-4-pb-dsl-domain-convergence
