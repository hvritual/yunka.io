name: c4-1-stable-v0-1-0

on:
  push:
    branches:
      - release/c4-1-v0.1.0
    paths:
      - .github/workflows/c4-1-stable-v0-1-0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BRANCH: release/c4-1-v0.1.0
      STABLE_VERSION: v0.1.0
      MAIN_MERGE_SHA: 94113e9fb9fd021f773efd626dba49489b5b2071
      PKG_QUALIFIED_SHA: abdcc78c571b68e3ece4fed0014c20f75cf163ec
      GONOPROXY: github.com/hvritual/yunka.io/*
      GONOSUMDB: github.com/hvritual/yunka.io/*
    steps:
      - name: Checkout stable release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/c4-1-v0.1.0
          fetch-depth: 0

      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Preflight stable publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge-base --is-ancestor "$MAIN_MERGE_SHA" HEAD
          git merge-base --is-ancestor "$PKG_QUALIFIED_SHA" "$MAIN_MERGE_SHA"
          make toolchain-check
          make rpc-tools
          make rpc-toolchain-check
          test -z "$(git grep -n '^replace ' -- pkg/go.mod framework/go.mod gateway/go.mod || true)"
          test -z "$(git status --porcelain)"

      - name: Publish and qualify pkg v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$PKG_QUALIFIED_SHA" -- pkg
          ref="refs/tags/pkg/${STABLE_VERSION}"
          if git ls-remote --exit-code --tags origin "$ref" >/dev/null 2>&1; then
            actual="$(git ls-remote --tags origin "$ref" | awk '{print $1}')"
            test "$actual" = "$PKG_QUALIFIED_SHA" || {
              echo "pkg stable tag already exists at unexpected sha: $actual" >&2
              exit 1
            }
          else
            git tag "pkg/${STABLE_VERSION}" "$PKG_QUALIFIED_SHA"
            git push origin "$ref"
          fi
          test "$(git ls-remote --tags origin "$ref" | awk '{print $1}')" = "$PKG_QUALIFIED_SHA"
          (cd pkg && \
            GOWORK=off go mod tidy -diff && \
            GOWORK=off go list -m all >/dev/null && \
            GOWORK=off go test ./... && \
            GOWORK=off go vet ./... && \
            GOWORK=off go build ./...)
          tmp="$(mktemp -d)"
          (cd "$tmp" && \
            GOWORK=off go mod init yunka-pkg-stable-probe >/dev/null && \
            GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go get "github.com/hvritual/yunka.io/pkg@${STABLE_VERSION}" && \
            test "$(GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/pkg)" = "$STABLE_VERSION")
          rm -rf "$tmp"

      - name: Pin, publish and qualify framework v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/tags/framework/${STABLE_VERSION}"
          if git ls-remote --exit-code --tags origin "$ref" >/dev/null 2>&1; then
            framework_sha="$(git ls-remote --tags origin "$ref" | awk '{print $1}')"
            git merge-base --is-ancestor "$framework_sha" HEAD
            grep -q "github.com/hvritual/yunka.io/pkg ${STABLE_VERSION}" framework/go.mod
          else
            (cd framework && go mod edit -require="github.com/hvritual/yunka.io/pkg@${STABLE_VERSION}")
            (cd framework && GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go mod tidy)
            grep -q "github.com/hvritual/yunka.io/pkg ${STABLE_VERSION}" framework/go.mod
            test -z "$(grep '^replace ' framework/go.mod || true)"
            (cd framework && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go mod tidy -diff && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go list -m all >/dev/null && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go test ./... && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go vet ./... && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go build ./...)
            git add framework/go.mod framework/go.sum
            git commit -m 'release: pin framework to pkg v0.1.0'
            git push origin "HEAD:${BRANCH}"
            framework_sha="$(git rev-parse HEAD)"
            git tag "framework/${STABLE_VERSION}" "$framework_sha"
            git push origin "$ref"
          fi
          echo "FRAMEWORK_SHA=$framework_sha" >> "$GITHUB_ENV"
          test "$(git ls-remote --tags origin "$ref" | awk '{print $1}')" = "$framework_sha"

      - name: Pin, publish and qualify gateway v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/tags/gateway/${STABLE_VERSION}"
          if git ls-remote --exit-code --tags origin "$ref" >/dev/null 2>&1; then
            gateway_sha="$(git ls-remote --tags origin "$ref" | awk '{print $1}')"
            git merge-base --is-ancestor "$gateway_sha" HEAD
            grep -q "github.com/hvritual/yunka.io/pkg ${STABLE_VERSION}" gateway/go.mod
            grep -q "github.com/hvritual/yunka.io/framework ${STABLE_VERSION}" gateway/go.mod
          else
            (cd gateway && go mod edit -require="github.com/hvritual/yunka.io/pkg@${STABLE_VERSION}")
            (cd gateway && go mod edit -require="github.com/hvritual/yunka.io/framework@${STABLE_VERSION}")
            (cd gateway && GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go mod tidy)
            grep -q "github.com/hvritual/yunka.io/pkg ${STABLE_VERSION}" gateway/go.mod
            grep -q "github.com/hvritual/yunka.io/framework ${STABLE_VERSION}" gateway/go.mod
            test -z "$(grep '^replace ' gateway/go.mod || true)"
            (cd gateway && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go mod tidy -diff && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go list -m all >/dev/null && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go test ./... && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go vet ./... && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go build ./...)
            git add gateway/go.mod gateway/go.sum
            git commit -m 'release: pin gateway to stable Yunka v0.1.0'
            git push origin "HEAD:${BRANCH}"
            gateway_sha="$(git rev-parse HEAD)"
            git tag "gateway/${STABLE_VERSION}" "$gateway_sha"
            git push origin "$ref"
          fi
          echo "GATEWAY_SHA=$gateway_sha" >> "$GITHUB_ENV"
          test "$(git ls-remote --tags origin "$ref" | awk '{print $1}')" = "$gateway_sha"

      - name: Converge repository bookkeeping to stable v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          (cd app && go mod edit -require="github.com/hvritual/yunka.io/pkg@${STABLE_VERSION}")
          (cd app && GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go mod tidy)
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/module-release.env')
          lines = path.read_text().splitlines()
          out = []
          replaced = False
          for line in lines:
              if line.startswith('YUNKA_MODULE_RELEASE='):
                  out.append('YUNKA_MODULE_RELEASE=v0.1.0')
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              raise SystemExit('YUNKA_MODULE_RELEASE line missing')
          path.write_text('\n'.join(out) + '\n')
          PY
          rm -f go.work.sum
          go list -m all >/dev/null
          make rpc-check
          make contract
          make contract-check
          git diff --exit-code -- contracts/generated
          grep -q "github.com/hvritual/yunka.io/pkg ${STABLE_VERSION}" app/go.mod
          grep -q "YUNKA_MODULE_RELEASE=${STABLE_VERSION}" tools/module-release.env
          git add app/go.mod app/go.sum tools/module-release.env go.work.sum
          if ! git diff --cached --quiet; then
            git commit -m 'release: converge repository bookkeeping to v0.1.0'
            git push origin "HEAD:${BRANCH}"
          fi
          echo "WORKSPACE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Qualify stable source workspace and external consumer
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          (cd app && go test ./cmd -run TestC116CExpertCommandCompatibilitySnapshots -count=1)
          (cd app && go test ./cmd/projectflow -run TestC114QualificationRealBinaryFastFeedback -count=1)
          make tidy
          make dependency-check
          git diff --exit-code -- go.work go.work.sum pkg/go.mod pkg/go.sum framework/go.mod framework/go.sum gateway/go.mod gateway/go.sum app/go.mod app/go.sum
          make rpc-check
          make contract
          make contract-check
          git diff --exit-code -- contracts/generated go.work.sum
          for module in pkg framework gateway app; do
            echo "==> workspace ${module}"
            (cd "$module" && go test ./... && go vet ./... && go build ./...)
          done
          for module in pkg framework gateway; do
            echo "==> standalone ${module}"
            (cd "$module" && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go mod tidy -diff && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go list -m all >/dev/null && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go test ./... && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go vet ./... && \
              GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go build ./...)
          done
          tmp="$(mktemp -d)"
          cd "$tmp"
          GOWORK=off go mod init yunka-v0-1-0-external-probe >/dev/null
          GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go get "github.com/hvritual/yunka.io/pkg@${STABLE_VERSION}"
          GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go get "github.com/hvritual/yunka.io/framework@${STABLE_VERSION}"
          GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go get "github.com/hvritual/yunka.io/gateway@${STABLE_VERSION}"
          test "$(GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/pkg)" = "$STABLE_VERSION"
          test "$(GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/framework)" = "$STABLE_VERSION"
          test "$(GOPROXY=direct GONOSUMDB='github.com/hvritual/yunka.io/*' GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/gateway)" = "$STABLE_VERSION"
          cd - >/dev/null
          rm -rf "$tmp"
          test -z "$(git status --porcelain)"

      - name: Record successful stable publication and retire executor
        shell: bash
        run: |
          set -euo pipefail
          pkg_sha="$(git ls-remote --tags origin "refs/tags/pkg/${STABLE_VERSION}" | awk '{print $1}')"
          framework_sha="$(git ls-remote --tags origin "refs/tags/framework/${STABLE_VERSION}" | awk '{print $1}')"
          gateway_sha="$(git ls-remote --tags origin "refs/tags/gateway/${STABLE_VERSION}" | awk '{print $1}')"
          cat >> docs/waves/C4.1-module-publication-convergence.md <<EOF

## Stable v0.1.0 publication record

Stable module publication completed successfully in workflow run `${GITHUB_RUN_ID}` after C4.1 canonical integration at `${MAIN_MERGE_SHA}`.

- `pkg/v0.1.0` -> `${pkg_sha}`
- `framework/v0.1.0` -> `${framework_sha}`
- `gateway/v0.1.0` -> `${gateway_sha}`
- repository release bookkeeping -> `${WORKSPACE_SHA}`

The stable Gate covered independent `GOWORK=off` tidy/test/vet/build for all publishable modules, the clean four-module source workspace, dependency-policy and generated-contract reproducibility, and a clean external consumer resolving all three modules at `v0.1.0` without repository-local replacements.
EOF
          git rm -f .github/workflows/c4-1-stable-v0-1-0.yml
          git add docs/waves/C4.1-module-publication-convergence.md
          git commit -m 'docs: record Yunka v0.1.0 stable publication'
          git push origin "HEAD:${BRANCH}"
