name: semantic-review-qualification

on:
  pull_request:
    paths:
      - 'app/cmd/advisor/**'
      - 'app/cmd/advisorcore/**'
      - 'docs/architecture/SEMANTIC_ARCHITECTURE_REVIEW.md'
      - '.github/workflows/semantic-review-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load locked Go version
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION:?}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: app/go.sum
      - name: Build and run semantic review regressions
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          go build -mod=readonly -o "$RUNNER_TEMP/yunka" ./cmd
          go test ./cmd/advisorcore ./cmd/advisor -count=1
          go test ./cmd/advisorcore -run '^TestSemanticReview' -count=1 -v
          go test ./cmd/advisor -run '^TestSemanticReview' -count=1 -v
      - name: Prove qualification did not mutate checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
