name: c8-3-generate-verify

on:
  push:
    branches: [agent/c8-3-permission-convergence]

permissions:
  contents: read

jobs:
  generate-verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_c83
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: |
            app/go.sum
            framework/go.sum
            gateway/go.sum
            pkg/go.sum

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Generate and normalize
        shell: bash
        run: |
          set -euo pipefail
          make rpc-generate
          make tidy
          gofmt -w \
            gateway/dispatcher/intercept/intercept.go \
            gateway/dispatcher/intercept/role/composition.go \
            gateway/dispatcher/intercept/role/role_intercept.go \
            gateway/dispatcher/intercept/role/db/*.go \
            gateway/dispatcher/middleware/role_middleware.go \
            gateway/dispatcher/middleware/role_middleware_test.go \
            gateway/rpc/meta/abi_compat_test.go \
            pkg/architecturepolicy/c8_authz_test.go

      - name: C8.3 targeted verification
        shell: bash
        env:
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_c83?parseTime=true&multiStatements=true
        run: |
          set -euo pipefail
          make architecture-check
          (cd gateway && go test -count=10 ./authz ./dispatcher/bridge ./dispatcher/intercept/role ./dispatcher/middleware ./rpc/transport/grpc ./rpc/meta)
          (cd gateway && CGO_ENABLED=1 go test -race -count=2 ./authz ./dispatcher/bridge ./dispatcher/intercept/role ./dispatcher/middleware ./rpc/transport/grpc)
          (cd gateway && go test -count=1 -tags=integration ./dispatcher/intercept/role)
          make rpc-contract-check

      - name: Collect deterministic generated changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c8-artifact/files
          git diff --name-only > c8-artifact/files.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ -f "$path" ] || continue
            mkdir -p "c8-artifact/files/$(dirname "$path")"
            cp "$path" "c8-artifact/files/$path"
          done < c8-artifact/files.txt
          git status --short > c8-artifact/status.txt
          cat c8-artifact/status.txt

      - uses: actions/upload-artifact@v4
        with:
          name: c8-3-generated
          path: c8-artifact
          if-no-files-found: error
