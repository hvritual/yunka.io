name: boundary-inspect-hardclose3

on:
  push:
    branches:
      - control/operation-growth-boundary-gate-20260917
    paths:
      - .github/workflows/boundary-inspect-hardclose3.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: control/operation-growth-boundary-gate-20260917
          path: controller
          fetch-depth: 0

      - name: Checkout exact Hardclose 3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/boundary-inspect-readonly
          path: product
          fetch-depth: 0

      - name: Verify exact merged-main base
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git fetch origin main feat/boundary-inspect-readonly
          test "$(git rev-parse HEAD)" = "3b70323d29c694e4e44142b66c16e2e25ac0f9de"
          test "$(git rev-parse HEAD^{tree})" = "9e269384d31a58cd716b5aa9345d203603605d58"
          test "$(git rev-parse origin/main)" = "3b70323d29c694e4e44142b66c16e2e25ac0f9de"

      - name: Load locked toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source product/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: |
            product/app/go.sum
            product/pkg/go.sum

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Prime locked RPC generator tools
        shell: bash
        run: |
          set -euo pipefail
          cd product
          make rpc-tools rpc-toolchain-check

      - name: Materialize public read-only boundary inspect
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../controller/tools/boundary_inspect_hardclose3.py
          python3 ../controller/tools/boundary_inspect_hardclose3_fix1.py
          gofmt -w \
            app/cmd/boundary/command.go \
            app/cmd/boundary/command_test.go \
            app/cmd/yunka.go \
            app/cmd/discoverability.go \
            app/cmd/discoverability_qualification_test.go
          git diff --check

      - name: Create unpushed Hardclose 3 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "Yunka Delivery"
          git config user.email "quality-delivery@example.invalid"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(boundary): expose read-only canonical inspect"
          test "$(git rev-parse HEAD^)" = "3b70323d29c694e4e44142b66c16e2e25ac0f9de"
          test -z "$(git status --porcelain)"
          echo "candidate=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"

      - name: Focused Hardclose 3 qualification
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          cd product
          make toolchain-check
          (cd app && go test -count=1 ./cmd/boundary ./cmd/boundarycore ./cmd/projectflow)
          (cd app && go test -count=1 ./cmd -run '^(TestC116DQualificationRealBinaryDiscoverability|TestT4Discoverability)')
          make tidy
          git diff --exit-code -- go.work go.work.sum pkg/go.mod pkg/go.sum framework/go.mod framework/go.sum gateway/go.mod gateway/go.sum infras/go.mod infras/go.sum app/go.mod app/go.sum
          make contract
          git diff --exit-code -- contracts/generated
          make contract-check
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Publish qualified Hardclose 3 branch
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git fetch origin main feat/boundary-inspect-readonly
          test "$(git rev-parse HEAD^)" = "3b70323d29c694e4e44142b66c16e2e25ac0f9de"
          test "$(git rev-parse origin/feat/boundary-inspect-readonly)" = "3b70323d29c694e4e44142b66c16e2e25ac0f9de"
          test "$(git rev-parse origin/main)" = "3b70323d29c694e4e44142b66c16e2e25ac0f9de"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/boundary-inspect-readonly
          echo "published=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
