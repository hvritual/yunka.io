name: tmp-typed-infra-reconcile

on:
  push:
    branches: [docs/typed-infra-postmerge-reconciliation]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconcile typed infrastructure capability truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing reconciliation marker in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          # STATUS: reconcile AX6 and typed infrastructure capability delivery.
          replace_once(
              "docs/STATUS.md",
              "| Agent Experience control-plane convergence | **AX1-AX5 complete / production-qualified / merged; AX6 not started** | PRs #125, #126, #127, #129, and #132 add context, ownership, agent diagnostics, change planning, and explicit structural scaffolds; these remain developer/control-plane capabilities and do not establish a new numbered runtime wave |",
              "| Agent Experience control-plane convergence | **AX1-AX6 complete / production-qualified / merged; AX7 not started** | PRs #125, #126, #127, #129, #132, and #133 add context, ownership, agent diagnostics, change planning, explicit structural scaffolds, and a canonical JSONL runtime event projection; these remain developer/control-plane capabilities and do not establish a new numbered runtime wave |",
          )
          old_infras_row = "| Separately versioned infrastructure extension module | **Complete / production-qualified / merged** | issue #121 / PR #122; exact candidate `fc09f296cccb14ae18891bc43642d5efe43bd484` passed CI #430 and production #190, then merged as `70611d6cee5dd4e37ae6a803bcb38b938acd59c9`; independent `infras/vX.Y.Z` tag surface exists, but no `infras/v0.1.0` release tag is claimed yet |"
          new_infras_rows = old_infras_row + "\n| Typed infrastructure capability export / binding | **Complete / production-qualified / merged** | issue #124 / PR #131; exact candidate `c3123fb4a3e7731f0edf5539c3d8003fc0e41bc7` passed CI #475 and production #233 after synchronization with AX6 main, merged as `d06a6330db9093e0bc586decb6bdc00122b4aa99`, and exact-main push CI #476 / production #234 also passed |"
          replace_once("docs/STATUS.md", old_infras_row, new_infras_rows)
          replace_once(
              "docs/STATUS.md",
              "AX1-AX5 are closed and merged. They productize an AI/automation-facing control plane around the existing canonical project/compiler/runtime contracts rather than introducing a second compiler, business DSL, ownership manifest, or runtime.",
              "AX1-AX6 are closed and merged. They productize an AI/automation-facing control plane around the existing canonical project/compiler/runtime contracts rather than introducing a second compiler, business DSL, ownership manifest, or runtime.",
          )
          replace_once(
              "docs/STATUS.md",
              "AX6 runtime event-stream work is **not started** in this reconciliation. Any AX6 implementation must preserve the AX1-AX5 source-of-truth, ownership, compiler, Executor, authorization, and root UoW boundaries.",
              "### AX6 — Runtime Event Stream\n\n**State: COMPLETE / PRODUCTION-QUALIFIED / MERGED.**\n\n`yunka dev [run] --event-format jsonl` exposes a stable machine-readable projection of the existing dev plan and canonical RuntimeReport while reserving stdout for JSONL events and keeping child process output off the machine channel. `yunka dev status --format jsonl` provides the finite snapshot form. Runtime/application state, diagnostics, and closure-complete evidence remain projections of existing runtime truth; AX6 does not add a second supervisor, readiness model, Executor path, security model, or persistence format.\n\nEvidence: PR #133; exact candidate `7538b8279ef16adf19cd258a837fa0a13f98042f`; CI run `33740395756` PASS; production run `33740395812` PASS on MySQL 8.4 with clean-worktree; merged as `ee0f1097fa6eaed900a92cd9563cca31dbfedab1`.\n\nAX7 real-Agent end-to-end qualification is **not started** in this reconciliation.",
          )
          marker = "## Current pressure frontier"
          typed_section = """## Typed infrastructure capability binding\n\nIssue #124 / PR #131 closes the typed provider-to-Application constructor path required by separately versioned infrastructure plugins.\n\n**State: COMPLETE / PRODUCTION-QUALIFIED / MERGED.**\n\nA module descriptor may declare `Descriptor.Provides` entries identified by a logical capability name plus Go package/type identity. A built module that provides values implements `modulecatalog.CapabilityExporter`; descriptor promises and runtime exports must match exactly. Duplicate providers, undeclared exports, missing exports, contract mismatches, and non-assignable values fail before App start. Capability values remain owned by the provider module/App lifecycle.\n\nApplication protobuf now declares `ApplicationDeclaration.capabilities` separately from cross-Application `requires` and Operation `requires_operations`. The compiler carries capability identity into Manifest/AssemblyPlan and generated Application dependency structs. Generated Assembly resolves the typed value only during Application construction and passes a normal Go interface through generated `*Dependencies`; business runtime code does not retain `CapabilitySet` and there is no `app.Get(string)`, reflection DI, or public untyped service locator. Separately versioned plugin descriptors are explicit `AdditionalModules` composition inputs.\n\nThe current declarative module authoring surface (`module.yunka.json` / `yunka module add`) still models module input `Requirements` only and does not synthesize `Descriptor.Provides`. An exporting plugin therefore composes its capability-providing descriptor explicitly in handwritten Go (without editing generated module source) and passes that descriptor to generated Assembly. This is an authoring/DX limitation, not a runtime/compiler binding gap.\n\nEvidence: issue #124; exact candidate `c3123fb4a3e7731f0edf5539c3d8003fc0e41bc7`; CI #475 and production #233 success; merge PR #131 as `d06a6330db9093e0bc586decb6bdc00122b4aa99`; exact-main push CI #476 and production #234 success.\n\n"""
          replace_once("docs/STATUS.md", marker, typed_section + marker)
          old_deferred = "- Durable Operation idempotency provides duplicate-execution suppression; response/result replay remains outside the current contract unless future real pressure justifies it."
          new_deferred = old_deferred + "\n- Declarative module specs currently author module input `Requirements` but do not synthesize typed capability `Descriptor.Provides`; exporting infra plugins use explicit handwritten descriptor composition until real DX pressure justifies extending module-spec authoring."
          replace_once("docs/STATUS.md", old_deferred, new_deferred)

          # PROJECT_MEMORY: durable capability ownership/composition invariants only.
          old_plugin = "- Yunka infrastructure plugins are compile-time optional Go modules, not Go runtime `plugin`/`.so` shared objects. Type checking, deterministic dependency resolution, cross-platform builds, App lifecycle/health, and diagnostics remain canonical."
          new_plugin = old_plugin + "\n- `modulecatalog.Descriptor.Provides` is the canonical static declaration of process/App-scoped capability exports; identity is the logical capability name plus Go contract package/type. A `CapabilityExporter` instance must exactly satisfy its descriptor declarations, and undeclared/missing/mismatched/duplicate providers fail before App start.\n- Exported capability values remain owned by the provider module/App lifecycle. `CapabilitySet` is an immutable bootstrap-time binding view only; business runtime code must not retain it or acquire capabilities through string lookup, reflection, or a global registry."
          replace_once("PROJECT_MEMORY.md", old_plugin, new_plugin)

          old_startup = "- Module startup order comes from explicit dependency DAG facts and is deterministic."
          new_startup = old_startup + "\n- `ApplicationDeclaration.capabilities` declares typed process/App-scoped infrastructure constructor dependencies separately from cross-Application `requires` and Operation `requires_operations`. The compiler carries logical key plus Go contract identity through AssemblyPlan into generated typed Application dependency structs.\n- Typed infrastructure capability resolution occurs only during bootstrap/Application construction, before transport registration and App start; generated business Applications receive ordinary Go typed dependencies and do not receive a resolver.\n- Separately versioned plugin descriptors consumed by generated Assembly are explicit composition inputs (`AdditionalModules`); generated Assembly must not discover optional infrastructure through a package-global default catalog."
          replace_once("PROJECT_MEMORY.md", old_startup, new_startup)

          old_contract = "- Protobuf is the canonical writable DSL for RPC, explicit REST bindings, DTOs, Domain/Application declarations, stable Operation IDs, authentication/tenant requirements, Permission requirements, composition, and currently supported execution-policy facts."
          new_contract = "- Protobuf is the canonical writable DSL for RPC, explicit REST bindings, DTOs, Domain/Application declarations, stable Operation IDs, authentication/tenant requirements, Permission requirements, typed Application infrastructure capability requirements, composition, and currently supported execution-policy facts."
          replace_once("PROJECT_MEMORY.md", old_contract, new_contract)

          old_app_comp = "- `ApplicationDeclaration.requires` declares typed Application dependencies.\n- `OperationDeclaration.requires_operations` declares explicit child Operation dependencies."
          new_app_comp = "- `ApplicationDeclaration.requires` declares typed Application dependencies.\n- `ApplicationDeclaration.capabilities` declares typed process/App-scoped infrastructure constructor dependencies; it is not an Application edge, Operation edge, runtime service locator, or business capability taxonomy.\n- `OperationDeclaration.requires_operations` declares explicit child Operation dependencies."
          replace_once("PROJECT_MEMORY.md", old_app_comp, new_app_comp)

          # Infras README: provider + consumer usage, including current declarative-authoring limit.
          replace_once(
              "infras/README.md",
              "A program may enable an infrastructure plugin explicitly by registering its descriptor, or by blank-importing the plugin's `autoload` package:",
              "A composition path that intentionally uses the default module catalog may enable a lifecycle-only infrastructure plugin by registering its descriptor explicitly or blank-importing the plugin's `autoload` package:",
          )
          insert_marker = "## Initial plugin"
          typed_readme = r'''## Typed capability export and consumer binding

Infrastructure modules that must be called directly by Application code use the typed capability contract rather than a service locator.

The provider defines one stable Go interface contract and a typed capability key. The package/type strings must be the real import identity of that contract:

```go
var CacheDefault = modulecatalog.MustCapabilityKey[cachecontract.Cache](
    "cache.default",
    "example.com/contracts/cache",
    "Cache",
)
```

Its composed descriptor declares the export and its built module instance implements `CapabilityExporter`:

```go
func CapabilityDescriptor() modulecatalog.Descriptor {
    descriptor := GeneratedDescriptor() // optional generated base descriptor
    descriptor.Provides = []modulecatalog.CapabilityContract{
        CacheDefault.Contract(),
    }
    return descriptor
}

func (module *Module) ExportCapabilities() []modulecatalog.CapabilityExport {
    return []modulecatalog.CapabilityExport{
        CacheDefault.Export(module.cache),
    }
}
```

Do not edit `zz_yunka_module_gen.go`. The current declarative `module.yunka.json` schema describes module input `Requirements` but does not yet generate `Descriptor.Provides`, so an exporting plugin currently adds the `Provides` wrapper in handwritten Go.

The consuming Application declares the same logical key and Go interface identity in protobuf:

```protobuf
option (yunka.dsl.v1.application) = {
  name: "query"
  capabilities: {
    name: "cache.default"
    go_package: "example.com/contracts/cache"
    go_type: "Cache"
  }
};
```

Assembly generation projects that declaration into a normal typed dependency field. Consumer-owned factory code receives the generated dependency and passes it into the Application implementation:

```go
func (factory factories) BuildDeviceQuery(
    dependencies generatedassembly.DeviceQueryDependencies,
) (deviceapplication.QueryApplication, error) {
    return newDeviceQuery(dependencies.CacheDefault), nil
}
```

For generated Assembly, separately versioned infrastructure implementations are explicit composition inputs:

```go
result, err := generatedassembly.Bootstrap(ctx, generatedassembly.BootstrapOptions{
    Platform: platformProvider,
    AdditionalModules: []modulecatalog.Descriptor{
        rediscache.CapabilityDescriptor(),
    },
    Factories: factories{},
    Executor: executor,
    Transports: transports,
})
```

Generated Assembly does not discover optional infrastructure from blank imports. A blank-imported generated `autoload` package also cannot add typed exports that are absent from the generated descriptor, so exporting plugins should use the explicit descriptor path above until declarative `Provides` authoring is added.

At bootstrap, Yunka validates descriptor/export equality and provider uniqueness, snapshots an immutable `CapabilitySet`, resolves the generated typed constructor dependency, and discards the resolver from business runtime. Missing, duplicate, undeclared, mismatched, or non-assignable capabilities fail before transport registration/App start. Provider module/App lifecycle ownership is unchanged, and separate App instances receive isolated capability values.

'''
          replace_once("infras/README.md", insert_marker, typed_readme + insert_marker)

          # module-authoring: distinguish inputs from exports and document explicit wrapper path.
          replace_once("docs/module-authoring.md", "## Capability rules", "## Module input requirements")
          replace_once(
              "docs/module-authoring.md",
              "A module may receive only capabilities declared by its immutable descriptor:",
              "A module may receive only platform inputs declared by `Descriptor.Requirements`:",
          )
          enable_marker = "## Enable a module"
          authoring_section = r'''## Export a typed process/App capability

`Descriptor.Requirements` describes what a module consumes. `Descriptor.Provides` describes what a built module exposes to Application constructors. They point in opposite directions and must not be conflated.

Define a stable interface contract and typed key in a package importable by both provider and consumer:

```go
var CacheDefault = modulecatalog.MustCapabilityKey[cachecontract.Cache](
    "cache.default",
    "example.com/contracts/cache",
    "Cache",
)
```

The current declarative `module.yunka.json` schema does not yet contain a `Provides` field. Do not edit generated `zz_yunka_module_gen.go`; wrap the generated descriptor in handwritten Go instead:

```go
func CapabilityDescriptor() modulecatalog.Descriptor {
    descriptor := GeneratedDescriptor()
    descriptor.Provides = []modulecatalog.CapabilityContract{
        CacheDefault.Contract(),
    }
    return descriptor
}

func (module *Module) ExportCapabilities() []modulecatalog.CapabilityExport {
    return []modulecatalog.CapabilityExport{
        CacheDefault.Export(module.cache),
    }
}
```

The wrapper preserves generated input requirements/build wiring while making the output contract explicit and reviewable. Descriptor promises and runtime exports must match exactly.

## Consume a typed capability from an Application

Application protobuf declares infrastructure constructor dependencies separately from cross-Application `requires` and Operation `requires_operations`:

```protobuf
option (yunka.dsl.v1.application) = {
  name: "query"
  capabilities: {
    name: "cache.default"
    go_package: "example.com/contracts/cache"
    go_type: "Cache"
  }
};
```

`yunka generate` carries that fact through Manifest/AssemblyPlan and generates a concrete Go interface field such as `CacheDefault cachecontract.Cache` in the Application dependency struct. The consumer-owned `ApplicationFactories` implementation receives that typed field; Application runtime code never receives `CapabilitySet`.

Generated Assembly composes separately versioned provider descriptors explicitly:

```go
AdditionalModules: []modulecatalog.Descriptor{
    rediscache.CapabilityDescriptor(),
}
```

Resolution is bootstrap-only and fail-closed before transport registration/App start. There is no `app.Get(string)`, reflection DI, or public untyped lookup.

'''
          replace_once("docs/module-authoring.md", enable_marker, authoring_section + enable_marker)
          validate_marker = "## Validate"
          extra_enable = """For generated Assembly, typed exporting plugins must be supplied through `BootstrapOptions.AdditionalModules`; generated Assembly deliberately does not discover the package-global/default catalog. Until declarative module specs can synthesize `Descriptor.Provides`, the generated `autoload` package is suitable for lifecycle-only descriptors but does not replace the explicit capability descriptor path described above.\n\n"""
          replace_once("docs/module-authoring.md", validate_marker, extra_enable + validate_marker)
          old_checklist = "1. Declare every capability in `GeneratedDescriptor`.\n2. Accept only compiler-checked `Dependencies`.\n3. Remove environment/global/service-locator access.\n4. Keep App-owned services free of current-request state.\n5. Add two-App isolation and lifecycle tests.\n6. Preserve existing protobuf and persistence contracts.\n7. Run double tidy, module/architecture/dependency gates, RPC/Contract zero-drift, race, full verify, and relevant MySQL integration."
          new_checklist = "1. Declare module inputs in `Descriptor.Requirements` and exported process/App capabilities in `Descriptor.Provides`.\n2. Export only declared values through `CapabilityExporter`; keep provider construction compiler checked.\n3. Declare each consuming Application capability explicitly in protobuf with matching logical key and Go package/type identity.\n4. Remove environment/global/service-locator access.\n5. Keep App-owned services free of current-request state.\n6. Add missing/duplicate/mismatch and two-App isolation tests.\n7. Preserve existing protobuf, Operation/UoW/authz, and persistence semantics.\n8. Run double tidy, module/architecture/dependency gates, RPC/Contract zero-drift, race, full verify, and relevant MySQL integration."
          replace_once("docs/module-authoring.md", old_checklist, new_checklist)
          PY

          git rm .github/workflows/tmp-typed-infra-reconcile.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/STATUS.md PROJECT_MEMORY.md infras/README.md docs/module-authoring.md
          git commit -m 'docs: reconcile typed infrastructure capability binding'
          git push origin HEAD:docs/typed-infra-postmerge-reconciliation
