name: tmp-typed-infra-reconcile

on:
  push:
    branches: [docs/typed-infra-postmerge-reconciliation]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconcile typed infrastructure capability truth
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp_typed_infra_reconcile.py
          git rm .github/workflows/tmp-typed-infra-reconcile.yml .github/tmp_typed_infra_reconcile.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/STATUS.md PROJECT_MEMORY.md infras/README.md docs/module-authoring.md
          git commit -m 'docs: reconcile typed infrastructure capability binding'
          git push origin HEAD:docs/typed-infra-postmerge-reconciliation
