name: qualify-c9-parity-syntax

on:
  push:
    branches: [codex/control-c9-parity-syntax]
    paths:
      - .github/workflows/qualify-c9-parity-syntax.yml

permissions:
  contents: read

jobs:
  check-generated-conformance-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 087eadf7d628144447d8f1952d934a018d155c79
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = 087eadf7d628144447d8f1952d934a018d155c79
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.13"
          cache: false
      - name: Parse new Go test source
        run: |
          gofmt -e -d pkg/contract/http_transport_conformance_report_test.go
          gofmt -e -d pkg/contract/http_transport_conformance_fixture_test.go
          gofmt -e -d pkg/contract/http_binding_runtime_test.go
          git diff --exit-code
      - name: Install locked protoc
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          archive="$RUNNER_TEMP/protoc.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_LINUX_X86_64_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$archive" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make rpc-tools rpc-toolchain-check
      - name: Run generated HTTP/gRPC semantic parity only
        shell: bash
        run: |
          set -euo pipefail
          cd pkg
          export YUNKA_REQUIRE_C9_RUNTIME=1
          export PROTOC="$(command -v protoc)"
          export PROTOC_GEN_GO="$GITHUB_WORKSPACE/.yunka/bin/protoc-gen-go"
          export PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/.yunka/bin/protoc-gen-go-grpc"
          go test -count=1 -timeout=8m -run TestGeneratedHTTPBindingTransportParity -v ./contract
          cd ..
          python3 tools/verify_http_grpc_conformance.py "$RUNNER_TEMP/yunka-protocol-conformance/matrix.json"
