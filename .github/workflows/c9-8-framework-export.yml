name: c9-8-framework-export

on:
  push:
    branches:
      - agent/c9-8-cross-application-pressure
    paths:
      - .github/workflows/c9-8-framework-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c9-8-cross-application-pressure
          fetch-depth: 0
      - name: Export source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/yunka-c9-8.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/yunka-c9-8.tar.gz" > "$RUNNER_TEMP/yunka-c9-8.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: yunka-c9-8-source
          path: |
            ${{ runner.temp }}/yunka-c9-8.tar.gz
            ${{ runner.temp }}/yunka-c9-8.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
