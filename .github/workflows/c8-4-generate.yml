name: c8-4-generate

on:
  push:
    branches: [agent/c8-4-pb-dsl-domain-convergence]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Generate canonical protobuf outputs
        shell: bash
        run: |
          set -euo pipefail
          make rpc-generate
          test -f pkg/contractdsl/v1/options.pb.go
          git diff --exit-code -- gateway/rpc/meta pkg/rpcmeta/legacy contracts/generated

      - name: Guard and commit exact output
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c8-4-generate.yml
          git add pkg/contractdsl/v1/options.pb.go .github/workflows/c8-4-generate.yml
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/c8-4-generate.yml' 'pkg/contractdsl/v1/options.pb.go' | sort)"
          test "$actual" = "$expected" || { printf 'unexpected staged files:\n%s\n' "$actual" >&2; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "build: generate typed DSL protobuf options"
          git push origin HEAD:agent/c8-4-pb-dsl-domain-convergence
