name: c9-8-real-biz-control

on:
  push:
    branches:
      - agent/c9-8-cross-application-pressure
    paths:
      - .github/workflows/c9-8-real-biz-control.yml
      - tools/c9-8-biz-source-url.txt

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c9-8-cross-application-pressure
          fetch-depth: 0

      - name: Load toolchain lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc and RPC tools
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl -fsSL -o "$archive" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          make PROTOC="$install_root/bin/protoc" rpc-tools

      - name: Fetch exact C9.8 biz source
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(tr -d '\r\n' < tools/c9-8-biz-source-url.txt)"
          test -n "$source_url"
          curl -fsSL -o "$RUNNER_TEMP/biz-source.zip" "$source_url"
          mkdir -p "$RUNNER_TEMP/biz-artifact" ../biz
          unzip -q "$RUNNER_TEMP/biz-source.zip" -d "$RUNNER_TEMP/biz-artifact"
          tar -xzf "$RUNNER_TEMP/biz-artifact/biz-c9-pressure.tar.gz" -C ../biz
          test -f ../biz/go.mod
          grep -q 'service DeviceTransferApplication' ../biz/contracts/proto/deviceops/v1/deviceops.proto
          grep -q 'NewDeviceopsSiteManagementChildCapability' ../biz/modules/deviceops/module.go

      - name: Regenerate C9.8 biz with current Yunka
        shell: bash
        run: |
          set -euo pipefail
          cd ../biz
          YUNKA_ROOT="$GITHUB_WORKSPACE" PROTOC="$RUNNER_TEMP/protoc/bin/protoc" PROTOC_INCLUDE="$RUNNER_TEMP/protoc/include" make generate
          grep -q 'operation.ExecuteChildTyped' internal/deviceops/application/zz_yunka_device_transfer_capability_ports_gen.go
          grep -q 'site.validate_transfer_target' contracts/generated/operation-plans.json
          grep -q 'device.transfer' contracts/generated/operation-plans.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('contracts/generated/operation-plans.json').read_text())
          by={x['operationId']:x for x in data['operations']}
          root=by['device.transfer']
          assert root['application']=='device_transfer', root
          assert root['execution']=={'transaction':'local','idempotency':'required'}, root['execution']
          assert root['composition']['boundary']=='local', root['composition']
          assert root['composition']['requiresOperations']==['device.update','site.validate_transfer_target'], root['composition']
          assert root['composition']['permissionClosure']==['device.update','site.read'], root['composition']
          assert by['site.validate_transfer_target']['application']=='site_management'
          assert by['device.update']['application']=='device_management'
          PY

      - name: Verify C9.8 source boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd ../biz
          ! grep -R -n 'requestscope.Execute' internal/deviceops/application
          ! grep -R -n 'requestscope.GORMFrom' internal/deviceops/application
          ! grep -R -n 'gorm.io/gorm' internal/deviceops/application
          ! grep -R -n 'gateway/authz' internal/deviceops/application
          ! grep -R -n 'infrastructure/persistence' internal/deviceops/application
          grep -q 'DeviceopsSiteManagementChildCapability' internal/deviceops/application/cross_application_transfer.go
          grep -q 'DeviceopsDeviceManagementChildCapability' internal/deviceops/application/cross_application_transfer.go
          YUNKA_ROOT="$GITHUB_WORKSPACE" PROTOC="$RUNNER_TEMP/protoc/bin/protoc" PROTOC_INCLUDE="$RUNNER_TEMP/protoc/include" make verify

      - name: Run real C9.8 MySQL 8.4 pressure
        shell: bash
        env:
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz?parseTime=true&charset=utf8mb4&loc=UTC
        run: |
          set -euo pipefail
          cd ../biz
          YUNKA_ROOT="$GITHUB_WORKSPACE" PROTOC="$RUNNER_TEMP/protoc/bin/protoc" PROTOC_INCLUDE="$RUNNER_TEMP/protoc/include" make pressure

      - name: Export regenerated C9.8 biz
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/biz-c9-8-regenerated.tar.gz" -C ../biz .
          sha256sum "$RUNNER_TEMP/biz-c9-8-regenerated.tar.gz" > "$RUNNER_TEMP/biz-c9-8-regenerated.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: biz-c9-8-regenerated
          path: |
            ${{ runner.temp }}/biz-c9-8-regenerated.tar.gz
            ${{ runner.temp }}/biz-c9-8-regenerated.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
