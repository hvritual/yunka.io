name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache-dependency-path: |
            app/go.sum
            app/cmd/rpc/go.sum
            framework/go.sum
            gateway/go.sum
            pkg/go.sum
      - name: Dependency sync
        id: dependency-sync
        shell: bash
        run: |
          set -euo pipefail
          make tidy
          if git diff --quiet -- \
            go.work go.work.sum \
            pkg/go.mod pkg/go.sum \
            framework/go.mod framework/go.sum \
            gateway/go.mod gateway/go.sum \
            app/go.mod app/go.sum \
            app/cmd/rpc/go.mod app/cmd/rpc/go.sum; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload dependency snapshot
        if: steps.dependency-sync.outputs.dirty == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sync-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            go.work
            go.work.sum
            pkg/go.mod
            pkg/go.sum
            framework/go.mod
            framework/go.sum
            gateway/go.mod
            gateway/go.sum
            app/go.mod
            app/go.sum
            app/cmd/rpc/go.mod
            app/cmd/rpc/go.sum
      - name: Commit dependency sync
        if: >-
          steps.dependency-sync.outputs.dirty == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            go.work go.work.sum \
            pkg/go.mod pkg/go.sum \
            framework/go.mod framework/go.sum \
            gateway/go.mod gateway/go.sum \
            app/go.mod app/go.sum \
            app/cmd/rpc/go.mod app/cmd/rpc/go.sum
          git commit -m "chore: sync workspace dependencies"
          git push origin "HEAD:${HEAD_REF}"
      - name: Reject unsynced dependencies
        if: >-
          steps.dependency-sync.outputs.dirty == 'true' &&
          !(github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        run: exit 1
      - name: Dependency resolution drift report
        shell: bash
        run: make dependency-resolution-report
      - name: Upload dependency resolution report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-resolution-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: .artifacts/dependency-resolution/
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Contract drift
        run: make contract-check
      - name: Contract compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline=/tmp/yunka-contract-baseline.json
          if git cat-file -e "${BASE_SHA}:contracts/generated/manifest.json" 2>/dev/null; then
            git show "${BASE_SHA}:contracts/generated/manifest.json" > "${baseline}"
            (cd app && go run ./cmd contract diff \
              --baseline "${baseline}" \
              --current ../contracts/generated/manifest.json)
          else
            echo "No contract baseline in base commit; compatibility guard starts after W06 lands."
          fi
      - name: Verify
        run: make verify
