name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/toolchain.env
          : "${GO_VERSION:?}"
          : "${PROTOC_RELEASE:?}"
          : "${PROTOC_VERSION:?}"
          : "${PROTOC_LINUX_X86_64_SHA256:?}"
          : "${GOVULNCHECK_VERSION:?}"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_version=${PROTOC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: |
            app/go.sum
            framework/go.sum
            gateway/go.sum
            pkg/go.sum

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Toolchain lock
        run: make toolchain-check

      - name: Dependency drift
        shell: bash
        run: |
          set -euo pipefail
          make tidy
          git diff --exit-code -- \
            go.work go.work.sum \
            pkg/go.mod pkg/go.sum \
            framework/go.mod framework/go.sum \
            gateway/go.mod gateway/go.sum \
            app/go.mod app/go.sum \

      - name: Contract reproducibility
        shell: bash
        run: |
          set -euo pipefail
          make contract
          git diff --exit-code -- contracts/generated
          make contract-check

      - name: Contract compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline=/tmp/yunka-contract-baseline.json
          if git cat-file -e "${BASE_SHA}:contracts/generated/manifest.json" 2>/dev/null; then
            git show "${BASE_SHA}:contracts/generated/manifest.json" > "${baseline}"
            (cd app && go run ./cmd contract diff \
              --baseline "${baseline}" \
              --current ../contracts/generated/manifest.json)
          else
            echo "No contract baseline in base commit; compatibility guard starts after W06 lands."
          fi

      - name: Verify
        run: make verify

      - name: Determinism recheck
        shell: bash
        run: |
          set -euo pipefail
          make toolchain-check
          make tidy
          git diff --exit-code -- \
            go.work go.work.sum \
            pkg/go.mod pkg/go.sum \
            framework/go.mod framework/go.sum \
            gateway/go.mod gateway/go.sum \
            app/go.mod app/go.sum \
          make contract
          git diff --exit-code -- contracts/generated
          make contract-check
          git diff --exit-code
