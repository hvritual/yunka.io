name: pack-biz-export

on:
  push:
    branches:
      - agent/biz-domain-export-v3

permissions:
  contents: write

jobs:
  pack:
    if: ${{ !contains(github.event.head_commit.message, '[packed-export]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pack exact generated domains
        shell: bash
        run: |
          set -euo pipefail
          src=tools/biz-domain-export/internal
          out=tools/biz-export-pack
          rm -rf "$out"
          mkdir -p "$out"
          for domain in iam site device; do
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -C "$src" -czf "$RUNNER_TEMP/${domain}.tar.gz" "$domain"
            base64 -w 76 "$RUNNER_TEMP/${domain}.tar.gz" > "$out/${domain}.tar.gz.b64"
            sha256sum "$RUNNER_TEMP/${domain}.tar.gz" | awk '{print $1}' > "$out/${domain}.tar.gz.sha256"
          done
      - name: Commit packs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/biz-export-pack
          git commit -m "chore: pack exact generated biz domains [packed-export]"
          git push origin HEAD:agent/biz-domain-export-v3
