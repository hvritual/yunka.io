name: probe-baseline-completion
on:
  push:
    branches: [codex/control-baseline-completion]
    paths: [.github/workflows/probe-baseline-completion.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dbe602f3e389cf6efe8e46534585e093bc371d92
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce the exact existing receipt-binding gap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline-completion"
          python3 -B - <<'PY' > "$RUNNER_TEMP/baseline-completion/old-receipt-probe.json"
          import json, sys
          sys.path.insert(0, 'tools')
          import qualify_branch_baseline as b
          head, old_base = 'a'*40, 'b'*40
          run = {'name':'ci','head_sha':head,'status':'completed','conclusion':'success','event':'pull_request','path':'.github/workflows/ci.yml','repository':{'full_name':'hvritual/yunka.io'},'pull_requests':[{'base':{'ref':'compat/example','sha':old_base},'head':{'sha':head}}]}
          jobs = [{'name':'verify','status':'completed','conclusion':'success','steps':[{'name':'Verify','status':'completed','conclusion':'success'}]}]
          accepted = b.qualified_run(run, jobs, head, 'compat/example', 'ci', 'verify', 'Verify')
          assert accepted, 'Old signature/behavior changed; investigate rather than claiming reproduction'
          print(json.dumps({'source':'dbe602f3e389cf6efe8e46534585e093bc371d92','staleBaseAccepted':accepted,'scope':'production receipt-validator, synthetic provider receipt; not a real provider invocation'}))
          PY
          cat "$RUNNER_TEMP/baseline-completion/old-receipt-probe.json"
      - name: Apply only the staged bounded repair and run all regressions
        shell: bash
        run: |
          set -euo pipefail
          git show "$CONTROL_SHA:.control/finish_baseline.py" > "$RUNNER_TEMP/finish-baseline.py"
          python3 -B "$RUNNER_TEMP/finish-baseline.py"
          python3 -B tools/test_qualify_branch_baseline.py -v > "$RUNNER_TEMP/baseline-completion/tests.txt" 2>&1
          cat "$RUNNER_TEMP/baseline-completion/tests.txt"
          git diff --check
          git diff --name-only | tee "$RUNNER_TEMP/baseline-completion/scope.txt"
          python3 - <<'PY'
          import subprocess
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == {'tools/qualify_branch_baseline.py','tools/test_qualify_branch_baseline.py'}
          PY
          git diff > "$RUNNER_TEMP/baseline-completion/repair.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: baseline-completion-probe
          path: ${{ runner.temp }}/baseline-completion
          if-no-files-found: error
          retention-days: 30
