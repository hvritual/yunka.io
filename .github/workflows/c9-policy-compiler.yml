name: c9-policy-compiler

on:
  push:
    branches:
      - agent/c9-usecase-policy-compiler

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[c9-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.13
          cache: false
      - name: Patch and run focused tests
        shell: bash
        run: bash tools/c9_policy_patch.sh
      - name: Commit compiler switch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cmd/domain/generator.go framework/policy app/cmd/domain/multi_policy_templates.go app/cmd/domain/multi_policy_structural.go app/cmd/domain/policy_generation_test.go
          git rm -f tools/c9_policy_patch.sh .github/workflows/c9-policy-compiler.yml
          git commit -m "feat: compile typed use-case policy lifecycle [c9-patched]"
          git push origin HEAD:agent/c9-usecase-policy-compiler
