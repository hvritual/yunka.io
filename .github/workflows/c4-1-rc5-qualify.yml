name: c4-1-rc5-qualify

on:
  push:
    branches:
      - fix/c4-1-module-publication-convergence
    paths:
      - .github/workflows/c4-1-rc5-qualify.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BRANCH: fix/c4-1-module-publication-convergence
      RC_VERSION: v0.1.0-c41rc5
      PREV_VERSION: v0.1.0-c41rc4
      GONOPROXY: github.com/hvritual/yunka.io/*
      GONOSUMDB: github.com/hvritual/yunka.io/*
    steps:
      - name: Checkout C4.1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/c4-1-module-publication-convergence
          fetch-depth: 0

      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Prepare RC5 candidate
        shell: bash
        run: |
          set -euo pipefail
          make toolchain-check
          make rpc-tools
          make rpc-toolchain-check

          if grep -n '^replace ' pkg/go.mod framework/go.mod gateway/go.mod; then
            echo 'publishable module go.mod contains replace directive' >&2
            exit 1
          fi
          grep -q 'github.com/go-kit/kit v0.13.0' pkg/go.mod
          grep -q 'google.golang.org/genproto v0.0.0-20260810153831-ec0a7760b754' pkg/go.mod
          test -f pkg/internal/dependencyanchor/genproto.go

          # Go workspace MVS may still load a versioned edge between workspace main
          # modules. Build an external qualification workspace with version-specific
          # local replacements for those sibling edges. Wildcard replacements are
          # intentionally avoided because the replaced modules are also workspace
          # mains. The temporary workspace and its sum live outside the Git tree.
          repo="$PWD"
          c4_work="$RUNNER_TEMP/c4-1-rc5.work"
          cat > "$c4_work" <<EOF
          go 1.25.0

          toolchain go1.25.13

          use (
            $repo/app
            $repo/framework
            $repo/gateway
            $repo/pkg
          )

          replace github.com/hvritual/yunka.io/pkg ${PREV_VERSION} => $repo/pkg
          replace github.com/hvritual/yunka.io/framework ${PREV_VERSION} => $repo/framework
          EOF
          git show origin/main:go.work.sum > "${c4_work}.sum"
          echo "C4_WORK=$c4_work" >> "$GITHUB_ENV"

          GOWORK="$c4_work" go list -m all >/dev/null
          for module in \
            github.com/hvritual/yunka.io/pkg \
            github.com/hvritual/yunka.io/framework \
            github.com/hvritual/yunka.io/gateway; do
            test "$(GOWORK="$c4_work" go list -m -f '{{.Main}}' "$module")" = "true" || {
              echo "$module is not resolved as a temporary workspace main module" >&2
              exit 1
            }
          done

          # RC4 was pushed and therefore must never be reused. Switch only sibling
          # version declarations to fresh RC5 after the old-version source graph has
          # been proven locally.
          for file in framework/go.mod gateway/go.mod app/go.mod tools/module-release.env docs/waves/C4.1-module-publication-convergence.md; do
            if [[ -f "$file" ]]; then
              sed -i 's/v0\.1\.0-c41rc4/v0.1.0-c41rc5/g' "$file"
            fi
          done
          if grep -R -n 'v0.1.0-c41rc4' framework/go.mod gateway/go.mod app/go.mod tools/module-release.env; then
            echo 'RC4 sibling reference remains in RC5 contract' >&2
            exit 1
          fi

          # Retarget only the temporary qualification workspace to fresh RC5 local
          # edges; the repository go.work remains free of release-time replaces.
          GOWORK="$c4_work" go work edit \
            -dropreplace=github.com/hvritual/yunka.io/pkg@${PREV_VERSION} \
            -dropreplace=github.com/hvritual/yunka.io/framework@${PREV_VERSION} \
            -replace=github.com/hvritual/yunka.io/pkg@${RC_VERSION}=$repo/pkg \
            -replace=github.com/hvritual/yunka.io/framework@${RC_VERSION}=$repo/framework
          GOWORK="$c4_work" go list -m all >/dev/null

          # Validate the corrected expert snapshot through the local source graph.
          (cd app && GOWORK="$c4_work" go test ./cmd -run TestC116CExpertCommandCompatibilitySnapshots -count=1)

          # Preserve the checksum state produced by the isolated source workspace as
          # the tracked development-workspace checksum. Local replacements themselves
          # have no module sums; all copied lines describe external dependencies.
          cp "${c4_work}.sum" go.work.sum

          cat >> docs/waves/C4.1-module-publication-convergence.md <<'EOF'

          ## RC5 qualification hygiene

          RC4 proved the independently published dependency graph, canonical RPC
          generator identity, protobuf descriptor regeneration, contract generation,
          and pkg/framework/gateway workspace tests. It then exposed two app-level
          qualification hygiene defects rather than a publication defect.

          First, main already contains the declarative `module add`, `module require`,
          and `module show` commands from runtime-composition convergence, while the
          C11.6 expert CLI snapshot still described the earlier `check/new` surface.
          RC5 updates that baseline snapshot to the command surface already present on
          main.

          Second, earlier C4.1 candidate preparation deleted tracked `go.work.sum`.
          Subsequent workspace commands recreated it as an untracked file. The C11.4
          test's pre-build clean check intentionally ignored untracked files, while Go
          VCS stamping observed the repository as modified and emitted
          `vcs.modified=true`, making fast-feedback engine evidence unverified.

          RC5 performs pre-publication source qualification through a runner-external
          go.work that uses the same four repository modules plus version-specific
          local replacements for sibling release edges. This handles Go workspace MVS
          loading of versioned inter-module requirements without putting any local
          replace in publishable go.mod files or the repository go.work. The temporary
          workspace sum is copied back as tracked go.work.sum, so ordinary workspace
          commands no longer create an untracked VCS-dirty artifact.

          Fresh sibling RC versions are not resolved remotely before publication.
          Exact GOWORK=off tidy/resolution starts only after RC5 tags point to the
          committed candidate. App remains repository-owned tooling and is qualified
          in source-workspace mode; standalone release qualification is limited to
          pkg/framework/gateway.
          EOF

      - name: Commit exact RC5 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/c4-1-rc5-qualify.yml
          git add -A
          git commit -m 'test: close C4.1 qualification hygiene gaps'
          git push origin "HEAD:${BRANCH}"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prove clean source workspace
        shell: bash
        run: |
          set -euo pipefail
          test -n "${C4_WORK:-}"
          test -z "$(git status --porcelain)" || {
            echo 'RC5 candidate worktree is not clean before source qualification' >&2
            git status --porcelain >&2
            exit 1
          }

          # Re-run both exact RC4 app failures against a clean committed candidate.
          (cd app && GOWORK="$C4_WORK" go test ./cmd -run TestC116CExpertCommandCompatibilitySnapshots -count=1)
          test -z "$(git status --porcelain)" || {
            echo 'expert snapshot qualification dirtied candidate worktree' >&2
            git status --porcelain >&2
            exit 1
          }
          (cd app && GOWORK="$C4_WORK" go test ./cmd/projectflow -run TestC114QualificationRealBinaryFastFeedback -count=1)
          test -z "$(git status --porcelain)" || {
            echo 'fast-feedback qualification dirtied candidate worktree' >&2
            git status --porcelain >&2
            exit 1
          }

      - name: Publish RC5 tags and qualify exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            git push origin \
              :refs/tags/pkg/${RC_VERSION} \
              :refs/tags/framework/${RC_VERSION} \
              :refs/tags/gateway/${RC_VERSION} || true
          }
          trap cleanup ERR

          for prefix in pkg framework gateway; do
            if git ls-remote --exit-code --tags origin "refs/tags/${prefix}/${RC_VERSION}" >/dev/null 2>&1; then
              echo "RC5 tag already exists: ${prefix}/${RC_VERSION}" >&2
              exit 1
            fi
            git tag "${prefix}/${RC_VERSION}" "$CANDIDATE_SHA"
          done
          git push origin \
            "refs/tags/pkg/${RC_VERSION}" \
            "refs/tags/framework/${RC_VERSION}" \
            "refs/tags/gateway/${RC_VERSION}"

          for prefix in pkg framework gateway; do
            resolved="$(git ls-remote --tags origin "refs/tags/${prefix}/${RC_VERSION}" | awk '{print $1}')"
            test "$resolved" = "$CANDIDATE_SHA"
          done

          # Once tags exist, the repository's actual development workspace must also
          # resolve without temporary replacements and without changing tracked state.
          go list -m all >/dev/null
          git diff --exit-code -- go.work.sum

          make rpc-check
          make contract
          make contract-check
          git diff --exit-code -- contracts/generated go.work.sum

          echo '==> source workspace qualification'
          for module in pkg framework gateway; do
            echo "==> workspace ${module}"
            (cd "$module" && go test ./... && go vet ./... && go build ./...)
          done
          test -z "$(git status --porcelain)" || {
            echo 'workspace qualification dirtied candidate before app verification' >&2
            git status --porcelain >&2
            exit 1
          }
          echo '==> workspace app'
          (cd app && go test ./... && go vet ./... && go build ./...)

          echo '==> standalone publishable module qualification'
          for module in pkg framework gateway; do
            echo "==> GOWORK=off ${module}"
            (cd "$module" && \
              GOWORK=off go mod tidy -diff && \
              GOWORK=off go list -m all >/dev/null && \
              GOWORK=off go test ./... && \
              GOWORK=off go vet ./... && \
              GOWORK=off go build ./...)
          done

          echo '==> clean external consumer qualification'
          tmp="$(mktemp -d)"
          cd "$tmp"
          GOWORK=off go mod init yunka-c41-rc5-external-probe >/dev/null
          GOWORK=off go get "github.com/hvritual/yunka.io/pkg@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/framework@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/gateway@${RC_VERSION}"
          GOWORK=off go list -m all >/dev/null
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/pkg)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/framework)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/gateway)" = "$RC_VERSION"
          cd - >/dev/null
          rm -rf "$tmp"

          trap - ERR
          echo "C4.1 RC5 qualified at ${CANDIDATE_SHA}"
