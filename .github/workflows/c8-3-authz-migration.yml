name: C8.3 Gateway Authz Migration

on:
  push:
    branches:
      - agent/c8-3-authz-control

permissions:
  contents: write
  issues: write

jobs:
  wave1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c8-3-authz-control
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Execute C8.3.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat .github/c8.3-wave1.part1 .github/c8.3-wave1.part2 .github/c8.3-wave1.part3 > "$RUNNER_TEMP/c83-wave1.b64"
          test "$(wc -c < "$RUNNER_TEMP/c83-wave1.b64")" = "8728"
          echo '97bd678ec6f24c1dda07c067d939dbfe1df9c9c3  '"$RUNNER_TEMP/c83-wave1.b64" | sha1sum -c -
          base64 --decode "$RUNNER_TEMP/c83-wave1.b64" | gzip -dc > "$RUNNER_TEMP/c83-wave1.sh"
          chmod +x "$RUNNER_TEMP/c83-wave1.sh"
          bash -n "$RUNNER_TEMP/c83-wave1.sh"
          bash "$RUNNER_TEMP/c83-wave1.sh"
