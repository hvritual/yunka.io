name: C8.3 Gateway Authz Migration

on:
  push:
    branches:
      - agent/c8-3-authz-control

permissions:
  contents: write
  issues: write

jobs:
  wave34-final:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c8-3-authz-control
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Execute C8.3.3 and C8.3.4
        env:
          GH_TOKEN: ${{ github.token }}
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?parseTime=true&multiStatements=true
        run: |
          set -euo pipefail
          cat \
            .github/c8.3-wave234.part00 \
            .github/c8.3-wave234.part01 \
            .github/c8.3-wave234.part02 \
            .github/c8.3-wave234.part03 \
            .github/c8.3-wave234.part04 \
            .github/c8.3-wave234.part05 \
            .github/c8.3-wave234.part06 \
            > /tmp/c83-wave234.b64
          test "$(wc -c < /tmp/c83-wave234.b64)" = "25456"
          echo '1be51a4964ae3bdd8fb43774b902b5038c7bb19ac526fcff6eddb259873430b8  /tmp/c83-wave234.b64' | sha256sum -c -
          base64 --decode /tmp/c83-wave234.b64 | gzip -dc > /tmp/c83-wave234.sh

          test "$(wc -c < .github/c8.3-retry-builder.py.gz.b64)" = "3356"
          echo '2888dc2afc83c509f6631ba7dd1ab89131bec29b2d0083bc5391541112b58604  .github/c8.3-retry-builder.py.gz.b64' | sha256sum -c -
          base64 --decode .github/c8.3-retry-builder.py.gz.b64 | gzip -dc > /tmp/c8.3-retry-builder.py
          python3 -m py_compile /tmp/c8.3-retry-builder.py
          python3 /tmp/c8.3-retry-builder.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/c83-wave34-retry.sh')
          text = p.read_text()
          old = "gofmt -w gateway/dispatcher/intercept gateway/dispatcher/intercept/role/db"
          replacement = r'''find gateway/dispatcher/intercept -type f -name '*.go' -print0 | sort -z | xargs -0 -r gofmt -w
          python3 - <<'PYABI'
          from pathlib import Path
          import importlib.util
          import json

          baseline_path = Path('tools/rpc-consumer-abi.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          consumers = baseline.get('consumers', [])
          if baseline.get('schemaVersion') != 1 or len(consumers) != 1:
              raise SystemExit('C8.3.3: unexpected RPC consumer ABI baseline shape')
          consumer = consumers[0]
          if consumer.get('path') != 'gateway/dispatcher/intercept/role/role_intercept.go' or consumer.get('receiver') != 'RoleIntercept':
              raise SystemExit('C8.3.3: unexpected RPC consumer baseline target')
          expected_old = {
              'BatchAddRuntimeApi': '9de88417b82aed40a8183886695e07169cb379da880ab7c2393e5676197571ca',
              'DeleteRuntimeApi': '7ebf99f71eb98843c02a05c20b106f28fb298831a70fb21361d934550f92859e',
              'OperateRoleAPI': '3caed6befd08683dc7f3b0d7eeaa24963f80b2384be0b8083c39170988541262',
          }
          if consumer.get('methods') != expected_old:
              raise SystemExit('C8.3.3: RPC consumer baseline moved before migration')

          spec = importlib.util.spec_from_file_location('rpc_consumer_abi', 'tools/check_rpc_consumer_abi.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          source = Path(consumer['path']).read_text(encoding='utf-8')
          actual = {name: mod.digest_method(source, consumer['receiver'], name) for name in expected_old}
          changed = {name for name in expected_old if actual[name] != expected_old[name]}
          intended = {'BatchAddRuntimeApi', 'OperateRoleAPI'}
          if changed != intended:
              raise SystemExit(f'C8.3.3: unexpected business-method drift: {sorted(changed)}')
          if actual['DeleteRuntimeApi'] != expected_old['DeleteRuntimeApi']:
              raise SystemExit('C8.3.3: DeleteRuntimeApi method body changed unexpectedly')
          consumer['methods'] = {name: actual[name] for name in expected_old}
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          print('C8.3.3: accepted intentional consumer behavior drift', actual)
          PYABI'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one overlapping gofmt command, found {count}')
          text = text.replace(old, replacement)
          p.write_text(text)
          PY
          bash -n /tmp/c83-wave34-retry.sh
          grep -n "find gateway/dispatcher/intercept -type f" /tmp/c83-wave34-retry.sh
          bash /tmp/c83-wave34-retry.sh

          # Product waves have succeeded and main has been verified by the local-Git
          # script. Remove every C8.3 control/retry branch with local git only.
          git fetch origin --prune
          mapfile -t c83_branches < <(
            git ls-remote --heads origin 'refs/heads/agent/c8-3-*' |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              sort -u
          )
          for branch in "${c83_branches[@]}"; do
            [ -n "$branch" ] || continue
            git push origin --delete "$branch"
          done
          remaining="$(git ls-remote --heads origin 'refs/heads/agent/c8-3-*')"
          test -z "$remaining" || { printf 'remaining C8.3 branches:\n%s\n' "$remaining" >&2; exit 1; }
