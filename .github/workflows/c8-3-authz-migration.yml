name: C8.3 Gateway Authz Migration

on:
  push:
    branches:
      - agent/c8-3-authz-control

permissions:
  contents: write
  issues: write

jobs:
  wave1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c8-3-authz-control
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Execute C8.3.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base64 --decode .github/c8.3-wave1.sh.gz.b64 | gzip -dc > "$RUNNER_TEMP/c83-wave1.sh"
          chmod +x "$RUNNER_TEMP/c83-wave1.sh"
          bash -n "$RUNNER_TEMP/c83-wave1.sh"
          bash "$RUNNER_TEMP/c83-wave1.sh"
