name: C8.3 Gateway Authz Migration Final

on:
  push:
    branches:
      - agent/c8-3-authz-final-run

permissions:
  contents: write
  issues: write

concurrency:
  group: c8-3-authz-final-run
  cancel-in-progress: true

jobs:
  wave34-final:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c8-3-authz-final-run
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Execute C8.3.3 and C8.3.4
        env:
          GH_TOKEN: ${{ github.token }}
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?parseTime=true&multiStatements=true
        run: |
          set -euo pipefail
          cat \
            .github/c8.3-wave234.part00 \
            .github/c8.3-wave234.part01 \
            .github/c8.3-wave234.part02 \
            .github/c8.3-wave234.part03 \
            .github/c8.3-wave234.part04 \
            .github/c8.3-wave234.part05 \
            .github/c8.3-wave234.part06 \
            > /tmp/c83-wave234.b64
          test "$(wc -c < /tmp/c83-wave234.b64)" = "25456"
          echo '1be51a4964ae3bdd8fb43774b902b5038c7bb19ac526fcff6eddb259873430b8  /tmp/c83-wave234.b64' | sha256sum -c -
          base64 --decode /tmp/c83-wave234.b64 | gzip -dc > /tmp/c83-wave234.sh

          test "$(wc -c < .github/c8.3-retry-builder.py.gz.b64)" = "3356"
          echo '2888dc2afc83c509f6631ba7dd1ab89131bec29b2d0083bc5391541112b58604  .github/c8.3-retry-builder.py.gz.b64' | sha256sum -c -
          base64 --decode .github/c8.3-retry-builder.py.gz.b64 | gzip -dc > /tmp/c8.3-retry-builder.py
          python3 -m py_compile /tmp/c8.3-retry-builder.py
          python3 /tmp/c8.3-retry-builder.py

          python3 -m py_compile \
            .github/c8.3-patch-retry.py \
            .github/c8.3-patch-role-migration.py \
            .github/c8.3-refresh-consumer-abi.py
          export C83_PATCH_ROLE_MIGRATION="$GITHUB_WORKSPACE/.github/c8.3-patch-role-migration.py"
          export C83_REFRESH_CONSUMER_ABI="$GITHUB_WORKSPACE/.github/c8.3-refresh-consumer-abi.py"
          python3 .github/c8.3-patch-retry.py
          bash -n /tmp/c83-wave34-retry.sh
          grep -n "C83_PATCH_ROLE_MIGRATION\|find gateway/dispatcher/intercept -type f" /tmp/c83-wave34-retry.sh
          bash /tmp/c83-wave34-retry.sh

          # Product waves succeeded and remote main was verified by the local-Git
          # script. Remove every temporary C8.3 branch with local git only.
          git fetch origin --prune
          mapfile -t c83_branches < <(
            git ls-remote --heads origin 'refs/heads/agent/c8-3-*' |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              sort -u
          )
          for branch in "${c83_branches[@]}"; do
            [ -n "$branch" ] || continue
            git push origin --delete "$branch"
          done
          remaining="$(git ls-remote --heads origin 'refs/heads/agent/c8-3-*')"
          test -z "$remaining" || { printf 'remaining C8.3 branches:\n%s\n' "$remaining" >&2; exit 1; }
