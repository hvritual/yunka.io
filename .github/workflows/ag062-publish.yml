name: ag062-publish
on:
  push:
    branches: [control/ag06-2-publish-20260910]
    paths: [.github/workflows/ag062-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c95034ec54eda2db9e0f87d6090efd91af444cd0
          path: product
          fetch-depth: 0
      - name: Publish AG-06.2 status closure branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          main=c95034ec54eda2db9e0f87d6090efd91af444cd0
          branch=docs/ag06-2-closure-20260910
          test "$(git rev-parse HEAD)" = "$main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$main"
          test -z "$(git ls-remote origin refs/heads/$branch | cut -f1)"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/STATUS.md')
          s=p.read_text()
          old='| AG-06.2 | Implementation in progress under issue #180 | Default `init/context/ownership/change plan/add operation/source-policy` integration for the same sealed-v1 layout without a second registry. [Contract](architecture/APPLICATION-DEFAULT-GOVERNANCE.md). Exact qualification/integration belongs to its delivery PR; not yet accepted on main |'
          new='| AG-06.2 | Complete / qualified / merged through [PR #182](https://github.com/hvritual/yunka.io/pull/182); issue #180 completed; parent #178 OPEN | Default `init/context/ownership/change plan/add operation/source-policy` integration for the same sealed-v1 layout without a second registry. [Contract](architecture/APPLICATION-DEFAULT-GOVERNANCE.md). Accepted main `c95034ec54eda2db9e0f87d6090efd91af444cd0`, tree `1fd0d5a0a4740ffbb2608e2b4302b41a65bb1eb6`; final merge candidate passed CI `34433676497`, Production `34433676455`, AG-05 `34433676538`, AG-06 `34433676501`, AG-04 `34433676398`, and separate actual-main push CI `34434033848`, Production `34434033849`, AG-05 `34434033851`, AG-06 `34434033853`, AG-04 `34434033902`. AG-06.3 remains not delivered |'
          assert s.count(old)==1, s.count(old)
          assert s.count('Reconciled date: 2026-09-09')==1
          s=s.replace(old,new).replace('Reconciled date: 2026-09-09','Reconciled date: 2026-09-10')
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = docs/STATUS.md
          grep -F 'AG-06.2 | Complete / qualified / merged through' docs/STATUS.md
          grep -F 'Reconciled date: 2026-09-10' docs/STATUS.md
          git add docs/STATUS.md
          export GIT_AUTHOR_NAME=hvritual GIT_COMMITTER_NAME=hvritual
          export GIT_AUTHOR_EMAIL=460657446@qq.com GIT_COMMITTER_EMAIL=460657446@qq.com
          git -c commit.gpgsign=false commit -m 'docs(status): close AG-06.2 delivery'
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:refs/heads/$branch
          git rev-parse HEAD HEAD^{tree}
