name: ag062-publish
on:
  push:
    branches: [control/ag06-2-publish-20260910]
    paths: [.github/workflows/ag062-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e9a4c9f9afe87e058820c6a17256377cff4f649f
          path: product
          fetch-depth: 0
      - name: Patch only stale Issue160 schema assertion and publish
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e9a4c9f9afe87e058820c6a17256377cff4f649f
          test -z "$(git status --porcelain --untracked-files=all)"
          path=app/cmd/agentcontext/operation_test.go
          before='value.SchemaVersion != 6 || value.ContractContext != nil'
          after='value.SchemaVersion != SchemaVersion || value.ContractContext != nil'
          test "$(grep -Foc "$before" "$path")" = 1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/cmd/agentcontext/operation_test.go')
          s=p.read_text()
          old='value.SchemaVersion != 6 || value.ContractContext != nil'
          new='value.SchemaVersion != SchemaVersion || value.ContractContext != nil'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          test "$(grep -Foc "$after" "$path")" = 1
          git diff --check
          test "$(git diff --name-only)" = "$path"
          git add "$path"
          export GIT_AUTHOR_NAME=hvritual GIT_COMMITTER_NAME=hvritual
          export GIT_AUTHOR_EMAIL=460657446@qq.com GIT_COMMITTER_EMAIL=460657446@qq.com
          git -c commit.gpgsign=false commit -m 'test(context): keep bootstrap regression schema-agnostic'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = d6840be86c72ea91b51e7f32f8ed61067bcab643
          test "$(git ls-remote origin refs/heads/feat/ag06-2-default-governance | cut -f1)" = e9a4c9f9afe87e058820c6a17256377cff4f649f
          git push origin HEAD:refs/heads/feat/ag06-2-default-governance
          git rev-parse HEAD HEAD^{tree}
