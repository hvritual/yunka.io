name: ag062-publish
on:
  push:
    branches: [control/ag06-2-publish-20260910]
    paths: [.github/workflows/ag062-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 456589d0a7c2265a283cf8ebb4fabc31e17cebc6
          path: product
          fetch-depth: 0
      - name: Merge latest qualified main without rewriting task history
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          task=456589d0a7c2265a283cf8ebb4fabc31e17cebc6
          main=dfc0c9d995d8d263f895ede6e43b5446ff8fedb4
          test "$(git rev-parse HEAD)" = "$task"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git ls-remote origin refs/heads/feat/ag06-2-default-governance | cut -f1)" = "$task"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$main"
          git cat-file -e "$main^{commit}"
          export GIT_AUTHOR_NAME=hvritual GIT_COMMITTER_NAME=hvritual
          export GIT_AUTHOR_EMAIL=460657446@qq.com GIT_COMMITTER_EMAIL=460657446@qq.com
          git -c commit.gpgsign=false merge --no-ff --no-edit "$main"
          test "$(git rev-parse HEAD^1)" = "$task"
          test "$(git rev-parse HEAD^2)" = "$main"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check "$main..HEAD"
          python3 - <<'PY'
          import subprocess
          main='dfc0c9d995d8d263f895ede6e43b5446ff8fedb4'
          task='456589d0a7c2265a283cf8ebb4fabc31e17cebc6'
          main_side=set(subprocess.check_output(['git','diff','--name-only',f'{main}..HEAD'],text=True).splitlines())
          task_side=set(subprocess.check_output(['git','diff','--name-only',f'{task}..HEAD'],text=True).splitlines())
          expected_main_changes={'Makefile','pkg/contract/c9_application_codegen.go','pkg/contract/c9_application_codegen_test.go','pkg/contract/c9_cross_domain_cycle_runtime_test.go'}
          assert task_side==expected_main_changes,(task_side,expected_main_changes)
          assert not (main_side & expected_main_changes), main_side & expected_main_changes
          assert '.github/workflows/ag06-template-qualification.yml' in main_side
          assert 'app/cmd/change/main.go' in main_side
          assert 'docs/architecture/APPLICATION-DEFAULT-GOVERNANCE.md' in main_side
          assert len(main_side)==26,len(main_side)
          PY
          git push origin HEAD:refs/heads/feat/ag06-2-default-governance
          git rev-parse HEAD HEAD^{tree}
