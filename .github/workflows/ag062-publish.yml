name: ag062-publish
on:
  push:
    branches: [control/ag06-2-publish-20260910]
    paths: [.github/workflows/ag062-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2c2d4e2f20e9f82dd25a052aa85140382eecb0e1
          path: product
          fetch-depth: 0
      - name: Publish final AG-06.2 status prose convergence
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          main=2c2d4e2f20e9f82dd25a052aa85140382eecb0e1
          branch=docs/ag06-2-status-final-20260910
          test "$(git rev-parse HEAD)" = "$main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$main"
          test -z "$(git ls-remote origin refs/heads/$branch | cut -f1)"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/STATUS.md')
          s=p.read_text()
          old='AG-06.2 is the active increment: it propagates the same derived sealed-v1 layout into initialized source policy, context/ownership, change planning and ordinary Operation additions without migrating existing consumers. AG-06.3 typed-dependency evolution and later migration/debt work remain undelivered.'
          new='AG-06.2 is accepted on behavioral main at `c95034ec54eda2db9e0f87d6090efd91af444cd0`, with docs-only status reconciliation through PR #185 on the subsequent main line. AG-06.3 typed-dependency evolution is the next undelivered increment; later migration/debt work remains undelivered.'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = docs/STATUS.md
          grep -F 'AG-06.2 is accepted on behavioral main' docs/STATUS.md
          test "$(grep -Foc 'AG-06.2 is the active increment' docs/STATUS.md)" = 0
          git add docs/STATUS.md
          export GIT_AUTHOR_NAME=hvritual GIT_COMMITTER_NAME=hvritual
          export GIT_AUTHOR_EMAIL=460657446@qq.com GIT_COMMITTER_EMAIL=460657446@qq.com
          git -c commit.gpgsign=false commit -m 'docs(status): converge AG-06.2 final prose'
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:refs/heads/$branch
          git rev-parse HEAD HEAD^{tree}
