name: CE13 conflict mapping PR
on:
  push:
    branches: [fix/ce13-http-conflict-status]
permissions:
  contents: read
  pull-requests: write
jobs:
  create-pr:
    if: github.repository == 'hvritual/yunka.io' && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Open the reviewed canonical fix for normal qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base='https://api.github.com/repos/hvritual/yunka.io/pulls'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def call(url,payload=None):
              request=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),headers=headers)
              with urllib.request.urlopen(request) as response:return json.load(response)
          existing=call(base+'?state=open&head=hvritual:fix/ce13-http-conflict-status&base=main')
          if existing:
              print(existing[0]['html_url'])
          else:
              created=call(base,{'head':'fix/ce13-http-conflict-status','base':'main','title':'fix(contract): preserve explicit application conflicts as HTTP 409','body':'Real Biz CE-13 browser acceptance reproduced stale plan revisions returning generic HTTP 400, preventing the console conflict/reload path. Generated C9 REST adapters now map explicit gRPC Aborted/AlreadyExists errors to a generic HTTP 409 response. Existing auth/idempotency mappings and unknown-error redaction remain intact.\n\nThe canonical implementation retains canonical module paths; compatibility candidate 9ee6640 contains the equivalent patch for the Biz consumer baseline. Focused contract tests, RPC/contract checks pass locally. Full local verify reached the unrelated mDNS network test, which failed on this host; normal Linux ci/production gates run on this branch before merge. No generated files are hand-edited.'})
              print(created['html_url'])
          PY
