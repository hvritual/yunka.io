name: w10.5 apply overlay

on:
  push:
    branches: [agent/w10-5-convergence]
  pull_request:
    branches: [agent/mvp-stabilization]

permissions:
  contents: write

concurrency:
  group: w10-5-apply-overlay
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'agent/w10-5-convergence' }}
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?parseTime=true&charset=utf8mb4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache-dependency-path: |
            app/go.sum
            app/cmd/rpc/go.sum
            framework/go.sum
            gateway/go.sum
            pkg/go.sum
      - name: Reconstruct and verify overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w10-5
          python3 - <<'PY'
          import base64, hashlib, pathlib, re
          names = [
              'part00.b64','part01.b64','part02.b64','part03.b64','part04.b64','part05.b64',
              'p06_0.b64','p06_1.b64','r06_2.b64',
              'p07_0.b64','p07_1.b64','p07_2.b64',
              'p08_0.b64','p08_1.b64','p08_2.b64',
              'part09.b64','part10.b64','p11_0.b64','r11_1x0.b64','r11_1x1.b64','r11_1x2.b64',
          ]
          root = pathlib.Path('.github/w10_5_overlay')
          chunks = []
          allowed = re.compile(r'^[A-Za-z0-9+/=]*$')
          for name in names:
              raw = (root / name).read_text(encoding='utf-8')
              clean = raw.replace('\r', '').replace('\n', '')
              if not allowed.fullmatch(clean):
                  bad = [(i, repr(ch)) for i, ch in enumerate(clean) if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='][:10]
                  raise SystemExit(f'{name}: invalid base64 characters: {bad}')
              print(f'{name}: raw={len(raw)} clean={len(clean)}')
              chunks.append(clean)
          encoded = ''.join(chunks)
          if len(encoded) != 103604:
              raise SystemExit(f'overlay base64 length={len(encoded)}, want 103604')
          decoded = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(decoded).hexdigest()
          want = '8db9884a2dca9e5cdd5ddde9b24cf5857e2c0e502041deb1fc296080ff08a4be'
          if digest != want:
              raise SystemExit(f'overlay sha256={digest}, want {want}')
          pathlib.Path('/tmp/w10-5/overlay.tar.gz').write_bytes(decoded)
          print(f'overlay bytes={len(decoded)} sha256={digest}')
          PY
          tar -xzf /tmp/w10-5/overlay.tar.gz -C /tmp/w10-5
      - name: Apply overlay to exact MVP base
        shell: bash
        run: |
          set -euo pipefail
          expected=2dead88ff55ac6c879f21f00bcd1a23cafec4b7f
          git fetch origin agent/mvp-stabilization
          actual="$(git rev-parse origin/agent/mvp-stabilization)"
          if [ "$actual" != "$expected" ]; then
            echo "MVP moved: expected $expected, got $actual"
            exit 1
          fi
          git checkout --detach "$expected"
          cp -a /tmp/w10-5/yunka-w10.5-convergence/repo/. .
          while IFS= read -r path; do
            [ -z "$path" ] || rm -f -- "$path"
          done < /tmp/w10-5/yunka-w10.5-convergence/DELETE_FILES.txt
          git diff --check
          changed="$(git diff --name-only | wc -l | tr -d ' ')"
          test "$changed" = "58"
      - name: Dependency sync gate
        shell: bash
        run: |
          set -euo pipefail
          make tidy
          git diff --quiet -- \
            go.work go.work.sum \
            pkg/go.mod pkg/go.sum \
            framework/go.mod framework/go.sum \
            gateway/go.mod gateway/go.sum \
            app/go.mod app/go.sum \
            app/cmd/rpc/go.mod app/cmd/rpc/go.sum
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Contract convergence gate
        run: make contract-check contract-audit
      - name: Verify core
        run: make verify-core
      - name: MySQL outbox integration
        run: make integration
      - name: Create clean local Git commit and publish control branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: converge mvp production gate"
          final_sha="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/${HEAD_REF}:${SOURCE_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
          echo "Published W10.5 commit: ${final_sha}"
