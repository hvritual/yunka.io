name: w10.5 apply overlay

on:
  push:
    branches: [agent/w10-5-convergence]
  pull_request:
    branches: [agent/mvp-stabilization]

permissions:
  contents: write

concurrency:
  group: w10-5-apply-overlay
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'agent/w10-5-convergence' }}
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?parseTime=true&charset=utf8mb4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache-dependency-path: |
            app/go.sum
            app/cmd/rpc/go.sum
            framework/go.sum
            gateway/go.sum
            pkg/go.sum
      - name: Reconstruct and verify overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w10-5
          python3 - <<'PY'
          import base64, hashlib, pathlib, re
          names=['part00.b64','part01.b64','part02.b64','part03.b64','part04.b64','part05.b64','p06_0.b64','p06_1.b64','r06_2.b64','p07_0.b64','p07_1.b64','p07_2.b64','p08_0.b64','p08_1.b64','p08_2.b64','part09.b64','part10.b64','p11_0.b64','r11_1x0.b64','r11_1x1.b64','r11_1x2.b64']
          expected={'part00.b64':'609fb8dc21f9b108763ba354e871dad9bb29d3ba','part01.b64':'d23c8df055fbc966a2386c0f0facc587109b83ea','part02.b64':'387846452411bbc634db0241fe4d50b5a1cb062c','part03.b64':'cfb338c6525d918bc70015e6ab828e6f34318762','part04.b64':'411bf528b5425db1c4d013855ac698d8f20e79f4','part05.b64':'b8f543b97b4db9bfe7ca2bf21fd58eae85ad3c2d','p06_0.b64':'d41467343885d0fc62867024b68e738f11e8d223','p06_1.b64':'01215605bc8b3f671a9e2b9a0d4c2a60502298f9','r06_2.b64':'c904cbf76a2b720078571b902c4e474a8fd788f6','p07_0.b64':'0e4fe0ad1d283a2e45380a74bc7f7755d74c565f','p07_1.b64':'407e05e4f76a43b955bb7245b00d8076b195e178','p07_2.b64':'c6cee47cfc81e40bcd3cd1df841e62d7350cf77d','p08_0.b64':'97b17d80af808af80df05b08d1b2f7bacf820144','p08_1.b64':'8f5a212d6a7cd8806ed12bb1bd4c830d35c9537f','p08_2.b64':'8b1c246c65b9efb5791066e832bb748e44f2a460','part09.b64':'507acaa78e76c9f8890b130ab246d1dcd37c58f0','part10.b64':'00429a677f09e46875a7cda43dcee8b9ac5508bd','p11_0.b64':'d3cf04353b08401696e30976bfcfc8ba5ce4a327','r11_1x0.b64':'a6135b8228821e7b8179415e95e413525c157f33','r11_1x1.b64':'c3ecb62b616bb2819bcef513c9bbfb46d837b440','r11_1x2.b64':'707b7f3dd6af02a8c56c197ad799c502c99ddc79'}
          def blob(s):
              d=s.encode(); return hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          root=pathlib.Path('.github/w10_5_overlay'); chunks=[]; allowed=re.compile(r'^[A-Za-z0-9+/=]*$')
          for name in names:
              clean=(root/name).read_text().replace('\r','').replace('\n',''); want=expected[name]
              if not allowed.fullmatch(clean): raise SystemExit(f'{name}: invalid base64 chars')
              if blob(clean)!=want:
                  if name!='part04.b64' or len(clean)!=9001: raise SystemExit(f'{name}: blob mismatch')
                  matches=[clean[:i]+clean[i+1:] for i in range(len(clean)) if blob(clean[:i]+clean[i+1:])==want]
                  if len(matches)!=1: raise SystemExit(f'{name}: repair matches={len(matches)}')
                  clean=matches[0]
              chunks.append(clean)
          encoded=''.join(chunks); decoded=base64.b64decode(encoded,validate=True)
          digest=hashlib.sha256(decoded).hexdigest(); want='8db9884a2dca9e5cdd5ddde9b24cf5857e2c0e502041deb1fc296080ff08a4be'
          if len(encoded)!=103604 or digest!=want: raise SystemExit(f'overlay validation failed len={len(encoded)} sha={digest}')
          pathlib.Path('/tmp/w10-5/overlay.tar.gz').write_bytes(decoded)
          PY
          tar -xzf /tmp/w10-5/overlay.tar.gz -C /tmp/w10-5
      - name: Apply overlay to exact MVP base
        shell: bash
        run: |
          set -euo pipefail
          expected=2dead88ff55ac6c879f21f00bcd1a23cafec4b7f
          git fetch origin agent/mvp-stabilization
          test "$(git rev-parse origin/agent/mvp-stabilization)" = "$expected"
          git checkout --detach "$expected"
          cp -a /tmp/w10-5/yunka-w10.5-convergence/repo/. .
          while IFS= read -r path; do [ -z "$path" ] || rm -f -- "$path"; done < /tmp/w10-5/yunka-w10.5-convergence/DELETE_FILES.txt
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/w10-5/changed-paths.txt
          test "$(wc -l < /tmp/w10-5/changed-paths.txt | tr -d ' ')" = "58"
      - name: Dependency sync normalization
        shell: bash
        run: |
          set -euo pipefail
          dependency_paths=(go.work go.work.sum pkg/go.mod pkg/go.sum framework/go.mod framework/go.sum gateway/go.mod gateway/go.sum app/go.mod app/go.sum app/cmd/rpc/go.mod app/cmd/rpc/go.sum)
          make tidy
          mapfile -t dirty < <(git diff --name-only -- "${dependency_paths[@]}")
          if [ "${#dirty[@]}" -gt 0 ]; then
            printf 'dependency normalization paths:\n'; printf '  %s\n' "${dirty[@]}"
            if [ "${#dirty[@]}" -ne 1 ] || [ "${dirty[0]}" != "gateway/go.sum" ]; then
              echo 'unexpected dependency drift'
              git diff -- "${dependency_paths[@]}"
              exit 1
            fi
            additions="$(git diff --numstat -- gateway/go.sum | awk '{print $1":"$2}')"
            test "$additions" = "4:0"
            git diff -- gateway/go.sum
          fi
          cp gateway/go.sum /tmp/w10-5/gateway.go.sum.normalized
          make tidy
          cmp gateway/go.sum /tmp/w10-5/gateway.go.sum.normalized
          mapfile -t after < <(git diff --name-only -- "${dependency_paths[@]}")
          if [ "${#after[@]}" -gt 0 ] && { [ "${#after[@]}" -ne 1 ] || [ "${after[0]}" != "gateway/go.sum" ]; }; then
            echo 'second tidy produced unexpected dependency drift'
            printf '  %s\n' "${after[@]}"
            exit 1
          fi
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Contract convergence gate
        run: make contract-check contract-audit
      - name: Verify core
        run: make verify-core
      - name: MySQL outbox integration
        run: make integration
      - name: Create clean local Git commit and publish control branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: converge mvp production gate"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${SOURCE_SHA}" origin "HEAD:refs/heads/${HEAD_REF}"
