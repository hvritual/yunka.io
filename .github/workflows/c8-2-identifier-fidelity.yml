name: c8-2-identifier-fidelity

on:
  push:
    branches:
      - agent/c8-2-go-identifier-fidelity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[c8-2-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Preserve scanned Go identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              if count >= 0 and actual != count:
                  raise SystemExit(f"patch anchor count in {path}: got {actual}, want {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          model = "app/cmd/domain/model.go"
          replace(model,
              'type Field struct {\n\tName        string `json:"name"`\n',
              'type Field struct {\n\tName        string `json:"name"`\n\tGoName      string `json:"-"`\n', 1)
          replace(model,
              'type ObjectSpec struct {\n\tName                 string   `json:"name"`\n',
              'type ObjectSpec struct {\n\tName                 string   `json:"name"`\n\tGoName               string   `json:"-"`\n', 1)
          replace(model,
              '\t\tName:      object,\n\t\tFile:      snakeCase(object) + ".go",',
              '\t\tName:      object,\n\t\tGoName:    exportedIdentifier(object),\n\t\tFile:      snakeCase(object) + ".go",', 1)
          replace(model,
              'fields = append(fields, Field{Name: name, Type: kind, Column: name, POOwned: true})',
              'fields = append(fields, Field{Name: name, GoName: exportedIdentifier(name), Type: kind, Column: name, POOwned: true})', 1)
          replace(model,
              '\t\t\tName:          spec.Object,\n\t\t\tFile:          snakeCase(spec.Object) + ".go",',
              '\t\t\tName:          spec.Object,\n\t\t\tGoName:        exportedIdentifier(spec.Object),\n\t\t\tFile:          snakeCase(spec.Object) + ".go",', 1)
          replace(model,
              '\tfor i := range result {\n\t\tif previous, ok := priorByName[result[i].Name]; ok && previous.ProtoNumber > 0 {',
              '\tfor i := range result {\n\t\tif result[i].GoName == "" {\n\t\t\tresult[i].GoName = exportedIdentifier(result[i].Name)\n\t\t}\n\t\tif previous, ok := priorByName[result[i].Name]; ok && previous.ProtoNumber > 0 {', 1)

          scan = "app/cmd/domain/po_scan.go"
          replace(scan,
              '\treturn ObjectSpec{\n\t\tName:                 objectName,\n',
              '\treturn ObjectSpec{\n\t\tName:                 objectName,\n\t\tGoName:               foundName,\n', 1)
          replace(scan,
              'field := Field{Name: fieldName, Type: kind, Column: column, POOwned: true}',
              'field := Field{Name: fieldName, GoName: name.Name, Type: kind, Column: column, POOwned: true}', 1)
          replace(scan,
              '\t\tfor j := range left[i].Fields {\n\t\t\tif left[i].Fields[j] != right[i].Fields[j] {\n\t\t\t\treturn false\n\t\t\t}\n\t\t}',
              '\t\tfor j := range left[i].Fields {\n\t\t\tl, r := left[i].Fields[j], right[i].Fields[j]\n\t\t\tif l.Name != r.Name || l.Type != r.Type || l.Column != r.Column || l.ProtoNumber != r.ProtoNumber || l.POOwned != r.POOwned {\n\t\t\t\treturn false\n\t\t\t}\n\t\t}', 1)

          templates = Path("app/cmd/domain/multi_templates.go")
          text = templates.read_text()
          text = text.replace('exportedIdentifier(object.Name)', 'objectGoName(object)')
          text = text.replace('fmt.Fprintf(&b, "\\t%s %s `json:\\\"%s\\\"`\\n", exportedIdentifier(field.Name), typeName, jsonName(field.Name))',
                              'fmt.Fprintf(&b, "\\t%s %s `json:\\\"%s\\\"`\\n", fieldGoName(field), typeName, jsonName(field.Name))')
          text = text.replace('fmt.Fprintf(b, "\\t%s %s `json:\\\"%s\\\"`\\n", exportedIdentifier(field.Name), typeName, jsonName(field.Name))',
                              'fmt.Fprintf(b, "\\t%s %s `json:\\\"%s\\\"`\\n", fieldGoName(field), typeName, jsonName(field.Name))')
          text = text.replace('f := exportedIdentifier(field.Name)', 'f := fieldGoName(field)')
          text = text.replace('fmt.Fprintf(&b, "\\t%s %s `gorm:\\\"column:%s;%s\\\"`\\n", exportedIdentifier(field.Name), typeName, field.Column, columnType(field))',
                              'fmt.Fprintf(&b, "\\t%s %s `gorm:\\\"column:%s;%s\\\"`\\n", fieldGoName(field), typeName, field.Column, columnType(field))')
          text = text.replace('fmt.Fprintf(b, "%q:value.%s,", field.Column, exportedIdentifier(field.Name))',
                              'fmt.Fprintf(b, "%q:value.%s,", field.Column, fieldGoName(field))')
          text = text.replace('fmt.Fprintf(b, "%s:%s,", exportedIdentifier(field.Name), multiProtoRequestExpr("request", field))',
                              'fmt.Fprintf(b, "%s:%s,", fieldGoName(field), multiProtoRequestExpr("request", field))')
          old = '''\tfor _, field := range object.Fields {\n\t\tf := fieldGoName(field)\n\t\tif field.Type == "time" {\n\t\t\tfmt.Fprintf(b, "%s:timestamppb.New(value.%s),", f, f)\n\t\t} else {\n\t\t\tfmt.Fprintf(b, "%s:value.%s,", f, f)\n\t\t}\n\t}'''
          new = '''\tfor _, field := range object.Fields {\n\t\tgoField := fieldGoName(field)\n\t\tprotoField := exportedIdentifier(field.Name)\n\t\tif field.Type == "time" {\n\t\t\tfmt.Fprintf(b, "%s:timestamppb.New(value.%s),", protoField, goField)\n\t\t} else {\n\t\t\tfmt.Fprintf(b, "%s:value.%s,", protoField, goField)\n\t\t}\n\t}'''
          if old not in text:
              raise SystemExit("missing gRPC output mapping anchor")
          text = text.replace(old, new, 1)
          templates.write_text(text)

          Path("app/cmd/domain/go_identifiers.go").write_text('''package domain\n\nfunc objectGoName(object ObjectSpec) string {\n\tif object.GoName != "" {\n\t\treturn object.GoName\n\t}\n\treturn exportedIdentifier(object.Name)\n}\n\nfunc fieldGoName(field Field) string {\n\tif field.GoName != "" {\n\t\treturn field.GoName\n\t}\n\treturn exportedIdentifier(field.Name)\n}\n''')

          compile_test = "app/cmd/domain/compile_test.go"
          replace(compile_test,
              '\tSerial string `+"`gorm:\\\"column:serial;type:varchar(64)\\\"`"+`\n\tEnabled bool',
              '\tSerial string `+"`gorm:\\\"column:serial;type:varchar(64)\\\"`"+`\n\tSiteID string `+"`gorm:\\\"column:site_id;type:varchar(64)\\\"`"+`\n\tEnabled bool', 1)
          replace(compile_test,
              '\twriteTestPO(t, persistence, "device_group.go", `package persistence\n\ntype DeviceGroupPO struct { Name string }\n`)\n',
              '\twriteTestPO(t, persistence, "device_group.go", `package persistence\n\ntype DeviceGroupPO struct { Name string }\n`)\n\twriteTestPO(t, persistence, "api_token.go", `package persistence\n\ntype APITokenPO struct { TokenHash string }\n`)\n', 1)
          PY
          gofmt -w app/cmd/domain/model.go app/cmd/domain/po_scan.go app/cmd/domain/multi_templates.go app/cmd/domain/go_identifiers.go app/cmd/domain/compile_test.go
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cmd/domain
          git commit -m "fix: preserve scanned Go identifiers [c8-2-patched]"
          git push origin HEAD:agent/c8-2-go-identifier-fidelity
