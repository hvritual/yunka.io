name: issue160-source-snapshot
on:
  push:
    branches: [control/160-inventory-delivery]
    paths: [.github/workflows/issue160-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 44b086e2b59aac4d7b7c2adc41362636ed5ba6c4
          fetch-depth: 0
          persist-credentials: false
      - name: Export Git objects only, no credentials or runtime files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 44b086e2b59aac4d7b7c2adc41362636ed5ba6c4
          mkdir -p "$RUNNER_TEMP/issue160-source"
          git branch issue160-source HEAD
          git bundle create "$RUNNER_TEMP/issue160-source/yunka-160.bundle" issue160-source
          git bundle verify "$RUNNER_TEMP/issue160-source/yunka-160.bundle"
          sha256sum "$RUNNER_TEMP/issue160-source/yunka-160.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue160-pinned-source
          path: ${{ runner.temp }}/issue160-source/
          retention-days: 7
          if-no-files-found: error
