name: operation-growth-excelx-reader-migration-qualification

on:
  push:
    branches:
      - control/operation-growth-boundary-gate-20260917
    paths:
      - .github/workflows/operation-growth-excelx-reader-migration-qualification.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: control/operation-growth-boundary-gate-20260917
          path: controller
          fetch-depth: 0

      - name: Checkout exact product candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/161-operation-growth-boundary-gate
          path: product
          fetch-depth: 0

      - name: Verify exact candidate and unchanged main
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "559ed1092b303bcb367e7da562b3696da2f7cfec"
          test "$(git rev-parse HEAD^{tree})" = "b47ec9d577c55c09a2c69244ae53e793591ee5b2"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"

      - name: Load locked Go version
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source product/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "govulncheck_version=${GOVULNCHECK_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: product/pkg/go.sum

      - name: Capture current ExcelFrom* behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product/pkg/qualificationtmp
          cat > product/pkg/qualificationtmp/generator.go <<'EOF'
          package main

          import (
              "os"

              "github.com/xuri/excelize/v2"
          )

          func main() {
              if len(os.Args) != 2 {
                  panic("fixture path required")
              }
              f := excelize.NewFile()
              if err := f.SetSheetName("Sheet1", "First"); err != nil {
                  panic(err)
              }
              if err := f.SetCellValue("First", "A1", "first"); err != nil {
                  panic(err)
              }
              if err := f.SetCellValue("First", "C1", "third"); err != nil {
                  panic(err)
              }
              if err := f.SetCellValue("First", "A3", 1234.5); err != nil {
                  panic(err)
              }
              style, err := f.NewStyle(&excelize.Style{NumFmt: 2})
              if err != nil {
                  panic(err)
              }
              if err := f.SetCellStyle("First", "A3", "A3", style); err != nil {
                  panic(err)
              }
              selected, err := f.NewSheet("Selected")
              if err != nil {
                  panic(err)
              }
              if err := f.SetCellValue("Selected", "A1", "selected"); err != nil {
                  panic(err)
              }
              f.SetActiveSheet(selected)
              if err := f.SaveAs(os.Args[1]); err != nil {
                  panic(err)
              }
              if err := f.Close(); err != nil {
                  panic(err)
              }
          }
          EOF
          cat > product/pkg/qualificationtmp/probe.go <<'EOF'
          package main

          import (
              "bytes"
              "encoding/json"
              "os"

              "github.com/hvritual/yunka.io/pkg/excelx"
          )

          type observedRow struct {
              Index int      `json:"index"`
              Row   []string `json:"row"`
          }

          type output struct {
              DefaultFile []observedRow `json:"defaultFile"`
              FirstFile   []observedRow `json:"firstFile"`
              FirstReader []observedRow `json:"firstReader"`
          }

          func collectFile(path, sheet string) []observedRow {
              result := []observedRow{}
              if err := excelx.ExcelFromFile(path, sheet, func(index int, row []string) error {
                  result = append(result, observedRow{Index: index, Row: append([]string(nil), row...)})
                  return nil
              }); err != nil {
                  panic(err)
              }
              return result
          }

          func collectReader(path, sheet string) []observedRow {
              contents, err := os.ReadFile(path)
              if err != nil {
                  panic(err)
              }
              result := []observedRow{}
              if err := excelx.ExcelFromIOReader(bytes.NewReader(contents), sheet, func(index int, row []string) error {
                  result = append(result, observedRow{Index: index, Row: append([]string(nil), row...)})
                  return nil
              }); err != nil {
                  panic(err)
              }
              return result
          }

          func main() {
              if len(os.Args) != 2 {
                  panic("fixture path required")
              }
              value := output{
                  DefaultFile: collectFile(os.Args[1], ""),
                  FirstFile: collectFile(os.Args[1], "First"),
                  FirstReader: collectReader(os.Args[1], "First"),
              }
              encoder := json.NewEncoder(os.Stdout)
              encoder.SetEscapeHTML(false)
              if err := encoder.Encode(value); err != nil {
                  panic(err)
              }
          }
          EOF
          cd product/pkg
          GOWORK=off go run ./qualificationtmp/generator.go "$RUNNER_TEMP/excelx-compat.xlsx"
          rm qualificationtmp/generator.go
          GOWORK=off go run ./qualificationtmp/probe.go "$RUNNER_TEMP/excelx-compat.xlsx" > "$RUNNER_TEMP/excelx-before.json"
          cat "$RUNNER_TEMP/excelx-before.json"

      - name: Apply safe reader migration
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../controller/tools/excelx_reader_security_migration.py
          cd pkg
          GOWORK=off go get codeberg.org/tealeg/xlsx/v4@v4.1.1
          GOWORK=off go mod tidy
          cd ..
          gofmt -w pkg/excelx/reader.go pkg/excelx/reader_test.go
          git diff --check

      - name: Qualify behavioral compatibility and security
        shell: bash
        env:
          GOVULNCHECK_VERSION: ${{ steps.toolchain.outputs.govulncheck_version }}
        run: |
          set -euo pipefail
          cd product/pkg
          GOWORK=off go run ./qualificationtmp/probe.go "$RUNNER_TEMP/excelx-compat.xlsx" > "$RUNNER_TEMP/excelx-after.json"
          diff -u "$RUNNER_TEMP/excelx-before.json" "$RUNNER_TEMP/excelx-after.json"
          rm -rf qualificationtmp
          GOWORK=off go test -count=1 ./excelx
          GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" ./...
          cd ..
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(pkg/excelx/reader\.go|pkg/excelx/reader_test\.go|pkg/go\.mod|pkg/go\.sum)$' || true)"
          test -z "$unexpected" || { echo "unexpected migration mutation:" >&2; echo "$unexpected" >&2; exit 1; }
          git diff --check

      - name: Commit qualified reader migration
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "Yunka Delivery"
          git config user.email "quality-delivery@example.invalid"
          git add pkg/excelx/reader.go pkg/excelx/reader_test.go pkg/go.mod pkg/go.sum
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(excelx): replace vulnerable workbook reader"
          test "$(git rev-parse HEAD^)" = "559ed1092b303bcb367e7da562b3696da2f7cfec"
          test -z "$(git status --porcelain)"
          echo "candidate=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"

      - name: Publish qualified reader migration
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git fetch origin main fix/161-operation-growth-boundary-gate
          test "$(git rev-parse origin/fix/161-operation-growth-boundary-gate)" = "559ed1092b303bcb367e7da562b3696da2f7cfec"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test -z "$(git status --porcelain)"
          git push origin HEAD:fix/161-operation-growth-boundary-gate
          echo "published=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
