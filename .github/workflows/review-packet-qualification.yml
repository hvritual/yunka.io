name: review-packet-qualification

on:
  pull_request:
    paths:
      - 'app/cmd/change/**'
      - 'docs/ENGINEERING_QUALITY_RULES.md'
      - '.github/workflows/review-packet-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load locked toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION:?}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE:?}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256:?}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: app/go.sum
      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Install locked protobuf generators
        shell: bash
        run: |
          set -euo pipefail
          make rpc-tools rpc-toolchain-check
      - name: Build command and run review packet regressions
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          go build -mod=readonly -o "$RUNNER_TEMP/yunka" ./cmd
          go test ./cmd/change -count=1
          go test ./cmd/change -run '^(TestStructuralRefactorProjectsExplicitZeroSemanticDelta|TestBehaviorChangeSurfacesCanonicalInvariantAPIAndPersistenceFacts|TestCandidateDigestDetectsSamePathContentMutation|TestChangedPathDigestChangesWhenCandidatePathSetChanges|TestReviewPacketValidationRejectsNarrativeOrEvidenceTamper|TestReviewPacketRenderingIsDeterministicAcrossHumanAndAgentSurfaces)$' -count=1 -v
      - name: Prove qualification did not mutate checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
