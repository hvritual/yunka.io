name: c4-1-rpc-regenerate

on:
  push:
    branches:
      - fix/c4-1-module-publication-convergence
    paths:
      - .github/workflows/c4-1-rpc-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BRANCH: fix/c4-1-module-publication-convergence
      RC_VERSION: v0.1.0-c41rc4
      GONOPROXY: github.com/hvritual/yunka.io/*
      GONOSUMDB: github.com/hvritual/yunka.io/*
    steps:
      - name: Checkout C4.1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/c4-1-module-publication-convergence
          fetch-depth: 0

      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Regenerate canonical protobuf outputs
        shell: bash
        run: |
          set -euo pipefail
          make toolchain-check

          # RC3 was a real published candidate and must not be reused even though its
          # failed qualification removed the refs: module proxies may cache versions.
          for file in framework/go.mod gateway/go.mod app/go.mod tools/module-release.env docs/waves/C4.1-module-publication-convergence.md; do
            if [[ -f "$file" ]]; then
              sed -i 's/v0\.1\.0-c41rc3/v0.1.0-c41rc4/g' "$file"
            fi
          done

          # The initial module-path migration intentionally updated .proto go_package
          # declarations, but textual replacement also touched generated raw descriptor
          # literals. Regenerate from canonical proto sources so descriptor lengths and
          # generated metadata match the new GitHub module paths.
          make rpc-generate
          make rpc-check

          # Prepare each module independently without committing any sibling replace.
          (cd pkg && GOWORK=off go mod tidy)
          (cd framework && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg)
          (cd gateway && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/framework=../framework && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/framework)
          (cd app && \
            GOWORK=off go mod edit -replace=github.com/hvritual/yunka.io/pkg=../pkg && \
            GOWORK=off go mod tidy && \
            GOWORK=off go mod edit -dropreplace=github.com/hvritual/yunka.io/pkg)

          rm -f go.work.sum

          if grep -n '^replace ' pkg/go.mod framework/go.mod gateway/go.mod; then
            echo 'publishable module go.mod contains replace directive' >&2
            exit 1
          fi
          grep -q 'github.com/go-kit/kit v0.13.0' pkg/go.mod
          grep -q 'google.golang.org/genproto v0.0.0-20260810153831-ec0a7760b754' pkg/go.mod
          test -f pkg/internal/dependencyanchor/genproto.go
          if grep -R -n 'v0.1.0-c41rc3' framework/go.mod gateway/go.mod app/go.mod tools/module-release.env; then
            echo 'RC3 sibling reference remains in RC4 contract' >&2
            exit 1
          fi

          # This is the exact failure surface from RC3. Importing rpc/meta must now
          # initialize descriptors without protobuf raw-descriptor corruption.
          (cd gateway && go test ./rpc/meta)

          cat >> docs/waves/C4.1-module-publication-convergence.md <<'EOF'

          ## RC4 protobuf regeneration

          RC3 made the dependency graph independently resolvable and tidy-stable, then
          exposed a source-artifact defect in gateway RPC initialization. The original
          C4.1 path migration had text-replaced module paths inside generated `.pb.go`
          raw descriptor literals. Those literals are length-delimited protobuf binary
          data, so increasing the embedded `go_package` path length without regeneration
          corrupted descriptor framing and caused `google.golang.org/protobuf` to panic
          in `unmarshalSeed`.

          RC4 regenerates all canonical protobuf Go outputs from the migrated `.proto`
          sources using the repository-locked protoc/protoc-gen-go toolchain. No RPC ABI
          is intentionally changed; this repairs generated descriptor encoding so it is
          consistent with the already-migrated GitHub module paths. RC4 uses a fresh
          module version because a previously pushed RC version must be treated as
          immutable even if its failed qualification removed the Git refs.
          EOF

      - name: Commit exact RC4 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/c4-1-rpc-regenerate.yml
          git add -A
          git commit -m 'build: regenerate C4.1 protobuf descriptors'
          git push origin "HEAD:${BRANCH}"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish RC4 tags and qualify exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            git push origin \
              :refs/tags/pkg/${RC_VERSION} \
              :refs/tags/framework/${RC_VERSION} \
              :refs/tags/gateway/${RC_VERSION} || true
          }
          trap cleanup ERR

          for prefix in pkg framework gateway; do
            if git ls-remote --exit-code --tags origin "refs/tags/${prefix}/${RC_VERSION}" >/dev/null 2>&1; then
              echo "RC4 tag already exists: ${prefix}/${RC_VERSION}" >&2
              exit 1
            fi
            git tag "${prefix}/${RC_VERSION}" "$CANDIDATE_SHA"
          done
          git push origin \
            "refs/tags/pkg/${RC_VERSION}" \
            "refs/tags/framework/${RC_VERSION}" \
            "refs/tags/gateway/${RC_VERSION}"

          for prefix in pkg framework gateway; do
            resolved="$(git ls-remote --tags origin "refs/tags/${prefix}/${RC_VERSION}" | awk '{print $1}')"
            test "$resolved" = "$CANDIDATE_SHA"
          done

          echo '==> source workspace qualification'
          for module in pkg framework gateway app; do
            echo "==> workspace ${module}"
            (cd "$module" && go test ./... && go vet ./... && go build ./...)
          done

          echo '==> standalone module qualification'
          for module in pkg framework gateway app; do
            echo "==> GOWORK=off ${module}"
            (cd "$module" && \
              GOWORK=off go list -m all >/dev/null && \
              GOWORK=off go test ./... && \
              GOWORK=off go vet ./... && \
              GOWORK=off go build ./...)
          done

          echo '==> clean external consumer qualification'
          tmp="$(mktemp -d)"
          cd "$tmp"
          GOWORK=off go mod init yunka-c41-rc4-external-probe >/dev/null
          GOWORK=off go get "github.com/hvritual/yunka.io/pkg@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/framework@${RC_VERSION}"
          GOWORK=off go get "github.com/hvritual/yunka.io/gateway@${RC_VERSION}"
          GOWORK=off go list -m all >/dev/null
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/pkg)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/framework)" = "$RC_VERSION"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/hvritual/yunka.io/gateway)" = "$RC_VERSION"
          cd - >/dev/null
          rm -rf "$tmp"

          trap - ERR
          echo "C4.1 RC4 qualified at ${CANDIDATE_SHA}"
