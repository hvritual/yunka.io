name: biz-c8-4-builder

on:
  push:
    branches:
      - agent/biz-c8-4-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/biz-c8-4-builder

      - name: Load locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: true
          cache-dependency-path: |
            app/go.sum
            framework/go.sum
            gateway/go.sum
            pkg/go.sum

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Generate and verify rebuilt biz
        shell: bash
        env:
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz?parseTime=true&charset=utf8mb4&loc=UTC&multiStatements=true
        run: |
          set -euo pipefail
          YUNKA_BASE=cdf7d933758d3c94e03a5601801dbf84d8144d00
          git merge-base --is-ancestor "$YUNKA_BASE" HEAD
          test "$(git rev-parse "$YUNKA_BASE^{tree}")" = "0cb7ec037a4cb25379a1d870785980b76e6141da"

          make rpc-tools
          PROTOC="$(command -v protoc)"
          PROTOC_INCLUDE="$RUNNER_TEMP/protoc/include"
          PROTOC_GEN_GO="$GITHUB_WORKSPACE/.yunka/bin/protoc-gen-go"
          PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/.yunka/bin/protoc-gen-go-grpc"

          WORK="$RUNNER_TEMP/biz-c8-4-workspace"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          ln -s "$GITHUB_WORKSPACE" "$WORK/yunka.io"
          python3 -c 'import base64,glob,sys; data=b"".join(open(path,"rb").read() for path in sorted(glob.glob("tools/biz-c8-4-seed.part-*"))); sys.stdout.buffer.write(base64.b64decode(data, validate=True))' | tar -xz -C "$WORK"
          mv "$WORK/biz_seed" "$WORK/biz"
          BIZ="$WORK/biz"

          mkdir -p "$RUNNER_TEMP/biz-module-custom"
          mv "$BIZ/modules/deviceops/custom_config.go" "$RUNNER_TEMP/biz-module-custom/config.go"
          mv "$BIZ/modules/deviceops/custom_module.go" "$RUNNER_TEMP/biz-module-custom/module.go"
          rm -rf "$BIZ/modules/deviceops"

          cd "$GITHUB_WORKSPACE/app"
          go run ./cmd init --root "$BIZ" --db-prefix biz
          go run ./cmd module new --name deviceops --root "$BIZ/modules" --database primary
          rm "$BIZ/modules/deviceops/config.go" "$BIZ/modules/deviceops/module.go"
          mv "$RUNNER_TEMP/biz-module-custom/config.go" "$BIZ/modules/deviceops/config.go"
          mv "$RUNNER_TEMP/biz-module-custom/module.go" "$BIZ/modules/deviceops/module.go"
          go run ./cmd domain new --name deviceops --root "$BIZ/internal"

          cd "$BIZ/contracts/proto"
          "$PROTOC" \
            -I . \
            -I "$BIZ/contracts/third_party" \
            -I "$GITHUB_WORKSPACE/contracts/proto" \
            -I "$PROTOC_INCLUDE" \
            --plugin=protoc-gen-go="$PROTOC_GEN_GO" \
            --plugin=protoc-gen-go-grpc="$PROTOC_GEN_GO_GRPC" \
            --go_out="$BIZ" \
            --go_opt=module=github.com/hvritual/biz \
            --go-grpc_out="$BIZ" \
            --go-grpc_opt=module=github.com/hvritual/biz,require_unimplemented_servers=false \
            deviceops/v1/deviceops.proto

          cd "$GITHUB_WORKSPACE/app"
          go run ./cmd contract generate \
            --proto-dir "$BIZ/contracts/proto" \
            --proto-path "$BIZ/contracts/third_party" \
            --proto-path "$GITHUB_WORKSPACE/contracts/proto" \
            --file deviceops/v1/deviceops.proto \
            --out "$BIZ/contracts/generated" \
            --title "biz API" \
            --version "1.0.0" \
            --application-out "$BIZ/internal" \
            --application-import github.com/hvritual/biz/internal

          find "$BIZ" -type f -name '*.go' -print0 | xargs -0 gofmt -w
          cd "$BIZ"
          go mod tidy

          cd "$GITHUB_WORKSPACE/app"
          go run ./cmd domain check --root "$BIZ/internal"
          go run ./cmd module check --root "$BIZ/modules"
          go run ./cmd contract check \
            --proto-dir "$BIZ/contracts/proto" \
            --proto-path "$BIZ/contracts/third_party" \
            --proto-path "$GITHUB_WORKSPACE/contracts/proto" \
            --file deviceops/v1/deviceops.proto \
            --out "$BIZ/contracts/generated" \
            --title "biz API" \
            --version "1.0.0" \
            --application-out "$BIZ/internal" \
            --application-import github.com/hvritual/biz/internal

          cd "$BIZ"
          go test ./...
          CGO_ENABLED=1 go test -race ./...
          go vet ./...
          go build ./...
          go test -count=1 -tags=integration ./integration

          git init -q
          git config user.name yunka-builder
          git config user.email yunka-builder@users.noreply.github.com
          git add -A
          git commit -q -m baseline
          make generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE" \
            PROTOC="$PROTOC" \
            PROTOC_INCLUDE="$PROTOC_INCLUDE" \
            PROTOC_GEN_GO="$PROTOC_GEN_GO" \
            PROTOC_GEN_GO_GRPC="$PROTOC_GEN_GO_GRPC"
          find . -type f -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --exit-code
          make check YUNKA_ROOT="$GITHUB_WORKSPACE"
          git diff --exit-code
          rm -rf .git

          RESULT_TAR="$RUNNER_TEMP/biz-c8-4-result.tar.gz"
          RESULT_B64="$RUNNER_TEMP/biz-c8-4-result.b64"
          tar -czf "$RESULT_TAR" -C "$WORK" biz
          base64 -w0 "$RESULT_TAR" > "$RESULT_B64"
          rm -f "$GITHUB_WORKSPACE"/tools/biz-c8-4-result.part-*
          split -b 4000 -d -a 3 "$RESULT_B64" "$GITHUB_WORKSPACE/tools/biz-c8-4-result.part-"
          sha256sum "$RESULT_TAR" | awk '{print $1}' > "$GITHUB_WORKSPACE/tools/biz-c8-4-result.sha256"
          FILES="$(find "$BIZ" -type f | wc -l | tr -d ' ')"
          PARTS="$(find "$GITHUB_WORKSPACE/tools" -maxdepth 1 -name 'biz-c8-4-result.part-*' | wc -l | tr -d ' ')"
          cat > "$GITHUB_WORKSPACE/tools/biz-c8-4-result.meta" <<META
          framework_main=$YUNKA_BASE
          framework_tree=0cb7ec037a4cb25379a1d870785980b76e6141da
          mysql=8.4
          go=$($(go env GOROOT)/bin/go version | awk '{print $3}')
          protoc=$($PROTOC --version | awk '{print $2}')
          files=$FILES
          parts=$PARTS
          validation=domain-check,module-check,contract-check,test,race,vet,build,mysql-integration,determinism
          META

      - name: Publish verified result with local git
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/biz-c8-4-seed.part-* tools/biz-c8-4-seed.sha256
          git config user.name "yunka-builder"
          git config user.email "yunka-builder@users.noreply.github.com"
          git add -A tools/biz-c8-4-result.part-* tools/biz-c8-4-result.sha256 tools/biz-c8-4-result.meta tools/biz-c8-4-seed.part-* tools/biz-c8-4-seed.sha256
          git commit -m "ci: publish verified biz C8.4 rebuild"
          git push origin HEAD:agent/biz-c8-4-builder
