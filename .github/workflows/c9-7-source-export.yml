name: c9-7-source-export

on:
  push:
    branches:
      - agent/c9-7-execution-semantics
    paths:
      - .github/workflows/c9-7-source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c9-7-execution-semantics
          fetch-depth: 0
      - name: Build source payload
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/yunka-c9-7.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/yunka-c9-7.tar.gz" > "$RUNNER_TEMP/yunka-c9-7.tar.gz.sha256"
      - name: Upload source payload
        uses: actions/upload-artifact@v4
        with:
          name: yunka-c9-7-source
          path: |
            ${{ runner.temp }}/yunka-c9-7.tar.gz
            ${{ runner.temp }}/yunka-c9-7.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Self-remove export workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/c9-7-source-export.yml
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add -A
          git commit -m "ci: remove temporary C9.7 source export"
          git push origin HEAD:agent/c9-7-execution-semantics
