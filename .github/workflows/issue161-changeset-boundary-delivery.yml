name: issue161-changeset-boundary-delivery
on:
  push:
    branches: [control/161-changeset-boundary-delivery]
    paths: [.github/workflows/issue161-changeset-boundary-delivery.yml]
permissions:
  contents: write
jobs:
  qualify-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      BASE_SHA: 62fe8e194b60637d8fee1d0bec90d9a67ccd9490
      EXPECTED_MAIN: 7d7fc663f7086df9735ee9089c75f65d2fd100e4
      TARGET_BRANCH: feat/161-changeset-boundary-proof
    steps:
      - name: Checkout isolated controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: controller
          persist-credentials: false
      - name: Checkout exact prerequisite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 62fe8e194b60637d8fee1d0bec90d9a67ccd9490
          path: candidate
          fetch-depth: 0
      - name: Checkout pre-authoring-gate CLI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f8fdce6c3bd7bd63eef05ae23b3fc9ba83c3b0de
          path: author
          persist-credentials: false
      - name: Checkout pinned read-only consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/iot-delivery-system
          ref: 69518dec46bdfaf45cb84a0ee25d64c132b26fc9
          path: consumer
          persist-credentials: false
      - name: Load locked toolchain and validate controller syntax
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C candidate rev-parse HEAD)" = "$BASE_SHA"
          source candidate/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('controller/tools/qualification/changeset-boundary').glob('*.py'):
              compile(p.read_text(),str(p),'exec')
          PY
          git -C candidate status --short --branch
          git -C candidate remote -v
          git -C controller rev-parse HEAD > evidence/controller-sha.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache-dependency-path: |
            candidate/app/go.sum
            candidate/framework/go.sum
            candidate/gateway/go.sum
            candidate/infras/go.sum
            candidate/pkg/go.sum
      - name: Install locked tools and build pre-change CLIs
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA: ${{ steps.lock.outputs.protoc_sha }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "$PROTOC_SHA  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          export PATH="$RUNNER_TEMP/protoc/bin:$GITHUB_WORKSPACE/candidate/.yunka/bin:$PATH"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/candidate/.yunka/bin" >> "$GITHUB_PATH"
          (cd candidate && make rpc-tools toolchain-check && go build -o "$RUNNER_TEMP/yunka-before" ./app/cmd)
          (cd author && go build -o "$RUNNER_TEMP/yunka-author" ./app/cmd)
      - name: Require the original source-only boundary gap
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          target=app/cmd/change/changeset_boundary_regression_test.go
          test ! -e "$target"
          cp ../controller/tools/qualification/changeset-boundary/changeset_boundary_regression_test.go "$target"
          set +e
          go test -count=1 -run '^TestIssue161SetBoundaryRejectsSourceOnlyIntentDrift$' ./app/cmd/change > ../evidence/before-RED.log 2>&1
          result=$?
          set -e
          cat ../evidence/before-RED.log
          test "$result" -ne 0
          grep -q 'BOUNDARY_PROOF_GAP: source-only architectural context drift was accepted' ../evidence/before-RED.log
          grep -q '^--- FAIL: TestIssue161SetBoundaryRejectsSourceOnlyIntentDrift' ../evidence/before-RED.log
          rm "$target"
          test -z "$(git status --porcelain)"
      - name: Apply exact authored integration and corrective changes then commit with Git
        shell: bash
        run: |
          set -euo pipefail
          python3 controller/tools/qualification/changeset-boundary/apply.py candidate
          python3 controller/tools/qualification/changeset-boundary/corrections.py candidate
          cd candidate
          git add -N .
          git diff --name-only -- '*.go' | xargs gofmt -w
          git diff --check
          test -z "$(git diff --name-only -- .github go.work go.work.sum '*/go.mod' '*/go.sum' pkg/contractdsl framework gateway infras)"
          git add .
          git config user.name hvritual
          git config user.email 11900351+hvritual@users.noreply.github.com
          git commit -m 'feat(boundary): persist and revalidate ChangeSet creation proofs' -m 'Bind complete Operation plans and immutable canonical inputs; independently reconstruct every declared addition without hiding base drift. Existing-only legacy ChangeSets retain compatibility. Preserve prior negative and Git-private tests without weakening proof checks. Direct-edit growth beyond create subjects remains separately scoped.'
          git show --stat --format=fuller HEAD | tee ../evidence/commit.txt
          git diff "$BASE_SHA" HEAD > ../evidence/product.patch
          git rev-parse HEAD > ../evidence/candidate-sha.txt
          git rev-parse HEAD^{tree} > ../evidence/candidate-tree.txt
          test -z "$(git status --porcelain)"
      - name: Real-protoc proof and all prerequisite tests
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -json ./app/cmd/add ./app/cmd/boundarycore ./app/cmd/boundary ./app/cmd/change ./app/cmd/projectflow ./app/cmd/agentcontext ./app/cmd ./pkg/contract ./pkg/architecturepolicy | tee ../evidence/targeted.jsonl
          python3 - <<'PY'
          import json
          events=[json.loads(s) for s in open('../evidence/targeted.jsonl')]
          focused=[e for e in events if e.get('Test','').startswith('TestIssue161')]
          assert focused and not any(e['Action'] in ('fail','skip') for e in focused)
          passed={e['Test'] for e in focused if e['Action']=='pass' and e['Test'].startswith('TestIssue161SetBoundary') and '/' not in e['Test']}
          expected={'TestIssue161SetBoundaryRejectsSourceOnlyIntentDrift','TestIssue161SetBoundaryProofRoundTripAndDetached','TestIssue161SetBoundaryRecomputesForgedProof','TestIssue161SetBoundaryLegacyExistingOnlyAndMissingAddition','TestIssue161SetBoundaryIndependentCreatesCannotHidePeerDrift','TestIssue161SetBoundaryExplicitIncludeBytesAndProfiles','TestIssue161SetBoundaryRejectsIgnoredBaselineDriftAndCancellation','TestIssue161SetBoundarySurvivesCommittedCheckoutRelocation','TestIssue161SetBoundaryRejectsMixedIncludeProfiles'}
          assert passed==expected,(passed,expected)
          assert len([e for e in events if e['Action']=='pass' and 'Test' not in e])==9
          print('All nine exact proof groups and nine packages passed without issue161 skips')
          PY
          go test -count=1 -race ./app/cmd/add ./app/cmd/projectflow ./app/cmd/boundarycore ./app/cmd/change | tee ../evidence/race.log
      - name: Complete canonical production and determinism qualification
        working-directory: candidate
        shell: bash
        env:
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
        run: |
          set -euo pipefail
          make verify-production 2>&1 | tee ../evidence/verify-production.log
          make tidy 2>&1 | tee ../evidence/determinism.log
          make contract 2>&1 | tee -a ../evidence/determinism.log
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Actual legacy-envelope CLI bypass on disposable consumer copies
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate && go build -o "$RUNNER_TEMP/yunka-after" ./app/cmd)
          cp controller/tools/qualification/changeset-boundary/consumer.py evidence/consumer.py
          python3 controller/tools/qualification/changeset-boundary/consumer.py "$RUNNER_TEMP/yunka-author" "$RUNNER_TEMP/yunka-before" "$RUNNER_TEMP/yunka-after" "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/consumer" "$GITHUB_WORKSPACE/evidence" | tee evidence/consumer.log
          test -z "$(git -C consumer status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"
      - name: Push the exact fully qualified Git candidate and read back
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(cat ../evidence/candidate-sha.txt)"
          tree="$(cat ../evidence/candidate-tree.txt)"
          test "$(git rev-parse HEAD)" = "$sha"
          test "$(git rev-parse HEAD^{tree})" = "$tree"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/161-operation-boundary-gate | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/$TARGET_BRANCH)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$sha"
          git fetch origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          git diff --exit-code HEAD FETCH_HEAD
          printf 'submitted=%s\ntree=%s\nbranch=%s\nbase=%s\nmain=%s\n' "$sha" "$tree" "$TARGET_BRANCH" "$BASE_SHA" "$EXPECTED_MAIN" | tee ../evidence/delivery.txt
      - name: Preserve exact candidate and execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if test -f evidence/candidate-sha.txt; then
            git -C candidate bundle create "$GITHUB_WORKSPACE/evidence/candidate.bundle" HEAD "^$BASE_SHA"
            git -C candidate bundle verify "$GITHUB_WORKSPACE/evidence/candidate.bundle" 2>&1 | tee evidence/bundle-verify.txt
          fi
          (cd evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue161-changeset-boundary-evidence
          path: evidence
          retention-days: 30
