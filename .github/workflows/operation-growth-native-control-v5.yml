name: operation-growth-native-control-v5

on:
  push:
    branches:
      - control/operation-growth-boundary-gate-20260917
    paths:
      - .github/workflows/operation-growth-native-control-v5.yml

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: control/operation-growth-boundary-gate-20260917
          path: controller
          fetch-depth: 0
      - name: Checkout exact product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/161-operation-growth-boundary-gate
          path: product
          fetch-depth: 0
      - name: Verify exact current-main base
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test "$(git rev-parse HEAD^{tree})" = "9fc4a864b2aa6c038e0c737c555df340321d8017"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
      - name: Load toolchain lock
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source product/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache-dependency-path: |
            product/app/go.sum
            product/framework/go.sum
            product/gateway/go.sum
            product/infras/go.sum
            product/pkg/go.sum
      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Materialize current-main candidate
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git fetch origin 23789633f2e0dbcd20230cacca42e814047d86bc f8fdce6c3bd7bd63eef05ae23b3fc9ba83c3b0de
          set -o pipefail
          {
            python3 ../controller/tools/operation_growth_native.py
            python3 ../controller/tools/operation_growth_native_fix1.py
            python3 ../controller/tools/operation_growth_native_fix2.py
            python3 ../controller/tools/operation_growth_native_fix3.py
            python3 ../controller/tools/operation_growth_native_fix4.py
            python3 ../controller/tools/operation_growth_native_fix5.py
          } 2>&1 | tee ../controller/tools/operation_growth_native_last.log
      - name: Regenerate and format owned changes
        shell: bash
        run: |
          set -euo pipefail
          cd product
          make rpc-generate
          gofmt -w \
            pkg/contract/boundary_intent.go pkg/contract/boundary_intent_test.go \
            pkg/contract/artifact.go pkg/contract/dsl_descriptor.go pkg/contract/inventory_provenance_test.go \
            pkg/contract/lint.go pkg/contract/model.go pkg/contract/operation_plan.go \
            app/cmd/boundarycore/inspect.go app/cmd/boundarycore/addition_scope.go app/cmd/boundarycore/decision.go \
            app/cmd/boundarycore/growth.go app/cmd/boundarycore/growth_test.go \
            app/cmd/add/boundary_gate.go app/cmd/add/boundary_gate_test.go app/cmd/add/command.go app/cmd/add/helpers.go \
            app/cmd/add/main_test.go app/cmd/add/ag06_2_test.go app/cmd/add/compile_test.go app/cmd/add/plan_test.go \
            app/cmd/add/operation.go app/cmd/add/plan_semantics.go app/cmd/add/plan_validation.go app/cmd/add/semantics.go \
            app/cmd/audit/boundary_growth.go app/cmd/audit/boundary_growth_test.go app/cmd/audit/command.go \
            app/cmd/change/architecture_debt.go app/cmd/change/verify.go app/cmd/change/operation_growth.go \
            app/cmd/change/changeset_reconcile.go app/cmd/change/changeset_remediation.go app/cmd/change/changeset_command.go \
            app/cmd/change/changeset_remediation_test.go app/cmd/change/pressure_qualification_test.go app/cmd/change/changeset_test.go \
            app/cmd/change/changeset_reconcile_test.go app/cmd/change/changeset_biz_regression_test.go \
            app/cmd/change/contract_sources_test.go
          make contract
          git diff --check
      - name: Create unpushed candidate commit
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "Yunka Delivery"
          git config user.email "quality-delivery@example.invalid"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(boundary): enforce semantic operation growth on current main"
          test "$(git rev-parse HEAD^)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test -z "$(git status --porcelain)"
          echo "candidate=$(git rev-parse HEAD)" | tee ../controller/tools/operation_growth_native_candidate.log
          echo "tree=$(git rev-parse HEAD^{tree})" | tee -a ../controller/tools/operation_growth_native_candidate.log
      - name: Run focused qualification
        shell: bash
        run: |
          set -euo pipefail
          cd product
          set -o pipefail
          {
            make toolchain-check
            (cd pkg && go test -count=1 ./contract)
            (cd app && go test -count=1 ./cmd/boundarycore ./cmd/add ./cmd/projectflow ./cmd/change ./cmd/audit ./cmd/auditcore)
            make tidy
            git diff --exit-code -- go.work go.work.sum pkg/go.mod pkg/go.sum framework/go.mod framework/go.sum gateway/go.mod gateway/go.sum infras/go.mod infras/go.sum app/go.mod app/go.sum
            make contract
            git diff --exit-code -- contracts/generated
            make contract-check
            git diff --check
            test -z "$(git status --porcelain)"
          } 2>&1 | tee ../controller/tools/operation_growth_native_qualification.log
      - name: Publish qualified current-main candidate
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD^)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test "$(git rev-parse origin/main)" = "01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
          test -z "$(git status --porcelain)"
          git push origin HEAD:fix/161-operation-growth-boundary-gate
          echo "candidate=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
      - name: Persist diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -u
          cd controller
          {
            echo "run=${GITHUB_RUN_ID}"
            echo "product_expected=01cf8157d8660e816cdc40cd5d36a2ff618a3dc8"
            for file in tools/operation_growth_native_last.log tools/operation_growth_native_candidate.log tools/operation_growth_native_qualification.log; do
              if [ -f "$file" ]; then
                echo
                echo "== $file =="
                tail -n 1400 "$file"
              fi
            done
          } > tools/operation_growth_native_last_failure.log
          git config user.name "Yunka Control"
          git config user.email "control@example.invalid"
          git add tools/operation_growth_native_last_failure.log
          if ! git diff --cached --quiet; then
            git commit -m "control: record operation growth v5 failure ${GITHUB_RUN_ID}"
            git push origin HEAD:control/operation-growth-boundary-gate-20260917
          fi
