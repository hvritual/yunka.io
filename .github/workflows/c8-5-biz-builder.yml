name: c8-5-biz-builder

on:
  push:
    branches:
      - agent/c8-5-biz-builder
    paths:
      - tools/c8-5-biz-seed.part-*
      - tools/c8-5-biz-seed.sha256
      - tools/c8-5-biz-seed.meta
      - tools/c8_5_biz_patch.py
      - tools/c8_5_biz_fix_makefile.py
      - .github/workflows/c8-5-biz-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Load locked toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: true
          cache-dependency-path: |
            app/go.sum
            framework/go.sum
            gateway/go.sum
            pkg/go.sum

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.toolchain.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.toolchain.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Reconstruct exact biz main seed and freeze baseline
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          BIZ_ROOT="$workspace_parent/biz"
          rm -rf "$BIZ_ROOT"
          cat tools/c8-5-biz-seed.part-* | base64 -d > "$RUNNER_TEMP/biz-seed.tgz"
          expected="$(tr -d '[:space:]' < tools/c8-5-biz-seed.sha256)"
          actual="$(sha256sum "$RUNNER_TEMP/biz-seed.tgz" | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -xzf "$RUNNER_TEMP/biz-seed.tgz" -C "$workspace_parent"
          test -f "$BIZ_ROOT/Makefile"
          test "$(find "$BIZ_ROOT" -type f | wc -l | tr -d ' ')" = "40"
          cd "$BIZ_ROOT"
          git init
          git config user.name "biz-c8-5-builder"
          git config user.email "biz-c8-5-builder@users.noreply.github.com"
          git add -A
          git commit -m "baseline: biz main bb718314"
          echo "root=$BIZ_ROOT" >> "$GITHUB_OUTPUT"
          echo "seed_sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Apply C8.5 biz domain/security refactor
        shell: bash
        env:
          BIZ_ROOT: ${{ steps.seed.outputs.root }}
        run: |
          set -euo pipefail
          python3 tools/c8_5_biz_patch.py "$BIZ_ROOT"
          python3 tools/c8_5_biz_fix_makefile.py "$BIZ_ROOT"
          find "$BIZ_ROOT/internal" "$BIZ_ROOT/modules" "$BIZ_ROOT/integration" -name '*.go' -print0 | xargs -0 gofmt -w

      - name: Generate from Yunka C8.5 main
        shell: bash
        env:
          BIZ_ROOT: ${{ steps.seed.outputs.root }}
        run: |
          set -euo pipefail
          make rpc-tools
          cd "$BIZ_ROOT"
          make generate
          make check

      - name: Static security-boundary guard
        shell: bash
        env:
          BIZ_ROOT: ${{ steps.seed.outputs.root }}
        run: |
          set -euo pipefail
          cd "$BIZ_ROOT"
          test ! -e internal/access/store/store.go
          test -f internal/access/domain/model.go
          test -f internal/access/infrastructure/persistence/store.go
          test -f internal/deviceops/security/scope.go
          ! grep -R -n -E 'device\.(read|create|update|delete)|ResolveGrants|ResolveDeviceScope|HasPermissions|Authorize\(' internal/deviceops/application --include='*.go' --exclude='*_test.go'
          grep -q 'OperationRuntime' internal/deviceops/transport/rest/zz_yunka_device_management_rest_adapter_gen.go
          grep -q 'Permissions()' internal/deviceops/policy/zz_yunka_device_management_operation_policy_gen.go
          grep -q 'SecuredUnaryServerInterceptor' modules/deviceops/module.go

      - name: Go test race vet build
        shell: bash
        env:
          BIZ_ROOT: ${{ steps.seed.outputs.root }}
        run: |
          set -euo pipefail
          cd "$BIZ_ROOT"
          go test ./...
          CGO_ENABLED=1 go test -race ./...
          go vet ./...
          go build ./...

      - name: MySQL 8.4 C8.5 integration
        shell: bash
        env:
          BIZ_ROOT: ${{ steps.seed.outputs.root }}
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz?parseTime=true&charset=utf8mb4&loc=UTC
        run: |
          set -euo pipefail
          cd "$BIZ_ROOT"
          go test -count=1 -tags=integration ./integration

      - name: Generation determinism and zero drift
        shell: bash
        env:
          BIZ_ROOT: ${{ steps.seed.outputs.root }}
        run: |
          set -euo pipefail
          cd "$BIZ_ROOT"
          git add -A
          make generate
          make check
          git diff --exit-code
          git diff --cached --check

      - name: Publish verified biz Git patch
        shell: bash
        env:
          BIZ_ROOT: ${{ steps.seed.outputs.root }}
          SEED_SHA: ${{ steps.seed.outputs.seed_sha }}
        run: |
          set -euo pipefail
          cd "$BIZ_ROOT"
          git diff --cached --binary HEAD > "$GITHUB_WORKSPACE/tools/c8-5-biz-result.patch"
          cd "$GITHUB_WORKSPACE"
          patch_sha="$(sha256sum tools/c8-5-biz-result.patch | awk '{print $1}')"
          rm -f tools/c8-5-biz-result.part-* tools/c8-5-biz-result.sha256 tools/c8-5-biz-result.meta
          split -b 4000 -d -a 3 tools/c8-5-biz-result.patch tools/c8-5-biz-result.part-
          printf '%s\n' "$patch_sha" > tools/c8-5-biz-result.sha256
          printf 'biz_main=bb718314cd129775d4421e52727b4ec4a7a2dadf\nyunka_main=97b15d732269c4ec63f212cbf2deaecc2551e02e\nseed_sha=%s\npatch_sha=%s\nparts=%s\n' \
            "$SEED_SHA" "$patch_sha" "$(find tools -maxdepth 1 -name 'c8-5-biz-result.part-*' | wc -l | tr -d ' ')" > tools/c8-5-biz-result.meta
          rm tools/c8-5-biz-result.patch
          git config user.name "yunka-c8-5-biz-builder"
          git config user.email "yunka-c8-5-biz-builder@users.noreply.github.com"
          git add tools/c8-5-biz-result.*
          git commit -m "ci: publish verified C8.5 biz patch"
          git push origin HEAD:agent/c8-5-biz-builder
