syntax = "proto3";
package io.yunka.gateway.rpc;

import "gateway/api_common.proto";
import "gateway/common.proto";

option go_package = "github.com/hvritual/yunka.io/gateway/rpc/meta;meta";

message OperateRuntimeApiResponse {
    ResponseCode code = 1;
    string msg = 2;
}

message DeleteRuntimeApiRequest {
    string uuid = 1;
    string uri = 2;
}

message OperateRoleResponse {
    ResponseCode code = 1;
    string msg = 2;
}

message RoleModuleBtn {
    string orgUUID = 1;
    string roleUUID = 2;
    repeated string moduleBtnUUID = 3 [deprecated = true];
    repeated string deleteModuleBtnUUID = 4 [deprecated = true];
    // C8.3: roles own permissions, never buttons.
    repeated string permissions = 5;
    repeated string deletePermissions = 6;
}

message RuntimeApiModuleButton {
    string apiUUID = 1;
    string moduleBtnUUID = 2;
    // Button visibility references the same permission vocabulary as API
    // authorization. It is not itself an authorization grant.
    repeated string permissions = 3;
}

message BatchRuntimeApiRequest {
    repeated RuntimeApi apis = 1;
    repeated RuntimeApiModuleButton buttons = 2;
}

message LockEnterpriseRequest { string enterpriseUUID = 1; }

service GatewayService {
    rpc BatchAddRuntimeApi (BatchRuntimeApiRequest) returns (OperateRuntimeApiResponse);
    rpc DeleteRuntimeApi (DeleteRuntimeApiRequest) returns (OperateRuntimeApiResponse);
    rpc OperateRoleAPI (RoleModuleBtn) returns (OperateRoleResponse);
}
