syntax = "proto3";

package yunka.dsl.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/hvritual/yunka.io/pkg/contractdsl/v1;contractdslv1";

enum DTOKind {
  DTO_UNSPECIFIED = 0;
  DTO_INPUT = 1;
  DTO_OUTPUT = 2;
  DTO_SHARED = 3;
  DTO_EVENT = 4;
  DTO_VALUE_OBJECT = 5;
}

enum PermissionMode {
  PERMISSION_ALL = 0;
  PERMISSION_ANY = 1;
}

enum Authentication {
  AUTHENTICATION_UNSPECIFIED = 0;
  AUTHENTICATION_JWT = 1;
  AUTHENTICATION_API_KEY = 2;
  AUTHENTICATION_SERVICE = 3;
}

message DomainDeclaration {
  string name = 1;
  string version = 2;
}

message DTODeclaration {
  DTOKind kind = 1;
}

// CapabilityRequirement declares one process/App-scoped constructor dependency.
// The compiler carries the logical key and Go contract identity into AssemblyPlan
// and generated Application dependency structs; runtime values are resolved only
// during bootstrap and are never exposed through a business service locator.
message CapabilityRequirement {
  string name = 1;
  string go_package = 2;
  string go_type = 3;
}

message ApplicationDeclaration {
  string name = 1;
  // Stable application capability keys in <domain>/<application> form.
  repeated string requires = 2;
  // Canonical Operations that belong to this Application but have no
  // transport binding. These operations are available to typed local child
  // capabilities without becoming protobuf RPC methods.
  repeated OperationDeclaration operations = 3;
  // Process/App-scoped infrastructure capabilities required by this
  // Application constructor. These are distinct from cross-Application
  // requires edges and from Operation requires_operations edges.
  repeated CapabilityRequirement capabilities = 4;
}

enum CompositionBoundary {
  COMPOSITION_UNSPECIFIED = 0;
  COMPOSITION_LOCAL = 1;
  COMPOSITION_REMOTE_SAGA = 2;
}

enum TransactionPolicy {
  TRANSACTION_UNSPECIFIED = 0;
  TRANSACTION_NONE = 1;
  TRANSACTION_READ_ONLY = 2;
  TRANSACTION_LOCAL = 3;
}

enum IdempotencyPolicy {
  IDEMPOTENCY_UNSPECIFIED = 0;
  IDEMPOTENCY_NONE = 1;
  IDEMPOTENCY_REQUIRED = 2;
}

message ExecutionPolicy {
  // Execution semantics are explicit contract facts. They must never be
  // inferred from transport verbs or method names.
  TransactionPolicy transaction = 1;
  IdempotencyPolicy idempotency = 2;
}

message OperationDeclaration {
  string id = 1;
  string use_case = 2;
  repeated string permissions = 3;
  PermissionMode permission_mode = 4;
  bool tenant_required = 5;
  repeated Authentication authentication = 6;
  bool public = 7;
  // Stable operation IDs invoked as internal capabilities by this use case.
  repeated string requires_operations = 8;
  CompositionBoundary composition = 9;
  ExecutionPolicy execution = 10;
  // Application-level Operations must declare their typed Application method
  // and request/response protobuf types explicitly. Method-bound Operations
  // may omit these fields; the compiler derives them from the RPC method and
  // rejects explicit values that disagree.
  string request_type = 11;
  string response_type = 12;
  string application_method = 13;
}

extend google.protobuf.FileOptions {
  DomainDeclaration domain = 51001;
}

extend google.protobuf.MessageOptions {
  DTODeclaration dto = 51002;
}

extend google.protobuf.ServiceOptions {
  ApplicationDeclaration application = 51003;
}

extend google.protobuf.MethodOptions {
  OperationDeclaration operation = 51004;
}
